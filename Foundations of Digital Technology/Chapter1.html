            {"q": "Digital technology encompasses electronic devices, software systems, and resources that facilitate data creation and storage.", "o": ["True", "False"], "a": 0, "e": "True: Digital technology encompasses electronic devices, software systems, and resources.", "type": "TF"},
            {"q": "The very first mobile phone was constructed in 1983, preceding commercial digital cell phone sales in 1991.", "o": ["True", "False"], "a": 0, "e": "True: The first mobile phone was made in 1983, and commercial cell phones started in 1991.", "type": "TF"},
            {"q": "The first digital camera was created in the year 1988.", "o": ["True", "False"], "a": 0, "e": "True: The first digital camera was created in 1988.", "type": "TF"},
            {"q": "Television broadcasting began transitioning from analog to digital signals during the 2000s decade.", "o": ["True", "False"], "a": 0, "e": "True: Television started to transition from analog to digital signals in the 2000s.", "type": "TF"},
            {"q": "IT professionals include specialized roles such as cybersecurity experts, network administrators, and software developers.", "o": ["True", "False"], "a": 0, "e": "True: IT professionals work as support specialists, network administrators, developers, and cybersecurity experts.", "type": "TF"},
            {"q": "Improvements in logistics performance and fuel economy over the past decade reduced aggregate costs and fossil fuel consumption.", "o": ["True", "False"], "a": 0, "e": "True: Improvements in logistics and fuel economy contributed to reducing costs and fossil fuel energy consumption.", "type": "TF"},
            {"q": "The biggest impact of the digital revolution on low- and middle-income countries occurs through manufacturing process technologies affecting traditional goods.", "o": ["True", "False"], "a": 0, "e": "True: The biggest impact on low- and middle-income countries is through new manufacturing process technologies.", "type": "TF"},
            {"q": "Artificial Intelligence, Big Data, Blockchain, IoT, and Quantum Computing are classified as next-generation technologies.", "o": ["True", "False"], "a": 0, "e": "True: These are emerging next-generation technologies discussed in the course.", "type": "TF"},
            {"q": "5G networks enable critical advancements in IoT, autonomous vehicles, AR, and VR.", "o": ["True", "False"], "a": 0, "e": "True: 5G enables advancements in IoT, autonomous vehicles, AR, and VR.", "type": "TF"},
            {"q": "Tablet computers made accessing the internet and digital resources significantly more difficult and stationary.", "o": ["True", "False"], "a": 1, "e": "False: Tablets made it much easier to use the internet everywhere.", "type": "TF"},
            {"q": "Information technology solves business or organizational problems on a large scale.", "o": ["True", "False"], "a": 0, "e": "True: IT involves using technology to solve business or organizational problems on a large scale.", "type": "TF"},
            {"q": "The textile industry demanded cheaper labor through early mechanization during the Industrial Revolution.", "o": ["True", "False"], "a": 0, "e": "True: The textile industry was much demanding cheaper labor during mechanization.", "type": "TF"},
            {"q": "Digital technology is continually changing and boosting productivity across a wide range of sectors and industries.", "o": ["True", "False"], "a": 0, "e": "True: Digital technology is continually changing and boosting productivity across industries.", "type": "TF"},
            {"q": "Commercial digital cell phones were first sold starting in 1991.", "o": ["True", "False"], "a": 0, "e": "True: Digital cell phones were sold commercially starting in 1991.", "type": "TF"},
            {"q": "ARPANET was initially developed in 1947 alongside the transistor.", "o": ["True", "False"], "a": 1, "e": "False: Transistor was 1947; ARPANET was 1969.", "type": "TF"},
            {"q": "Microprocesses enable the data processing and logic capabilities of digital technologies.", "o": ["True", "False"], "a": 0, "e": "True: Data processing and logic capabilities are enabled through microprocesses.", "type": "TF"},
            {"q": "Software developers are primarily responsible for delivering physical mail packages to corporate offices.", "o": ["True", "False"], "a": 1, "e": "False: Software developers write code and build applications, not deliver postal mail.", "type": "TF"},
            {"q": "Network administrators focus on configuring, managing, and securing organizational computer networks.", "o": ["True", "False"], "a": 0, "e": "True: Network administrators are core IT professionals managing networks.", "type": "TF"},
            {"q": "Cybersecurity experts protect organizational information systems and networks from digital threats.", "o": ["True", "False"], "a": 0, "e": "True: Cybersecurity is a core area of IT ensuring security.", "type": "TF"},
            {"q": "The digital revolution relies strictly on mechanical gears and analog waterwheels for information processing.", "o": ["True", "False"], "a": 1, "e": "False: The digital revolution represents a shift to digital electronics.", "type": "TF"},
            {"q": "Industry 4.0 integrates digital technologies like IoT, AI, and automation into manufacturing processes.", "o": ["True", "False"], "a": 0, "e": "True: Industry 4.0 integrates IoT, AI, and automation in manufacturing.", "type": "TF"},
            {"q": "Cloud computing eliminates the need for any physical servers or data transmission networks anywhere on Earth.", "o": ["True", "False"], "a": 1, "e": "False: Cloud computing relies on massive hyperscale data centers and network transmission.", "type": "TF"},
            {"q": "Most businesses employ digital technology to streamline operations, optimize processes, and enhance customer experience.", "o": ["True", "False"], "a": 0, "e": "True: Businesses employ digital technology to streamline operations and enhance customer experience.", "type": "TF"},
            {"q": "The invention of the World Wide Web by Tim Berners-Lee took place in 1989.", "o": ["True", "False"], "a": 0, "e": "True: WWW started in 1989 by Tim Berners-Lee.", "type": "TF"},
            {"q": "Digital literacy across society is an optional luxury with zero impact on digital transformation success.", "o": ["True", "False"], "a": 1, "e": "False: Individuals have become more digitally literate at all levels as technology usage expands.", "type": "TF"},
            {"q": "Mobile phone technology originated with the first device made in 1983.", "o": ["True", "False"], "a": 0, "e": "True: The first mobile phone was constructed in 1983.", "type": "TF"},
            {"q": "Analog television broadcasting completely replaced digital television signals during the 2000s.", "o": ["True", "False"], "a": 1, "e": "False: Television transitioned *from* analog *to* digital signals in the 2000s.", "type": "TF"},
            {"q": "The digital divide between developed and developing nations is untouched by mobile digital platforms.", "o": ["True", "False"], "a": 1, "e": "False: Mobile communication and digital technologies spread globally to developing countries.", "type": "TF"},
            {"q": "Binary data representation utilizes discrete symbols (0s and 1s) rather than continuous waveforms.", "o": ["True", "False"], "a": 0, "e": "True: Digital refers to representing data using discrete symbols or binary digits (0s and 1s).", "type": "TF"},
            {"q": "IT support specialists troubleshoot hardware and software problems for end-users.", "o": ["True", "False"], "a": 0, "e": "True: IT support specialists are core IT professionals.", "type": "TF"},
            {"q": "The milestone of one billion internet users was achieved around late 2005.", "o": ["True", "False"], "a": 0, "e": "True: By late 2005, internet users reached one billion.", "type": "TF"},
            {"q": "By 2020, over half of the global human population actively utilized the internet.", "o": ["True", "False"], "a": 0, "e": "True: By 2020, more than half of the world's population actively used the internet.", "type": "TF"},
            {"q": "The discrete cosine transform is an irrelevant mathematical concept with no application in digital media.", "o": ["True", "False"], "a": 1, "e": "False: Discrete cosine transform is fundamental to digital media compression standards.", "type": "TF"},
            {"q": "Emerging technologies discussed in foundational overviews include quantum computing, AI, blockchain, and Big Data.", "o": ["True", "False"], "a": 0, "e": "True: These are key next-generation technologies.", "type": "TF"},
            
            // High-Level TFs (46-50)
            {"q": "[HIGH-LEVEL] Digital literacy and user-friendly technology design played absolutely zero role in the rapid mass adoption of internet and mobile technologies during the digital revolution.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] As technology became more user-friendly, society experienced increased digital literacy and mass adoption.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The transition from analog to digital television signals occurred in the 1940s before the invention of the transistor.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] The digital television transition occurred during the 2000s, long after the 1947 transistor.", "type": "TF"},
            {"q": "[HIGH-LEVEL] An organization can achieve complete digital transformation security solely by purchasing advanced 5G hardware, rendering cybersecurity governance and IT professionals entirely unnecessary.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Hardware connectivity alone cannot replace skilled IT professionals, cybersecurity experts, and governance.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The impact of the digital revolution on low- and middle-income countries is restricted entirely to agricultural crop rotation methods without affecting traditional manufactured goods.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] The biggest impact on low- and middle-income countries occurs through new manufacturing process technologies affecting traditional goods.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The foundational shift from mechanical and analog devices to digital electronics since the 1940s has driven continuous productivity enhancements and structural efficiency across industry sectors.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Digital technology continually changes and boosts productivity across a wide range of sectors and industries.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
