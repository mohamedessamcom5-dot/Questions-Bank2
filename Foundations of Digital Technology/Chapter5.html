            gap: 12px;

        .tab-btn {

            background: var(--c);

            color: var(--t);
            border-radius: 8px;
            font-weight: bold;

            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);

            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);

            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;

        .opt.no { background: var(--nob); border-color: var(--no); }

            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;

        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>

            {"q": "Customer Lifetime Value (CLV) predicts total financial revenue from a customer over their relationship.", "o": ["True", "False"], "a": 0, "e": "True: CLV estimates long-term customer profitability.", "type": "TF"},
            {"q": "Supply chain visibility provides end-to-end real-time tracking of inventory and shipments.", "o": ["True", "False"], "a": 0, "e": "True: Supply chain visibility ensures tracking transparency.", "type": "TF"},
            {"q": "The bullwhip effect describes demand forecast distortions multiplying as they move up the supply chain.", "o": ["True", "False"], "a": 0, "e": "True: Bullwhip effect amplifies demand variability upstream.", "type": "TF"},
            {"q": "Enterprise portals provide single-point web access to corporate applications and information.", "o": ["True", "False"], "a": 0, "e": "True: Portals offer unified web access to corporate tools.", "type": "TF"},
            {"q": "Data warehouses centralize aggregated data from various operational systems for analytical reporting.", "o": ["True", "False"], "a": 0, "e": "True: Data warehouses store integrated historical data for BI.", "type": "TF"},
            {"q": "Data mining uncovers hidden patterns, correlations, and anomalies within large datasets.", "o": ["True", "False"], "a": 0, "e": "True: Data mining extracts hidden patterns from big data.", "type": "TF"},
            {"q": "Customer churn rate measures the percentage of customers who stop doing business with a company.", "o": ["True", "False"], "a": 0, "e": "True: Churn rate tracks customer attrition over time.", "type": "TF"},
            {"q": "Omnichannel retailing unifies physical and digital customer shopping touchpoints seamlessly.", "o": ["True", "False"], "a": 0, "e": "True: Omnichannel integrates physical and online shopping experiences.", "type": "TF"},
            {"q": "B2B2C e-commerce involves partnering with intermediary businesses to reach final consumers.", "o": ["True", "False"], "a": 0, "e": "True: B2B2C reaches consumers through business intermediaries.", "type": "TF"},
            {"q": "Crowdsourcing solicits ideas, services, or funding from distributed online communities.", "o": ["True", "False"], "a": 0, "e": "True: Crowdsourcing leverages online collective contributions.", "type": "TF"},
            {"q": "Enterprise Risk Management (ERM) provides a structured framework for managing enterprise risks.", "o": ["True", "False"], "a": 0, "e": "True: ERM manages organization-wide risks systematically.", "type": "TF"},
            {"q": "Business Process Reengineering (BPR) involves radical redesign of workflows for massive performance gains.", "o": ["True", "False"], "a": 0, "e": "True: BPR radically transforms core business processes.", "type": "TF"},
            {"q": "APIs enable disparate software systems to interoperate and share data programmatically.", "o": ["True", "False"], "a": 0, "e": "True: APIs allow applications to communicate with each other.", "type": "TF"},
            {"q": "Cloud ERP delivers enterprise resource planning software over the cloud on demand.", "o": ["True", "False"], "a": 0, "e": "True: Cloud ERP hosts enterprise systems on cloud infrastructure.", "type": "TF"},
            {"q": "Click-and-mortar businesses combine physical retail storefronts with online e-commerce channels.", "o": ["True", "False"], "a": 0, "e": "True: Click-and-mortar integrates physical and digital retail.", "type": "TF"},
            {"q": "Pure-play e-commerce enterprises operate exclusively online without physical retail stores.", "o": ["True", "False"], "a": 0, "e": "True: Pure-play businesses exist entirely in digital spaces.", "type": "TF"},
            {"q": "Corporate intranets provide secure private networks for internal employee collaboration.", "o": ["True", "False"], "a": 0, "e": "True: Intranets serve internal organizational communication.", "type": "TF"},
            {"q": "Extranets safely extend internal corporate networks to trusted external partners and vendors.", "o": ["True", "False"], "a": 0, "e": "True: Extranets allow secure external partner access.", "type": "TF"},
            {"q": "Marketing automation software streamlines repetitive marketing workflows and lead nurturing.", "o": ["True", "False"], "a": 0, "e": "True: Marketing automation executes campaigns and lead scoring.", "type": "TF"},
            {"q": "Collaborative filtering recommends products based on peer similarity and collective user behavior.", "o": ["True", "False"], "a": 0, "e": "True: Collaborative filtering powers recommendation engines.", "type": "TF"},
            {"q": "Enterprise Content Management (ECM) organizes and governs unstructured corporate documents.", "o": ["True", "False"], "a": 0, "e": "True: ECM manages unstructured document lifecycles.", "type": "TF"},
            {"q": "Operational CRM automates customer-facing front-office processes like sales and support.", "o": ["True", "False"], "a": 0, "e": "True: Operational CRM manages sales and service workflows.", "type": "TF"},
            {"q": "Analytical CRM evaluates customer data to uncover actionable behavioral insights.", "o": ["True", "False"], "a": 0, "e": "True: Analytical CRM extracts insights from customer data.", "type": "TF"},
            
            // High-Level TFs (46-50)
            {"q": "[HIGH-LEVEL] Disconnected departmental databases (sales, HR, finance) foster optimal efficiency without needing an ERP system.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] False: Disconnected databases create data silos and inefficiencies; ERP integration is required.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The bullwhip effect causes minor retail demand changes to amplify into major upstream supply chain disruptions.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] True: Demand variations multiply upstream across supply chains, known as the bullwhip effect.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Business Intelligence and Data Warehousing play zero role in customer personalization and predictive churn analytics.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] False: BI and data warehouses are foundational for customer analytics and data-driven personalization.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Business Process Reengineering (BPR) focuses on minor incremental tweaks rather than radical workflow overhauls.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] False: BPR is defined by radical and fundamental redesign, not minor incremental tweaks.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Omnichannel retailing requires unifying inventory and customer data across physical and digital storefronts.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] True: Seamless omnichannel experiences depend on real-time data integration across physical and online touchpoints.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
