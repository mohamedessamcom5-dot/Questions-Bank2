    <style>

            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>

            {"q": "Malware is malicious software designed to damage or disrupt computer systems.", "o": ["True", "False"], "a": 0, "e": "True: Malware includes viruses, ransomware, and spyware.", "type": "TF"},
            {"q": "Ransomware encrypts a victim's files and demands a financial ransom for the decryption key.", "o": ["True", "False"], "a": 0, "e": "True: Ransomware extorts victims by locking their encrypted data.", "type": "TF"},
            {"q": "Network firewalls monitor and filter incoming and outgoing traffic based on security rules.", "o": ["True", "False"], "a": 0, "e": "True: Firewalls filter network traffic to enforce security.", "type": "TF"},
            {"q": "Data encryption converts plaintext data into secure ciphertext to prevent unauthorized reading.", "o": ["True", "False"], "a": 0, "e": "True: Encryption protects data confidentiality using cryptographic keys.", "type": "TF"},
            {"q": "Multi-Factor Authentication (MFA) requires two or more verification factors to gain access.", "o": ["True", "False"], "a": 0, "e": "True: MFA strengthens access security using multiple credentials.", "type": "TF"},
            {"q": "Distributed Denial of Service (DDoS) attacks overwhelm servers with traffic to cause downtime.", "o": ["True", "False"], "a": 0, "e": "True: DDoS attacks disrupt availability via traffic floods.", "type": "TF"},
            {"q": "A Local Area Network (LAN) connects computers within a limited geographic area like an office building.", "o": ["True", "False"], "a": 0, "e": "True: LANs connect local devices within a small area.", "type": "TF"},
            {"q": "A Wide Area Network (WAN) spans large geographic distances, interconnecting multiple LANs like the Internet.", "o": ["True", "False"], "a": 0, "e": "True: WANs connect networks across wide geographic regions.", "type": "TF"},
            {"q": "The Domain Name System (DNS) translates human-readable domain names into numerical IP addresses.", "o": ["True", "False"], "a": 0, "e": "True: DNS acts as the internet's phone book for domain resolution.", "type": "TF"},
            {"q": "Blockchain is a decentralized and distributed digital ledger that securely records transactions.", "o": ["True", "False"], "a": 0, "e": "True: Blockchain provides immutable distributed transaction logging.", "type": "TF"},
            {"q": "Smart contracts are self-executing digital contracts written in code on a blockchain.", "o": ["True", "False"], "a": 0, "e": "True: Smart contracts automate agreements upon meeting coded conditions.", "type": "TF"},
            {"q": "Virtual Reality (VR) immerses users in a fully computer-generated environment.", "o": ["True", "False"], "a": 0, "e": "True: VR provides total immersion in virtual worlds.", "type": "TF"},
            {"q": "Augmented Reality (AR) overlays digital elements onto the real physical world.", "o": ["True", "False"], "a": 0, "e": "True: AR enhances the real physical environment with digital overlays.", "type": "TF"},
            {"q": "Quantum computing utilizes quantum mechanics principles like qubits and superposition.", "o": ["True", "False"], "a": 0, "e": "True: Quantum computers leverage qubits and superposition.", "type": "TF"},
            {"q": "Zero Trust architecture operates on the principle of 'never trust, always verify'.", "o": ["True", "False"], "a": 0, "e": "True: Zero Trust mandates continuous identity and device verification.", "type": "TF"},
            {"q": "A Metropolitan Area Network (MAN) covers a geographic area larger than a LAN but smaller than a WAN.", "o": ["True", "False"], "a": 0, "e": "True: MANs interconnect resources across a city or region.", "type": "TF"},
            {"q": "Routers forward data packets between different computer networks.", "o": ["True", "False"], "a": 0, "e": "True: Routers direct traffic across distinct networks.", "type": "TF"},
            {"q": "Switches connect devices together within a single LAN.", "o": ["True", "False"], "a": 0, "e": "True: Switches manage internal traffic within a local network.", "type": "TF"},
            {"q": "Asymmetric encryption uses a public key for encryption and a private key for decryption.", "o": ["True", "False"], "a": 0, "e": "True: Asymmetric cryptography relies on public-private key pairs.", "type": "TF"},
            {"q": "Symmetric encryption uses the exact same secret key for both encryption and decryption.", "o": ["True", "False"], "a": 0, "e": "True: Symmetric encryption uses a shared single secret key.", "type": "TF"},
            {"q": "Social engineering manipulates human psychology to bypass security procedures.", "o": ["True", "False"], "a": 0, "e": "True: Social engineering exploits human trust rather than software bugs.", "type": "TF"},
            {"q": "A Trojan Horse is malware disguised as legitimate software to deceive users.", "o": ["True", "False"], "a": 0, "e": "True: Trojans masquerade as useful programs to gain system access.", "type": "TF"},
            {"q": "Spyware covertly monitors user activity and gathers data without their knowledge.", "o": ["True", "False"], "a": 0, "e": "True: Spyware secretly tracks and transmits user information.", "type": "TF"},
            {"q": "A Virtual Private Network (VPN) creates a secure encrypted connection over an insecure network.", "o": ["True", "False"], "a": 0, "e": "True: VPNs encrypt traffic and mask IP addresses for privacy.", "type": "TF"},
            {"q": "Edge computing processes data closer to where it is collected rather than sending all raw data to the cloud.", "o": ["True", "False"], "a": 0, "e": "True: Edge computing minimizes latency by processing locally.", "type": "TF"},
            {"q": "Cloud scalability allows organizations to scale IT resources up or down dynamically based on demand.", "o": ["True", "False"], "a": 0, "e": "True: Scalability offers elastic resource provisioning.", "type": "TF"},
            {"q": "A data breach involves unauthorized access or theft of sensitive confidential information.", "o": ["True", "False"], "a": 0, "e": "True: Data breaches compromise confidential data security.", "type": "TF"},
            {"q": "Patch management involves regularly installing software updates to fix security vulnerabilities.", "o": ["True", "False"], "a": 0, "e": "True: Patch management secures systems against known flaws.", "type": "TF"},
            {"q": "A multi-cloud strategy utilizes cloud services from multiple independent public cloud vendors.", "o": ["True", "False"], "a": 0, "e": "True: Multi-cloud diversifies providers to prevent vendor lock-in.", "type": "TF"},
            {"q": "A botnet is a network of infected computers controlled remotely by hackers.", "o": ["True", "False"], "a": 0, "e": "True: Botnets execute coordinated attacks like DDoS or spam.", "type": "TF"},
            {"q": "Biometric authentication uses unique physical characteristics like fingerprints or facial scans.", "o": ["True", "False"], "a": 0, "e": "True: Biometrics verify identity using physical traits.", "type": "TF"},
            {"q": "Cryptography is the practice of techniques for secure communication against adversaries.", "o": ["True", "False"], "a": 0, "e": "True: Cryptography secures information exchange.", "type": "TF"},
            {"q": "Digital certificates bind public keys to entities to secure website connections via SSL/TLS.", "o": ["True", "False"], "a": 0, "e": "True: Digital certificates verify authenticity and enable secure HTTPS.", "type": "TF"},
            
            // High-Level TFs (46-50)
            {"q": "[HIGH-LEVEL] Under the cloud Shared Responsibility Model, data security and access control are exclusively the responsibility of the cloud provider.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] False: The customer remains fully responsible for securing their data, access controls, and configurations in the cloud.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Perimeter defense alone is sufficient to secure modern enterprise networks against advanced persistent threats.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] False: Perimeter security is inadequate; Zero Trust and internal least-privilege controls are required.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Offline immutable backups provide an effective defense against ransomware attacks by restoring system availability without paying extortion.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] True: Immutable offline backups ensure recovery and maintain availability without yielding to ransomware extortion.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Asymmetric encryption solves the secure key distribution problem over public networks without requiring a prior secret channel.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] True: Public-key cryptography allows secure communication without pre-shared secret keys.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Blockchain ledger integrity relies on cryptographic hashes linking blocks together across a decentralized network.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] True: Hash links and decentralization guarantee tamper-proof integrity in blockchain systems.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
