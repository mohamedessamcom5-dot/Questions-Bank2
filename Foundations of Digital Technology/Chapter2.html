<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">

    <title>Foundation of Digital Technology — Chapter 2: Artificial Intelligence (AI)</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>

            {"q": "Narrow AI is designed for specific tasks, whereas AGI possesses general human-level intelligence.", "o": ["True", "False"], "a": 0, "e": "True: Narrow AI is task-specific, while AGI is general intelligence.", "type": "TF"},
            {"q": "A loss function measures prediction error so an optimization algorithm can update model weights.", "o": ["True", "False"], "a": 0, "e": "True: Loss functions quantify errors for model optimization.", "type": "TF"},
            {"q": "Gradient Descent is a foundational optimization algorithm used to minimize loss in neural networks.", "o": ["True", "False"], "a": 0, "e": "True: Gradient descent minimizes loss by updating weights.", "type": "TF"},
            {"q": "Massive big data volumes are essential fuel for training high-performance machine learning models.", "o": ["True", "False"], "a": 0, "e": "True: Big data provides the training fuel for modern AI.", "type": "TF"},
            {"q": "Transfer learning reuses pre-trained models on new tasks to reduce data and compute requirements.", "o": ["True", "False"], "a": 0, "e": "True: Transfer learning saves time and data by reusing models.", "type": "TF"},
            {"q": "Autonomous self-driving vehicles rely heavily on computer vision and deep learning perception.", "o": ["True", "False"], "a": 0, "e": "True: Self-driving cars use computer vision and deep learning.", "type": "TF"},
            {"q": "Sentiment analysis evaluates text to determine emotional tone as positive, negative, or neutral.", "o": ["True", "False"], "a": 0, "e": "True: Sentiment analysis determines text emotional tone.", "type": "TF"},
            {"q": "Adversarial attacks involve subtly crafted inputs designed to trick AI models into making errors.", "o": ["True", "False"], "a": 0, "e": "True: Adversarial inputs can fool AI classifiers.", "type": "TF"},
            {"q": "Overfitting occurs when a model memorizes training noise and fails to generalize to new data.", "o": ["True", "False"], "a": 0, "e": "True: Overfitting means memorizing training data without generalizability.", "type": "TF"},
            {"q": "Regularization and cross-validation help prevent overfitting in machine learning models.", "o": ["True", "False"], "a": 0, "e": "True: Regularization and cross-validation combat overfitting.", "type": "TF"},
            {"q": "Underfitting happens when a model is too simple to capture underlying patterns in the training data.", "o": ["True", "False"], "a": 0, "e": "True: Underfitting occurs with overly simplistic models.", "type": "TF"},
            {"q": "Datasets are typically split into training, validation, and test sets for robust model evaluation.", "o": ["True", "False"], "a": 0, "e": "True: Train/validation/test splits ensure proper evaluation.", "type": "TF"},
            {"q": "AI ethics principles emphasize fairness, transparency, accountability, and privacy.", "o": ["True", "False"], "a": 0, "e": "True: Ethical AI principles include fairness, transparency, and accountability.", "type": "TF"},
            {"q": "The Turing Test evaluates a machine's ability to exhibit behavior indistinguishable from a human.", "o": ["True", "False"], "a": 0, "e": "True: The Turing Test assesses human-like conversational capability.", "type": "TF"},
            {"q": "Convolutional Neural Networks (CNNs) are specialized for processing image and spatial visual data.", "o": ["True", "False"], "a": 0, "e": "True: CNNs specialize in computer vision and image processing.", "type": "TF"},
            {"q": "Recurrent Neural Networks and Transformers are specialized for sequential data like text and speech.", "o": ["True", "False"], "a": 0, "e": "True: RNNs and Transformers excel at sequential data.", "type": "TF"},
            {"q": "Reinforcement learning reward functions guide agents toward optimal behavior.", "o": ["True", "False"], "a": 0, "e": "True: Reward functions guide reinforcement learning agents.", "type": "TF"},
            {"q": "Robotics combines artificial intelligence and mechanical engineering to create autonomous physical agents.", "o": ["True", "False"], "a": 0, "e": "True: Robotics integrates AI with physical machines.", "type": "TF"},
            {"q": "Data preprocessing cleans and prepares raw data for effective machine learning training.", "o": ["True", "False"], "a": 0, "e": "True: Preprocessing is essential for cleaning and normalizing data.", "type": "TF"},
            {"q": "Data normalization ensures features with larger numerical ranges do not overpower smaller ones.", "o": ["True", "False"], "a": 0, "e": "True: Normalization scales features to comparable numerical ranges.", "type": "TF"},
            {"q": "Classification predicts discrete categorical labels, whereas regression predicts continuous numbers.", "o": ["True", "False"], "a": 0, "e": "True: Classification predicts categories, regression predicts continuous values.", "type": "TF"},
            {"q": "Accuracy, precision, recall, and F1-score are standard classification evaluation metrics.", "o": ["True", "False"], "a": 0, "e": "True: These metrics evaluate classification model performance.", "type": "TF"},
            {"q": "Recall measures the proportion of actual positive instances correctly identified by the model.", "o": ["True", "False"], "a": 0, "e": "True: Recall measures true positives over actual positives.", "type": "TF"},
            {"q": "Precision measures the proportion of positive model predictions that were actually correct.", "o": ["True", "False"], "a": 0, "e": "True: Precision measures true positives over predicted positives.", "type": "TF"},
            {"q": "The attention mechanism allows transformer models to focus dynamically on relevant input parts.", "o": ["True", "False"], "a": 0, "e": "True: Attention mechanisms dynamic weigh input sequence tokens.", "type": "TF"},
            {"q": "Edge AI runs AI algorithms locally on hardware devices rather than exclusively on remote cloud servers.", "o": ["True", "False"], "a": 0, "e": "True: Edge AI executes models locally on local devices.", "type": "TF"},
            {"q": "Predictive maintenance uses AI to forecast equipment failures before they occur based on sensor data.", "o": ["True", "False"], "a": 0, "e": "True: Predictive maintenance anticipates equipment breakdowns using AI.", "type": "TF"},
            {"q": "AI expert systems use rule-based reasoning to emulate human expertise in specialized domains.", "o": ["True", "False"], "a": 0, "e": "True: Expert systems emulate human domain experts using rules.", "type": "TF"},
            {"q": "AI alignment research ensures that AI systems pursue human-compatible goals and values safely.", "o": ["True", "False"], "a": 0, "e": "True: AI alignment ensures safe, human-compatible behavior.", "type": "TF"},
            {"q": "Deep reinforcement learning combines deep neural networks with reinforcement learning control.", "o": ["True", "False"], "a": 0, "e": "True: Deep RL merges neural networks with reinforcement learning.", "type": "TF"},
            
            // High-Level TFs (46-50)
            {"q": "[HIGH-LEVEL] Achieving 99% training accuracy guarantees that a machine learning model will perform perfectly on new unseen real-world data.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] High training accuracy often indicates overfitting; models can fail on unseen data if they memorize training noise.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Explainable AI (XAI) is completely unnecessary in high-stakes sectors like healthcare, finance, and criminal justice.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Explainable AI is vital in high-stakes domains to ensure auditability, trust, and regulatory compliance.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Training complex deep learning models from scratch is always recommended regardless of dataset size or available computational power.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Training deep models from scratch requires massive data and compute; transfer learning is standard for smaller datasets.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Adversarial attacks prove that machine learning perception models can be extremely fragile to imperceptible input modifications.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Adversarial examples demonstrate model vulnerability to subtle input perturbations.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The integration of Big Data and AI empowers modern enterprises to replace guesswork with rigorous predictive intelligence.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Big data and AI together enable organizations to shift from intuition to rigorous data-driven prediction.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
