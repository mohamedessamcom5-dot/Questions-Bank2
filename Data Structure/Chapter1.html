<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Structures</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .diagram-container {
            direction: ltr;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--b);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
    <link rel="stylesheet" href="../site-theme.css">
</head>

            {"q": "A pointer holding address 0x00000000 (NULL) occupies 0 bytes of memory on a 64-bit architecture.", "o": ["True", "False"], "a": 1, "e": "False: A pointer variable itself always occupies 8 bytes on a 64-bit machine, regardless of whether its value is NULL or points to memory.", "type": "TF"},
            {"q": "In virtual memory systems, stack memory addresses typically grow downwards towards lower memory addresses, while heap addresses grow upwards.", "o": ["True", "False"], "a": 0, "e": "True: On standard architectures (like x86/x64), the call stack expands toward lower memory addresses while the heap expands upward.", "type": "TF"},
            // True / False (29 Questions)
            {"q": "Heap memory exhibits dynamic size flexibility at runtime.", "o": ["True", "False"], "a": 0, "e": "True: Heap memory can scale dynamically based on runtime program requirements.", "type": "TF"},
            {"q": "Primitive types are basic building blocks provided directly by programming languages.", "o": ["True", "False"], "a": 0, "e": "True: Int, Float, Char, Bool, Pointer are language-native primitives.", "type": "TF"},
            {"q": "Searching in an unsorted Array of size N requires examining up to N elements.", "o": ["True", "False"], "a": 0, "e": "True: Unsorted array linear search has O(N) worst-case time complexity.", "type": "TF"},
            {"q": "Non-linear data structures allow traversing items in a single straight path.", "o": ["True", "False"], "a": 1, "e": "False: Non-linear structures (trees/graphs) have complex multi-path branching.", "type": "TF"},
            {"q": "Accessing an element in an Array by its valid index takes O(1) constant time.", "o": ["True", "False"], "a": 0, "e": "True: Direct index calculation grants O(1) random access.", "type": "TF"},
            {"q": "Deletion in a Stack can occur from any arbitrary index position.", "o": ["True", "False"], "a": 1, "e": "False: Stack operations (push and pop) are strictly restricted to the Top.", "type": "TF"},
            {"q": "Global variables in C programs are stored directly inside the Call Stack.", "o": ["True", "False"], "a": 1, "e": "False: Global variables sit in the Data/BSS (Global Segment), separate from the call stack.", "type": "TF"},
            {"q": "The process of visiting every vertex in a Graph is called Graph Traversal.", "o": ["True", "False"], "a": 0, "e": "True: Methods like BFS and DFS systematically traverse graph vertices.", "type": "TF"},
            {"q": "Array bounds overflow errors occur when attempting to access an index outside defined allocation.", "o": ["True", "False"], "a": 0, "e": "True: Accessing out-of-bounds indices leads to undefined behavior or crash.", "type": "TF"},
            {"q": "In C++, calling 'delete' or 'free()' returns allocated heap space to the unallocated memory pool.", "o": ["True", "False"], "a": 0, "e": "True: explicit deallocation frees heap memory for reuse.", "type": "TF"},
            {"q": "Stack memory size is typically much larger than Heap memory size.", "o": ["True", "False"], "a": 1, "e": "False: Stack memory is small and restricted (e.g., a few megabytes), whereas Heap is vast.", "type": "TF"},
            {"q": "Dynamic memory allocation occurs at Compile Time.", "o": ["True", "False"], "a": 1, "e": "False: Dynamic allocation happens strictly at Runtime.", "type": "TF"},
            {"q": "Static memory allocation size is determined at Compile Time.", "o": ["True", "False"], "a": 0, "e": "True: Static structures like primitive arrays have fixed sizes determined before execution.", "type": "TF"},
            {"q": "Because Linked List nodes are scattered in memory, they exhibit excellent CPU cache locality.", "o": ["True", "False"], "a": 1, "e": "False: Non-contiguous pointer-chasing degrades CPU cache performance relative to arrays.", "type": "TF"},
            {"q": "An empty Queue condition is met when Front index equals Rear + 1 (in static implementation).", "o": ["True", "False"], "a": 0, "e": "True: Indicates no valid items exist between front and rear.", "type": "TF"},
            {"q": "An array index in C/C++/Python is 0-based.", "o": ["True", "False"], "a": 0, "e": "True: Zero-based indexing is standard in C, C++, and Python.", "type": "TF"},
            {"q": "In a Queue with elements [10, 20, 30], calling top() will return 10.", "o": ["True", "False"], "a": 1, "e": "False: Queues do not use top(); they inspect front() (10) or rear() (30). Top belongs to Stacks.", "type": "TF"},
            {"q": "Stack memory overflow can be triggered by infinite un-base-cased recursion.", "o": ["True", "False"], "a": 0, "e": "True: Unbounded recursive calls continuously stack frames until overflow occurs.", "type": "TF"},
            {"q": "In Max-Heaps, the smallest element is guaranteed to sit at the root node.", "o": ["True", "False"], "a": 1, "e": "False: The LARGEST element sits at the root in a Max-Heap.", "type": "TF"},
            {"q": "A Graph without cycles is known as an Acyclic Graph.", "o": ["True", "False"], "a": 0, "e": "True: A graph free of cyclic pathways is designated as an acyclic graph (e.g., DAG).", "type": "TF"},
            {"q": "A Binary Tree with N nodes contains exactly N - 1 edges.", "o": ["True", "False"], "a": 0, "e": "True: Every non-root node in a tree has exactly one incoming edge from its parent, totaling N-1 edges.", "type": "TF"},
            {"q": "Sorting algorithms like QuickSort rely heavily on recursion stack frames during execution.", "o": ["True", "False"], "a": 0, "e": "True: Recursive call stack space contributes to QuickSort's O(log N) auxiliary space complexity.", "type": "TF"},
            {"q": "A Hash Table resolves key collisions strictly by doubling its primary memory size.", "o": ["True", "False"], "a": 1, "e": "False: Collisions are resolved via techniques such as Chaining (Linked Lists) or Open Addressing (Probing).", "type": "TF"},
            {"q": "In a Max-Heap, every parent node key is greater than or equal to its children's keys.", "o": ["True", "False"], "a": 0, "e": "True: This structural invariant defines the heap property for Max-Heaps.", "type": "TF"},
            {"q": "The Space Complexity of an algorithm evaluates its CPU execution timing.", "o": ["True", "False"], "a": 1, "e": "False: Space Complexity evaluates memory consumption, whereas Time Complexity measures CPU time.", "type": "TF"},
            {"q": "A Linked List requires pre-allocating a continuous block of memory before inserting elements.", "o": ["True", "False"], "a": 1, "e": "False: Nodes are allocated dynamically in heap space individually as needed.", "type": "TF"},
            {"q": "In C++, calling free() on an already freed pointer causes undefined behavior or crashes.", "o": ["True", "False"], "a": 0, "e": "True: Double-freeing heap memory corrupts memory manager metadata.", "type": "TF"},
            {"q": "A Stack is a suitable data structure for evaluating postfix mathematical expressions.", "o": ["True", "False"], "a": 0, "e": "True: Operators pop operands from the stack, evaluate them, and push results back.", "type": "TF"},
            {"q": "Data Structures + Algorithms = Programs.", "o": ["True", "False"], "a": 0, "e": "True: Niklaus Wirth's classic computer science identity.", "type": "TF"}
        ];

        const P1_DATA = [
            ...P1_SOURCE.filter(question => question.type === "MCQ"),
            ...P2_SOURCE.filter(question => question.type === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => question.type === "TF"),
            ...P2_SOURCE.filter(question => question.type === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            let diagHtml = q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : '';
            
            $("card").innerHTML = `
                <span class="q-badge">${q.type === 'TF' ? 'True / False' : 'Multiple Choice'}</span>
                <p class="q">${q.q}</p>
                ${diagHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
