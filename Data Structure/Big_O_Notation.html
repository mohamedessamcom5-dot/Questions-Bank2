<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Structures, Big O & Python — Advanced Quiz</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px;
            color: var(--ac);
        }

        .sub {
            color: var(--m);
            font-size: 0.95rem;
            margin: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }

        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }

        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }

        .code-block {
            direction: ltr;
            background: #090d16;
            border: 1px solid var(--b);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .opt:hover:not(:disabled) {
            border-color: var(--ac);
        }

        .opt b {
            min-width: 1.5em;
            color: var(--ac);
        }

        .opt.ok {
            background: var(--okb);
            border-color: var(--ok);
        }

        .opt.no {
            background: var(--nob);
            border-color: var(--no);
        }

        .opt:disabled {
            cursor: default;
        }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .ex.ok {
            background: var(--okb);
            border: 1px solid var(--ok);
        }

        .ex.no {
            background: var(--nob);
            border: 1px solid var(--no);
        }

        .ex strong {
            display: block;
            margin-bottom: 4px;
        }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .score {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 12px 0;
            color: var(--ac);
        }

        .rev {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
            direction: ltr;
            text-align: left;
            font-size: 0.9rem;
        }

        .rev li {
            padding: 8px 0;
            border-top: 1px solid var(--b);
        }
    </style>
</head>

<body>
    <main>
        <div class="header-panel">
            <h1>Data Structures</h1>
            <p class="sub">Big O Notation</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice (50)</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False (50)</button>
        </div>

        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>

    <script>
        const P1_SOURCE = [
            // --- 50 Multiple Choice Questions (1-45 Standard, 46-50 High Level) ---
            { "q": "1. What is the time complexity of a constant time operation O(1)?", "o": ["Takes the same amount of time regardless of data size n", "Takes time proportional to n", "Reduces problem size by half", "Grows exponentially"], "a": 0, "e": "Correct answer: Takes the same amount of time regardless of data size n.\nWhy: O(1) constant time execution remains completely independent of input size.", "type": "MCQ" },
            { "q": "2. What characterizes Linear time complexity O(n)?", "o": ["Constant execution", "Time taken is proportional to the size of the data n", "Logarithmic reduction", "Quadratic growth"], "a": 1, "e": "Correct answer: Time taken is proportional to the size of the data n.\nWhy: Linear operations scale directly with input size.", "type": "MCQ" },
            { "q": "3. What does Logarithmic time complexity O(log n) do at each step?", "o": ["Multiplies data size by 2", "Reduces the problem size by half", "Adds n elements", "Loops n times"], "a": 1, "e": "Correct answer: Reduces the problem size by half.\nWhy: Logarithmic algorithms like binary search divide the search space in half at every step.", "type": "MCQ" },
            { "q": "4. According to Lecture 6 complexity ranking, which ranking order from best to worst is correct?", "o": ["O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(2^n)", "O(n^2) < O(n) < O(log n) < O(1)", "O(2^n) < O(n^2) < O(n) < O(1)", "O(n log n) < O(1) < O(n) < O(n^2)"], "a": 0, "e": "Correct answer: O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(2^n).\nWhy: Constant is best, Exponential is worst.", "type": "MCQ" },
            { "q": "5. What is the time complexity of calculating total sum using the mathematical formula: total = n * (n + 1) // 2 ?", "code": "total = n * (n + 1) // 2", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1).\nWhy: Direct arithmetic computation executes in constant time.", "type": "MCQ" },
            { "q": "6. What is the time complexity of summing numbers from 1 to n using a for loop in Python?", "code": "total = 0\nfor i in range(1, n + 1):\n    total += i", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 1, "e": "Correct answer: O(n).\nWhy: The loop iterates n times sequentially.", "type": "MCQ" },
            { "q": "7. What is the time complexity of printing numbers by multiplying index i by 2 in a while loop?", "code": "i = 1\nwhile i < n:\n    print(i)\n    i = i * 2", "o": ["O(n)", "O(1)", "O(log n)", "O(n^2)"], "a": 2, "e": "Correct answer: O(log n).\nWhy: Multiplying by 2 each step cuts the workload logarithmically.", "type": "MCQ" },
            { "q": "8. In Python, accessing an element in a list by index (e.g., my_list[i]) takes what time complexity?", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1).\nWhy: Contiguous memory allocation allows direct offset calculation.", "type": "MCQ" },
            { "q": "9. Inserting an element at the beginning of a Python list using insert(0, val) requires shifting elements, resulting in:", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 1, "e": "Correct answer: O(n).\nWhy: All subsequent elements must be shifted one position right.", "type": "MCQ" },
            { "q": "10. Appending an element to the end of a Python dynamic array (list.append) runs in what amortized time?", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1).\nWhy: Dynamic array appends are O(1) amortized.", "type": "MCQ" },
            { "q": "11. Which data structure operates on the Last-In, First-Out (LIFO) principle?", "o": ["Queue", "Stack", "Binary Tree", "Graph"], "a": 1, "e": "Correct answer: Stack.\nWhy: Stacks insert and remove from the top (LIFO).", "type": "MCQ" },
            { "q": "12. What is the time complexity of push and pop operations on a Stack implemented via Python list?", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1).\nWhy: Operations occur at the list tail.", "type": "MCQ" },
            { "q": "13. Which data structure operates on the First-In, First-Out (FIFO) principle?", "o": ["Stack", "Queue", "Min-Heap", "BST"], "a": 1, "e": "Correct answer: Queue.\nWhy: Queues enqueue at rear and dequeue from front (FIFO).", "type": "MCQ" },
            { "q": "14. In Python, why is collections.deque preferred over standard list for Queue implementation?", "o": ["deque provides O(1) appends and pops from both ends", "deque uses zero memory", "list.pop(0) is O(1)", "deque is a graph algorithm"], "a": 0, "e": "Correct answer: deque provides O(1) appends and pops from both ends.\nWhy: list.pop(0) is O(n) due to shifting.", "type": "MCQ" },
            { "q": "15. In a Singly Linked List, what does each node contain?", "o": ["Data and a pointer/reference to the next node", "Only an array index", "Left and right child pointers only", "Continuous memory byte offsets"], "a": 0, "e": "Correct answer: Data and a pointer/reference to the next node.\nWhy: Linked list nodes hold payload and next link.", "type": "MCQ" },
            { "q": "16. What is the time complexity of inserting a new node at the head of a Singly Linked List?", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1).\nWhy: Head pointer is updated directly without traversal.", "type": "MCQ" },
            { "q": "17. What is the worst-case time complexity of searching for a value in a Singly Linked List of size n?", "o": ["O(1)", "O(n)", "O(log n)", "O(n log n)"], "a": 1, "e": "Correct answer: O(n).\nWhy: Nodes must be traversed sequentially from head to tail.", "type": "MCQ" },
            { "q": "18. What is the top-most node in a Tree structure called?", "o": ["Leaf", "Root", "Parent", "Edge"], "a": 1, "e": "Correct answer: Root.\nWhy: The root serves as the entry point of a hierarchical tree.", "type": "MCQ" },
            { "q": "19. Nodes in a tree with zero children are called:", "o": ["Root nodes", "Leaf nodes", "Internal nodes", "Ancestors"], "a": 1, "e": "Correct answer: Leaf nodes.\nWhy: Leaves reside at terminal ends of tree branches.", "type": "MCQ" },
            { "q": "20. In a Binary Search Tree (BST), what is the invariant property for any node?", "o": ["Left child < Node < Right child", "Parent < Children", "All nodes are equal", "Right child < Node < Left child"], "a": 0, "e": "Correct answer: Left child < Node < Right child.\nWhy: BST orders smaller keys to the left and larger keys to the right.", "type": "MCQ" },
            { "q": "What is the average time complexity for search, insertion, and deletion in a balanced Binary Search Tree?", "o": ["O(1)", "O(log n)", "O(n)", "O(n^2)"], "a": 1, "e": "Correct answer: O(log n).\nWhy: Balanced BST halves search space per level.", "type": "MCQ" },
            { "q": "What is the worst-case time complexity of an unbalanced (degenerate) BST resembling a linked list?", "o": ["O(log n)", "O(n)", "O(1)", "O(n log n)"], "a": 1, "e": "Correct answer: O(n).\nWhy: Degenerate trees lose logarithmic advantage.", "type": "MCQ" },
            { "q": "What components make up a Graph data structure?", "o": ["Vertices (Nodes) and Edges", "Head and Tail pointers only", "Push and Pop stacks", "Rows and columns"], "a": 0, "e": "Correct answer: Vertices (Nodes) and Edges.\nWhy: Graphs are defined mathematically as G = (V, E).", "type": "MCQ" },
            { "q": "How can a Graph be represented in Python programming?", "o": ["Using Adjacency List (Dictionaries / Hash Maps)", "Using static HTML pages", "Using single integer variables", "Using print loops"], "a": 0, "e": "Correct answer: Using Adjacency List (Dictionaries).\nWhy: Python dictionaries map vertices to lists of connected neighbors.", "type": "MCQ" },
            { "q": "What is the time complexity of Breadth-First Search (BFS) on a graph with V vertices and E edges?", "o": ["O(V + E)", "O(V * E)", "O(V^2)", "O(log V)"], "a": 0, "e": "Correct answer: O(V + E).\nWhy: BFS visits every vertex and edge once.", "type": "MCQ" },
            { "q": "Which data structure is strictly required to implement BFS traversal?", "o": ["Stack", "Queue", "Min-Heap", "Array"], "a": 1, "e": "Correct answer: Queue.\nWhy: BFS processes neighbor nodes level by level using FIFO.", "type": "MCQ" },
            { "q": "Which data structure is naturally used by Depth-First Search (DFS) traversal?", "o": ["Queue", "Stack (or recursion call stack)", "Array", "Adjacency Matrix"], "a": 1, "e": "Correct answer: Stack (or recursion call stack).\nWhy: DFS explores deep paths using LIFO behavior.", "type": "MCQ" },
            { "q": "In a Min-Heap, where is the minimum element always located?", "o": ["At the root node", "At any random leaf", "At the maximum index", "In the hash table"], "a": 0, "e": "Correct answer: At the root node.\nWhy: Min-heap invariant keeps the smallest key at the root.", "type": "MCQ" },
            { "q": "What is the time complexity of inserting an element into a Binary Heap of size n?", "o": ["O(1)", "O(log n)", "O(n)", "O(n^2)"], "a": 1, "e": "Correct answer: O(log n).\nWhy: Insertion requires bubbling up through the tree height.", "type": "MCQ" },
            { "q": "What is the space complexity of storing a graph with V vertices and E edges in an Adjacency Matrix?", "o": ["O(V + E)", "O(V^2)", "O(E^2)", "O(log V)"], "a": 1, "e": "Correct answer: O(V^2).\nWhy: Adjacency matrices allocate a V by V 2D grid.", "type": "MCQ" },
            { "q": "What is the time complexity of nested loops where the outer loop runs n times and inner loop runs n times?", "o": ["O(n)", "O(n^2)", "O(log n)", "O(2^n)"], "a": 1, "e": "Correct answer: O(n^2) Quadratic time.", "type": "MCQ" },
            { "q": "Which asymptotic notation represents the upper bound (worst-case performance) of an algorithm?", "o": ["Big O O()", "Big Omega Omega()", "Big Theta Theta()", "Little o o()"], "a": 0, "e": "Correct answer: Big O O().\nWhy: Big O bounds the growth rate from above.", "type": "MCQ" },
            { "q": "What is the time complexity of binary search on a sorted array of size n?", "o": ["O(1)", "O(log n)", "O(n)", "O(n log n)"], "a": 1, "e": "Correct answer: O(log n).\nWhy: Binary search divides the range in half each step.", "type": "MCQ" },
            { "q": "What is the worst-case time complexity of Merge Sort on n elements?", "o": ["O(n^2)", "O(n log n)", "O(n)", "O(1)"], "a": 1, "e": "Correct answer: O(n log n).\nWhy: Merge sort divides data logarithmically and merges linearly.", "type": "MCQ" },
            { "q": "What is the worst-case time complexity of Bubble Sort or Selection Sort?", "o": ["O(n log n)", "O(n^2)", "O(log n)", "O(1)"], "a": 1, "e": "Correct answer: O(n^2).\nWhy: Simple quadratic sorting algorithms use nested loops.", "type": "MCQ" },
            { "q": "In Python, what is the time complexity of checking if an item exists in a set or dictionary ('x in my_dict')?", "o": ["O(1) average", "O(n)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer: O(1) average.\nWhy: Hash tables provide average constant-time lookups.", "type": "MCQ" },
            { "q": "What is a Stack Overflow error in computer memory?", "o": ["Exceeding the allocated Call Stack memory limit due to infinite recursion", "Filling a hard drive", "Running out of heap memory", "Deleting a linked list"], "a": 0, "e": "Correct answer: Exceeding allocated Call Stack memory limit due to infinite recursion.", "type": "MCQ" },
            { "q": "What causes a Memory Leak in C/C++ heap allocation?", "o": ["Failing to free dynamically allocated heap memory before losing its pointer", "Using a queue", "Clearing stack frames", "Printing arrays"], "a": 0, "e": "Correct answer: Failing to free dynamically allocated heap memory.", "type": "MCQ" },
            { "q": "Which tree traversal visits Root, Left Subtree, then Right Subtree?", "o": ["Pre-order traversal", "In-order traversal", "Post-order traversal", "Level-order traversal"], "a": 0, "e": "Correct answer: Pre-order traversal.", "type": "MCQ" },
            { "q": "Which tree traversal visits Left Subtree, Root, then Right Subtree?", "o": ["In-order traversal", "Pre-order traversal", "Post-order traversal", "BFS"], "a": 0, "e": "Correct answer: In-order traversal (results in sorted order for BST).", "type": "MCQ" },
            { "q": "Which tree traversal visits Left Subtree, Right Subtree, then Root?", "o": ["Post-order traversal", "Pre-order traversal", "In-order traversal", "DFS"], "a": 0, "e": "Correct answer: Post-order traversal.", "type": "MCQ" },
            { "q": "What does a Cyclic Graph contain?", "o": ["At least one closed loop of edges starting and ending at the same vertex", "No edges", "Only leaf nodes", "Only stacks"], "a": 0, "e": "Correct answer: At least one closed loop of edges.", "type": "MCQ" },
            { "q": "What is a Directed Acyclic Graph (DAG)?", "o": ["A graph with directed edges and no cycles", "A tree with cycles", "An undirected matrix", "A circular queue"], "a": 0, "e": "Correct answer: A graph with directed edges and no cycles.", "type": "MCQ" },
            { "q": "What is the time complexity of deleting a node from a Hash Table with collision chaining in the worst case?", "o": ["O(1)", "O(n)", "O(log n)", "O(n^2)"], "a": 1, "e": "Correct answer: O(n).\nWhy: If all keys hash to the same bucket (collision), chaining forms a list of size n.", "type": "MCQ" },
            { "q": "What is the auxiliary space complexity of recursive DFS on a balanced tree of height h?", "o": ["O(h)", "O(n^2)", "O(1)", "O(n log n)"], "a": 0, "e": "Correct answer: O(h).\nWhy: The recursion stack stores frames equal to the tree height h.", "type": "MCQ" },

            // --- HIGH-LEVEL MCQs (46 to 50) ---
            { "q": "[HIGH-LEVEL] 46. An algorithm recursively splits an array into 3 sub-problems of size n/3 and takes O(n) time to combine them. Using the Master Theorem, what is its overall time complexity?", "o": ["O(n log n)", "O(n)", "O(n^2)", "O(log n)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nExplanation: By Master Theorem Case 2 ($T(n) = 3T(n/3) + O(n)$), where $a=3, b=3, k=1$, $a = b^k$ ($3 = 3^1$), yielding $O(n \log n)$.", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 47. You implement a persistent immutable stack using Singly Linked Lists in Python. What is the time complexity of pushing an element onto a stack of size n?", "o": ["O(1)", "O(n)", "O(log n)", "O(n log n)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nExplanation: In functional/immutable linked-list stacks, a new node is created pointing to the old head in O(1) time without mutating existing nodes.", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 48. In a directed graph, Tarjan's algorithm or Kosaraju's algorithm is used to find Strongly Connected Components (SCCs). What is their time complexity using Adjacency Lists?", "o": ["O(V + E)", "O(V^2)", "O(V * E)", "O(E log V)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nExplanation: Both algorithms perform two graph traversals (DFS), running in linear time O(V + E).", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 49. When resizing a dynamic array (like Python's list) from capacity c to 2c, what is the exact amortized cost per insertion over a sequence of n insertions starting from empty?", "o": ["O(1)", "O(n)", "O(log n)", "O(n / c)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nExplanation: Using aggregate analysis or accounting method, the total cost of n appends is bounded by $3n$, resulting in an amortized $O(1)$ time per operation.", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 50. Consider a Binary Heap used as a Priority Queue. What is the worst-case time complexity to decrease the priority (key value) of an arbitrary element if its index in the heap array is known?", "o": ["O(log n)", "O(1)", "O(n)", "O(n log n)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nExplanation: Decreasing a key in a min-heap violates heap order, requiring a 'bubble-up' (percolate up) operation along the tree height, taking O(log n) time.", "type": "MCQ" }
        ];

        const P2_SOURCE = [
            // --- 50 True/False Questions (1-45 Standard, 46-50 High Level) ---
            { "q": "1. Big O notation describes how the performance of an operation scales as the size of the data grows.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "2. O(1) constant time operation takes the same amount of time regardless of data size.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "3. O(n) linear time operation takes time proportional to the size of the data.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "4. O(log n) logarithmic time reduces the problem size by half at each step (e.g., binary search).", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "5. According to Lecture 6 complexity ranking, O(1) Constant is better than O(2^n) Exponential.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "6. In Python, using list.pop(0) to remove the first element of a list takes O(1) constant time.", "o": ["True", "False"], "a": 1, "e": "False: list.pop(0) takes O(n) because all elements must shift left.", "type": "TF" },
            { "q": "7. collections.deque in Python ensures O(1) performance for insertions and deletions at both ends.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "8. Stacks operate on the Last-In, First-Out (LIFO) principle.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "9. Queues operate on the First-In, First-Out (FIFO) principle.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "10. In a Singly Linked List, elements are stored in contiguous memory blocks like arrays.", "o": ["True", "False"], "a": 1, "e": "False: Linked lists use scattered heap nodes connected by pointers.", "type": "TF" },

            { "q": "12. Inserting a node at the head of a linked list takes O(1) constant time.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "13. A Binary Search Tree allows O(1) random index access like arrays.", "o": ["True", "False"], "a": 1, "e": "False: Trees require pointer traversal across nodes.", "type": "TF" },

            { "q": "15. An unbalanced BST can degenerate into a linked list with O(n) worst-case search time.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },

            { "q": "17. Adjacency lists represent graphs efficiently using O(V + E) space.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "18. BFS traversal uses a Stack data structure.", "o": ["True", "False"], "a": 1, "e": "False: BFS uses a Queue; DFS uses a Stack.", "type": "TF" },
            { "q": "19. DFS traversal uses a Stack or system recursion.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "20. In a Min-Heap, the root node contains the smallest element in the heap.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "21. Inserting an element into a Binary Heap takes O(log n) time.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "22. Quadratic time O(n^2) grows much faster than Linear time O(n).", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "23. Binary search can be performed on an unsorted array without modifying it.", "o": ["True", "False"], "a": 1, "e": "False: Binary search requires a sorted array.", "type": "TF" },
            { "q": "24. In Python, checking key existence in a dictionary (key in dict) operates in O(1) average time.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "25. Stack memory overflow is caused by unbounded recursive function calls without base cases.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "26. A tree with N nodes always contains exactly N - 1 edges.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "27. In-order traversal of a Binary Search Tree visits nodes in ascending sorted order.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "28. An adjacency matrix takes O(V^2) space complexity.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "29. Exponential growth O(2^n) is considered a very fast and efficient complexity class.", "o": ["True", "False"], "a": 1, "e": "False: Exponential time is extremely slow and inefficient.", "type": "TF" },
            { "q": "30. Array elements are stored in contiguous memory locations.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "31. Python lists are static and cannot change their size after initialization.", "o": ["True", "False"], "a": 1, "e": "False: Python lists are dynamic arrays.", "type": "TF" },
            { "q": "32. Pop operation on an empty Stack causes Stack Underflow.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "33. Enqueue and Dequeue operations on a proper Queue take O(1) time.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "34. A doubly linked list allows traversal in both forward and backward directions.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "35. Post-order tree traversal visits the root node before its subtrees.", "o": ["True", "False"], "a": 1, "e": "False: Post-order visits subtrees first, then root.", "type": "TF" },
            { "q": "36. Pre-order tree traversal visits the root node first.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "37. A graph containing a cycle can cause infinite loops in DFS if visited nodes are not tracked.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },

            { "q": "41. Chaining and Open Addressing are standard techniques for resolving hash table collisions.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "42. The height of a balanced binary tree with n nodes is approximately log2(n).", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "43. Deleting an arbitrary node from a Singly Linked List requires O(1) time if you have its pointer.", "o": ["True", "False"], "a": 1, "e": "False: Deletion in singly linked list requires the predecessor pointer to bypass the node, taking O(n) to find it unless doubly linked.", "type": "TF" },
            { "q": "44. Recursion always requires auxiliary space on the call stack proportional to recursion depth.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },
            { "q": "45. An algorithm with O(n^3) Cubic time complexity is ranked as very slow in Lecture 6.", "o": ["True", "False"], "a": 0, "e": "True.", "type": "TF" },

            // --- HIGH-LEVEL T/Fs (46 to 50) ---
            { "q": "[HIGH-LEVEL] 46. True or False: Python dynamic arrays (lists) double their allocated capacity upon overflow, guaranteeing an amortized O(1) append time complexity.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Doubling strategy ensures that the cost of resizing is spread across insertions, yielding amortized O(1).", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. True or False: In a directed graph, Dijkstra's shortest path algorithm can handle negative edge weights correctly without modifications.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Dijkstra's greedy approach fails with negative edge weights; Bellman-Ford algorithm must be used instead.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. True or False: A self-balancing Red-Black Tree guarantees that no path from root to leaf is more than twice as long as any other path, ensuring O(log n) operations.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Red-black tree invariants maintain approximate balance, bounding height to 2 log(n+1).", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. True or False: Implementing a Queue using a Singly Linked List where you enqueue at the tail and dequeue at the head requires O(n) time for dequeue.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Dequeueing from the head of a linked list takes O(1) time if a head pointer is maintained.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. True or False: Tail-call optimization (TCO) allows recursive functions to execute in O(1) auxiliary stack space by reusing the current stack frame, though Python does not natively support it.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: TCO eliminates stack frame growth in tail-recursive functions, though Python's design philosophy intentionally omits it.", "type": "TF" }
        ];

        let activePart = 1;
        let qData = P1_SOURCE;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_SOURCE : P2_SOURCE;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel
                ? (q.type === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (q.type === 'TF' ? 'True / False' : 'Multiple Choice');

            let codeHtml = q.code ? `<div class="code-block">${q.code}</div>` : '';

            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                ${codeHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i === 0 ? 'T' : 'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
