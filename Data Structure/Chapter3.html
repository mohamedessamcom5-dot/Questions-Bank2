<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Structure - Chapter 3</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px;
            color: var(--ac);
        }

        .sub {
            color: var(--m);
            font-size: 0.95rem;
            margin: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }

        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }

        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }

        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .opt:hover:not(:disabled) {
            border-color: var(--ac);
        }

        .opt b {
            min-width: 1.5em;
            color: var(--ac);
        }

        .opt.ok {
            background: var(--okb);
            border-color: var(--ok);
        }

        .opt.no {
            background: var(--nob);
            border-color: var(--no);
        }

        .opt:disabled {
            cursor: default;
        }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .ex.ok {
            background: var(--okb);
            border: 1px solid var(--ok);
        }

        .ex.no {
            background: var(--nob);
            border: 1px solid var(--no);
        }

        .ex strong {
            display: block;
            margin-bottom: 4px;
        }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .score {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 12px 0;
            color: var(--ac);
        }

        .rev {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
            direction: ltr;
            text-align: left;
            font-size: 0.9rem;
        }

        .rev li {
            padding: 8px 0;
            border-top: 1px solid var(--b);
        }
    </style>
</head>

<body>
    <main>
        <div class="header-panel">
            <h1>Data Structure - Chapter 3</h1>
            <p class="sub">Linked Lists</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice (50)</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False (50)</button>
        </div>

        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>

    <script>
      const P1_SOURCE = [
            // --- MCQs (50 Questions) ---
            { "q": "What is a linked list?", "o": ["A linear data structure consisting of a collection of nodes linked together", "A static array stored in contiguous memory blocks", "A non-linear tree structure with multiple roots", "A key-value dictionary mapping strings to integers"], "a": 0, "e": "Correct answer ✓\nA linked list is a linear data structure consisting of nodes linked together.", "type": "MCQ" },
            { "q": "What two main components does each node in a linked list contain?", "o": ["Data and a link/pointer to the next node", "An index number and a fixed memory address", "A parent pointer and a child pointer", "A key and a hash value"], "a": 0, "e": "Correct answer ✓\nA node contains two things: data and a link connecting it to another node.", "type": "MCQ" },
            { "q": "What does the 'head' of a linked list point to?", "o": ["The first node in the linked list", "The very last node pointing to NULL", "The middle element of the list", "A random memory location"], "a": 0, "e": "Correct answer ✓\nThe head points to the first node, allowing access to all elements of the linked list.", "type": "MCQ" },
            { "q": "What does the pointer of the last node in a singly linked list point to?", "o": ["NULL (or None)", "The head node", "The previous node", "Memory address 3200"], "a": 0, "e": "Correct answer ✓\nThe last node of a linked list points to null.", "type": "MCQ" },
            { "q": "How are elements in a linked list stored in computer memory compared to arrays?", "o": ["Scattered in memory, not stored in consecutive blocks", "Always stored in strict contiguous sequential blocks", "Stored in reverse chronological order", "Pre-allocated with a fixed maximum capacity"], "a": 0, "e": "Correct answer ✓\nElements are scattered in memory, not stored in consecutive blocks.", "type": "MCQ" },
            { "q": "Why is element access slower in a linked list than in an array?", "o": ["Because you need to traverse nodes sequentially one by one", "Because arrays use binary search exclusively", "Because linked lists lack numerical data values", "Because pointers require sorting before access"], "a": 0, "e": "Correct answer ✓\nElement access is slower since you need to traverse nodes one by one.", "type": "MCQ" },
            { "q": "What is a major advantage of linked lists over arrays regarding memory size?", "o": ["Dynamic memory allocation allowing the list to grow or shrink as needed", "Fixed memory pre-allocation that never changes", "Zero memory overhead for references", "Contiguous block requirements"], "a": 0, "e": "Correct answer ✓\nLinked lists are dynamic in nature and can grow or shrink as needed.", "type": "MCQ" },
            { "q": "Why are insertions and deletions more efficient in linked lists compared to arrays?", "o": ["We only need to adjust pointers without shifting other elements", "We can instantly jump to any index in O(1) time", "Arrays require pointer adjustments for every insertion", "Linked lists require contiguous shifting"], "a": 0, "e": "Correct answer ✓\nInserting or deleting only requires adjusting pointers without shifting elements.", "type": "MCQ." },
            { "q": "What is the memory allocation characteristic of linked lists?", "o": ["Allocates memory for each node separately without needing a large contiguous block", "Requires a massive continuous memory block upfront", "Uses static memory allocation exclusively", "Stores all data inside CPU registers"], "a": 0, "e": "Correct answer ✓\nLinked lists allocate memory for each node separately without needing a large contiguous block.", "type": "MCQ." },
            { "q": "According to the Array vs. Linked List comparison table, what is the memory type of an array?", "o": ["Static", "Dynamic", "Sequential", "Pointer-based"], "a": 0, "e": "Correct answer ✓\nArray memory type is static.", "type": "MCQ." },
            { "q": "According to the Array vs. Linked List comparison table, what is the access method of a linked list?", "o": ["Sequential", "Fast (index)", "Random", "Direct"], "a": 0, "e": "Correct answer ✓\nLinked list access is sequential.", "type": "MCQ." },
            { "q": "Which data structure requires extra memory space for storing pointers?", "o": ["Linked List", "Array", "Primitive integer", "Scalar variable"], "a": 0, "e": "Correct answer ✓\nLinked lists need extra space for pointers.", "type": "MCQ." },
            { "q": "What is the architecture direction of a Singly Linked List?", "o": ["Traversal is possible in only one direction (from head to tail)", "Traversal is possible in both forward and backward directions", "Traversal starts from the tail and moves to the head", "Traversal moves in a circular loop only"], "a": 0, "e": "Correct answer ✓\nA singly linked list allows traversal in one direction, from head to tail.", "type": "MCQ." },
            { "q": "In Python, how is a node function defined in the lectures?", "o": ["def create_node(value, nextn=None): return {'value': value, 'next': nextn}", "class Node: def init(self, val): self.val = val", "def make_node(x): return [x, 0]", "def node(ptr): return ptr.next"], "a": 0, "e": "Correct answer ✓\n`def create_node(value, nextn=None): return {'value': value, 'next': nextn}`.", "type": "MCQ." },
            { "q": "What does the dictionary representation `{'value': 10, 'next': None}` signify?", "o": ["A single node containing value 10 and a next pointer pointing to None", "An empty linked list with no values", "A full array of 10 elements", "A recursive tree branch"], "a": 0, "e": "Correct answer ✓\nIt represents a node with value 10 and next pointing to None.", "type": "MCQ." },
            { "q": "When inserting a node at the front of a linked list, what happens to the new node and head?", "o": ["The new node points to the current head, and head is updated to point to the new node", "The new node becomes the tail, and head remains unchanged", "The head is deleted and replaced by the last node", "All existing nodes are shifted one position to the right"], "a": 0, "e": "Correct answer ✓\nThe new node points to current head, and head becomes the new node.", "type": "MCQ." },
            { "q": "What python code implements adding an element to the beginning of the list?", "o": ["def add_to_first(value): global head; new_node = create_node(value, head); head = new_node; return head", "def add_to_first(value): head.append(value)", "def add_to_first(value): current.next = value", "def add_to_first(value): return create_node(value, None)"], "a": 0, "e": "Correct answer ✓\n`new_node = create_node(value, head); head = new_node`.", "type": "MCQ." },
            { "q": "How does the `print_list(head)` function traverse and print a linked list?", "o": ["Starting from head, following `current = current['next']` in a while loop until `None`", "Using a fixed index loop from 0 to 10", "Printing only the head and tail values", "Using recursion without base cases"], "a": 0, "e": "Correct answer ✓\nIt starts from head and follows `current = current['next']` until `None`.", "type": "MCQ." },
            { "q": "How is removing an element from the beginning of a linked list executed?", "o": ["By returning `head['next']`, making the second node the new head", "By deleting the entire memory heap", "By setting `head['value'] = None`", "By traversing to the last node and deleting it"], "a": 0, "e": "Correct answer ✓\nReturning `head['next']` makes the second node the new head.", "type": "MCQ." },
            { "q": "What should happen if `remove_from_first(head)` is called on an empty list (`head is None`)?", "o": ["It should return None", "It should raise a fatal system error", "It should return a default node with value 0", "It should delete the program file"], "a": 0, "e": "Correct answer ✓\nIf head is None, it returns None (already empty).", "type": "MCQ." },
            { "q": "What are the steps to add an element to the last position of a linked list?", "o": ["Create a new node; if list is empty set head to new node; otherwise traverse until `current['next']` is None, then link last node to new node", "Always insert the node directly at index 0", "Overwrite the head node with the new value", "Sort all nodes in ascending order"], "a": 0, "e": "Correct answer ✓\nSteps: create node, check if empty, traverse until `current['next']` is None, connect new node.", "type": "MCQ." },
            { "q": "Why do we use a separate `current` variable when traversing to add to the last node?", "o": ["Because the head should always point to the first node safely without losing the start of the list", "Because head cannot be read in Python functions", "Because current stores the memory address in binary", "Because head automatically deletes itself during loops"], "a": 0, "e": "Correct answer ✓\nWe use current so the head always points to the first node safely while moving through the list.", "type": "MCQ." },
            { "q": "What are the steps required to remove the last node from a linked list?", "o": ["Check if empty; if only one node set head=None; otherwise use `current` and `prev` pointers until `current['next']` is None, then set `prev['next'] = None`", "Delete the head node immediately", "Shift all nodes backward by one index", "Set `head['next']` to NULL"], "a": 0, "e": "Correct answer ✓\nSteps: check empty, check single node, use current/prev pointers, set `prev['next'] = None`.", "type": "MCQ." },
            { "q": "Why is the `prev` pointer necessary when removing the last node?", "o": ["Because without prev, we wouldn't know who to disconnect since current ends up pointing to the last node", "Because prev holds the total length of the list", "Because Python requires dual pointer syntax for garbage collection", "Because prev stores the index number"], "a": 0, "e": "Correct answer ✓\nWithout prev, we wouldn't know who to disconnect because current ends up pointing to the last node.", "type": "MCQ." },
            { "q": "How does the search operation function in a linked list?", "o": ["Starts from head, compares each node's value while incrementing `pos`, and returns position if found", "Jumps directly to the item using its index in O(1) time", "Uses binary search on sorted pointers", "Searches backward from the null pointer"], "a": 0, "e": "Correct answer ✓\nStarts from head, compares node values one by one, and tracks position.", "type": "MCQ." },
            { "q": "What is the key idea regarding searching in linked lists compared to arrays?", "o": ["We cannot jump directly to an element; we must check one by one until we find it", "Linked lists support instant O(1) index jumping", "Search is performed automatically by hardware cache", "Elements are pre-sorted for binary search"], "a": 0, "e": "Correct answer ✓\nWe cannot jump directly to an element; we must check one by one (sequential access).", "type": "MCQ." },
            { "q": "Which operation uses both `current` and `prev` key variables according to the summary table?", "o": ["Remove from Last", "Add to Last", "Search", "Print List"], "a": 0, "e": "Correct answer ✓\nRemove from Last uses `current` and `prev`.", "type": "MCQ." },
            { "q": "What is the primary difference emphasized in the summary between Arrays and Linked Lists?", "o": ["Arrays = direct access, Linked Lists = sequential access", "Arrays = dynamic memory, Linked Lists = static memory", "Arrays = pointer heavy, Linked Lists = index based", "Arrays = slow insertion, Linked Lists = slow deletion"], "a": 0, "e": "Correct answer ✓\nArrays = direct access, Linked Lists = sequential access.", "type": "MCQ." },
            { "q": "In the visualization example from the lecture, what does the last node of the linked list point to?", "o": ["NULL", "Head", "Node 15", "Address 4400"], "a": 0, "e": "Correct answer ✓\nThe last node of a linked list points to null.", "type": "MCQ." },
            { "q": "What is stored in the node alongside the data pointer in the example with values 15, 3, 17, 90?", "o": ["The address (pointer) of the next node", "The total count of items in the list", "The index number (0, 1, 2, 3)", "A boolean validation flag"], "a": 0, "e": "Correct answer ✓\nEach node contains data and the address (pointer) of the next node.", "type": "MCQ." },
            { "q": "If `head` points to a node containing value 10, what is the output of `print('First node (head):', head)`?", "o": ["`First node (head): {'value': 10, 'next': None}`", "`First node: 10`", "`Head -> 10 -> NULL`", "`Error: Unbound variable`"], "a": 0, "e": "Correct answer ✓\nOutput is `First node (head): {'value': 10, 'next': None}`.", "type": "MCQ." },
            { "q": "When adding elements 5, 15, and 3 consecutively to the beginning of a list starting with `[10]`, what is the resulting visualization?", "o": ["`head -> [3] -> [15] -> [5] -> [10] -> None`", "`head -> [5] -> [15] -> [3] -> [10] -> None`", "`head -> [10] -> [5] -> [15] -> [3] -> None`", "`head -> [3] -> [5] -> [15] -> [10] -> None`"], "a": 0, "e": "Correct answer ✓\nAdding 5, 15, 3 in that order at the beginning results in `[3] -> [15] -> [5] -> [10] -> None`.", "type": "MCQ." },
            { "q": "What does `current = current['next']` accomplish during traversal?", "o": ["Moves the traversal pointer forward to the next node in the list", "Deletes the current node and moves backward", "Resets the head pointer to None", "Doubles the value stored in the node"], "a": 0, "e": "Correct answer ✓\nIt moves us from node to node forward.", "type": "MCQ." },
            { "q": "What is the time complexity of accessing an element by index in a singly linked list?", "o": ["O(n)", "O(1)", "O(log n)", "O(n^2)"], "a": 0, "e": "Correct answer ✓\nSequential access requires O(n) traversal time.", "type": "MCQ." },
            { "q": "What happens when `head['next']` is returned in `remove_from_first(head)` when the list has only one node?", "o": ["It returns None, making the list empty", "It causes a segmentation fault", "It returns the head itself in an infinite loop", "It deletes Python's memory manager"], "a": 0, "e": "Correct answer ✓\nFor a single-node list, returning `head['next']` returns None, making the list empty.", "type": "MCQ." },
            { "q": "In the search function code, what variable keeps track of the node's sequence number?", "o": ["`pos`", "`current`", "`value`", "`head`"], "a": 0, "e": "Correct answer ✓\n`pos` counts the position of each node starting from 1.", "type": "MCQ." },
            { "q": "What message is printed if the search value is not found in the list?", "o": ["\"Value not found\"", "\"Error 404: Node missing\"", "\"None\"", "\"Search failed at head\""], "a": 0, "e": "Correct answer ✓\nIt prints \"Value not found\".", "type": "MCQ." },
            { "q": "Why are linked lists described as having 'More complex' implementation compared to arrays?", "o": ["Because they require manual pointer/reference handling and dynamic node creation", "Because arrays cannot be written in Python", "Because pointers violate operating system laws", "Because linked lists require assembly language"], "a": 0, "e": "Correct answer ✓\nImplementation is more complex due to reference management.", "type": "MCQ." },
            { "q": "What does the abbreviation `nullptr` or `NULL` represent at the end of a linked list diagram?", "o": ["The termination point indicating the end of the list", "The starting address of the head node", "A circular loop back to the first node", "A corrupted memory block"], "a": 0, "e": "Correct answer ✓\nNULL represents the end of the linked list.", "type": "MCQ." },
            { "q": "Which data structure is better suited when frequent insertions and deletions occur at both ends without random indexing?", "o": ["Linked List", "Static Array", "Indexed Matrix", "Sequential File"], "a": 0, "e": "Correct answer ✓\nLinked lists excel at fast insertions and deletions.", "type": "MCQ." },

            // --- Additional Advanced MCQs (41 to 50) ---
            { "q": "What is the primary role of the global keyword in `def add_to_first(value): global head`?", "o": ["To inform Python that the function is modifying the global variable 'head'", "To import global libraries into the function", "To make the linked list run across multiple CPU cores", "To delete all local variables"], "a": 0, "e": "Correct answer ✓\n`global head` tells Python we're using and modifying the global variable 'head'.", "type": "MCQ." },
            { "q": "If a list contains nodes with values `3 -> 15 -> 5 -> 90`, what does `print_list(head)` output?", "o": ["`3 -> 15 -> 5 -> 90 -> None`", "`90 -> 5 -> 15 -> 3 -> None`", "`3, 15, 5, 90`", "`None -> 3 -> 15 -> 5 -> 90`"], "a": 0, "e": "Correct answer ✓\nOutputs `3 -> 15 -> 5 -> 90` followed by `None`.", "type": "MCQ." },
            { "q": "In `add_to_last`, what condition checks if the linked list is currently empty?", "o": ["`if head is None:`", "`if head.length == 0:`", "`if current == NULL:`", "`if list.empty():`"], "a": 0, "e": "Correct answer ✓\n`if head is None:` checks if the list is empty.", "type": "MCQ." },

            { "q": "What is the key advantage of dynamic memory allocation in linked lists?", "o": ["Memory is allocated as needed during execution, avoiding wasted space or overflow limits", "Memory addresses are pre-sorted alphabetically", "Arrays are automatically converted to pointers", "RAM speed is doubled"], "a": 0, "e": "Correct answer ✓\nDynamic allocation allows growing or shrinking as needed without fixed array limits.", "type": "MCQ." },
            { "q": "In the context of linked lists, what does 'sequential access' mean?", "o": ["Accessing elements by starting from the head and following pointers one by one", "Accessing elements using a mathematical index formula in O(1)", "Accessing elements in reverse order only", "Accessing elements randomly via hashing"], "a": 0, "e": "Correct answer ✓\nSequential access means traversing nodes one by one from the head.", "type": "MCQ." }

       const P2_SOURCE = [
            // --- True/False (50 Questions) ---

            { "q": "5. Elements in a linked list are stored in consecutive memory blocks like arrays.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Elements are scattered in memory, not stored in consecutive blocks.", "type": "TF" },
            { "q": "6. Linked lists can grow or shrink dynamically.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Linked lists can grow or shrink dynamically.", "type": "TF" },
            { "q": "7. Element access in linked lists is faster than in arrays because of direct indexing.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Element access is slower since you need to traverse nodes one by one.", "type": "TF" },
            { "q": "8. Unlike arrays with fixed sizes, linked lists are dynamic in nature.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Unlike arrays which have a fixed size, linked lists are dynamic.", "type": "TF" },
            { "q": "9. Inserting or deleting elements in a linked list requires shifting all subsequent elements.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: We only adjust pointers without shifting other elements.", "type": "TF" },
            { "q": "10. Linked lists require a large contiguous block of memory to be allocated upfront.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: There is no need to allocate a large contiguous block of memory.", "type": "TF" },
            { "q": "11. According to the comparison table, array memory type is static while linked list memory type is dynamic.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Array is static, Linked List is dynamic.", "type": "TF" },
            { "q": "12. Arrays provide fast index-based access, whereas linked lists use sequential access.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Array access is fast (index), Linked list access is sequential.", "type": "TF" },
            { "q": "13. Linked lists require extra memory space to store pointers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Linked lists need extra space for pointers.", "type": "TF" },
            { "q": "14. A singly linked list allows traversal in both forward and backward directions.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Singly linked lists allow traversal in one direction only.", "type": "TF" },
            { "q": "15. In a singly linked list, each node has a single reference (next) to the next node.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Each node has a single reference (next) to the next node.", "type": "TF" },
            { "q": "16. The function `create_node(value, nextn=None)` returns a dictionary with 'value' and 'next' keys.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: It builds a node containing 'value' and 'next'.", "type": "TF" },
            { "q": "17. Initializing a linked list with `head = create_node(10)` results in `{'value': 10, 'next': None}`.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Output is `{'value': 10, 'next': None}`.", "type": "TF" },
            { "q": "18. When adding an element to the beginning of a linked list, the new node's next pointer is set to the current head.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `new_node = create_node(value, head)` points to current head.", "type": "TF" },
            { "q": "19. After adding an element to the front, the `head` variable is updated to point to the `new_node`.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `head = new_node`.", "type": "TF" },
            { "q": "20. The `print_list` function starts traversal from the tail and moves backward to the head.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: It starts from head and moves forward using `current['next']`.", "type": "TF" },
            { "q": "21. Removing an element from the beginning of a linked list is done by returning `head['next']`.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Second node becomes the new head when returning `head['next']`.", "type": "TF" },
            { "q": "22. If `head` is None, `remove_from_first(head)` should return None because the list is already empty.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Returns None if already empty.", "type": "TF" },
            { "q": "23. When adding an element to the last position, if the list is empty (`head is None`), the new node becomes the head.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: If head is None, head = new_node.", "type": "TF" },
            { "q": "24. We use a separate `current` variable when adding to the last node so that the `head` pointer remains safely at the first node.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Head should always point to the first node, so we use current to move safely.", "type": "TF" },
            { "q": "25. Removing the last node requires two pointers (`current` and `prev`) because we need to know who to disconnect before reaching the end.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Prev keeps track of the node before the last one to break the link.", "type": "TF" },
            { "q": "26. In `remove_from_last()`, setting `prev['next'] = None` successfully removes the last node.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `prev['next'] = None` breaks the link to the last node.", "type": "TF" },
            { "q": "27. Searching for a value in a linked list allows jumping directly to the target position in O(1) time.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: We cannot jump directly; we must check one by one (sequential access).", "type": "TF" },
            { "q": "28. The search function tracks the position of each node using a variable named `pos`.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `pos` counts the position of each node.", "type": "TF" },
            { "q": "29. Arrays provide direct access while linked lists require sequential access.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Arrays = direct access, Linked Lists = sequential access.", "type": "TF" },
            { "q": "30. Implementation of linked lists is considered easier than arrays according to the comparison table.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Implementation for arrays is easier, while linked lists are more complex.", "type": "TF" },
            { "q": "31. In the node structure diagram, the data part and the next pointer part are clearly separated.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Each node contains Data and Next/Pointer.", "type": "TF" },
            { "q": "32. Global variables like `head` can be modified inside Python functions using the `global` keyword.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `global head` tells Python we are using the global variable.", "type": "TF" },
            { "q": "33. If a list has only a single node, removing the last node sets `head = None`.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: If `head['next'] is None`, `head = None`.", "type": "TF" },
            { "q": "34. The `current` variable stops moving when `current['next']` is equal to `None` during `add_to_last` traversal.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: We keep moving until `current['next'] is None`.", "type": "TF" },
            { "q": "35. Linked lists require extra memory overhead because every node must store a reference to the next node.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Needs extra space for pointers.", "type": "TF" },
            { "q": "36. Traversing a linked list means visiting nodes one by one following the `next` links.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Traversal follows `current = current['next']`.", "type": "TF" },
            { "q": "37. Inserting an element at the end of a singly linked list without a tail pointer always takes O(1) time.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: It takes O(n) time because you must traverse to the end.", "type": "TF" },
            { "q": "38. Python dictionaries used as nodes in these lectures store keys named 'value' and 'next'.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: They use 'value' and 'next' keys.", "type": "TF" },
            { "q": "39. The head pointer itself contains the actual data value of the first node.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Head is a pointer that points to the first node dictionary/object, not the data value itself.", "type": "TF" },
            { "q": "40. Linked lists are inefficient when you need rapid random access to elements by index number.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Sequential access makes random indexing slow (O(n)).", "type": "TF" },

            // --- High-Level True/False (41 to 50) ---
            { "q": "[HIGH-LEVEL] 41. True or False: If you lose the reference to the `head` pointer of a linked list, you lose access to all subsequent nodes in the list.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Since nodes are linked sequentially via pointers, losing head means losing the entry point to the entire list.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 42. True or False: In Python, assigning `head = remove_from_first(head)` correctly updates the global head reference when deleting the first node.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Caller should assign `head = remove_from_first(head)` to update the head pointer.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 43. True or False: The `prev` pointer in `remove_from_last()` is always positioned two nodes ahead of `current` during traversal.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: `prev` stays one step behind `current`, not two nodes ahead.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 44. True or False: Because linked lists allocate memory dynamically for each node, they completely eliminate the external fragmentation problems found in static arrays.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Dynamic allocation in linked lists can actually lead to memory fragmentation over time due to scattered heap allocations.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 45. True or False: If a linked list has 5 nodes, the `pos` counter in the search function will reach a maximum value of 5 when searching for the last element.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: `pos` starts at 1 and increments for each node, reaching 5 at the fifth node.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 46. True or False: In the `add_to_last` function shown in the notes, modifying `head` directly inside the loop condition would be a safe practice.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Modifying head directly would cause you to lose track of the start of the list; that is why `current` is used.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. True or False: The time complexity to search for an element in an unsorted linked list of size n is O(n) in the worst case.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Sequential traversal requires checking elements one by one, taking O(n) time.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. True or False: A singly linked list can be traversed from tail to head as easily as from head to tail without any auxiliary structures.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Singly linked lists only store forward pointers (next), making backward traversal impossible without additional structures or a doubly linked list.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. True or False: If `current['next']` is None, it indicates that `current` is currently referencing the last node of the linked list.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: The last node points to null/None, so `current['next'] is None` identifies the final node.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. True or False: Linked lists are generally preferred over arrays when memory is extremely constrained and extra pointer overhead must be avoided at all costs.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Arrays are preferred when memory overhead must be minimized because linked lists require extra space for pointers.", "type": "TF" }
        ];
        
        const getQuestionType = question => String(question.type).replace(/[^A-Za-z]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');

            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i === 0 ? 'T' : 'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
