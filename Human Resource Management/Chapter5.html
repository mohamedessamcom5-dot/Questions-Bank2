<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HRM — Chapter 5</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Human Resource Management — Chapter 5</h1>
            <p class="sub">Interviewing Candidates</p>
        </div>
    
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice (50)</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False (50)</button>
        </div>
    
        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
    
    <script>
        const P1_SOURCE = [
            // --- Standard MCQs (1 to 45) ---
            { "q": "How is an interview formally defined in Chapter 5?", "o": ["A procedure designed to obtain information from a person through oral responses to oral inquiries", "A written exam evaluating technical coding speed", "A physical health and medical screening test", "A financial audit of company payroll records"], "a": 0, "e": "Correct answer ✓\nAn interview is defined as a procedure designed to obtain information through oral responses to oral inquiries.", "type": "MCQ" },
            { "q": "What is the primary purpose of a performance appraisal interview?", "o": ["To give the employee a chance to defend against poor evaluations and the manager a chance to explain performance views", "To discuss why an employee is leaving the organization permanently", "To predict future job performance based on oral inquiries before hiring", "To negotiate annual corporate office rental leases"], "a": 0, "e": "Correct answer ✓\nPerformance appraisal interviews provide employees a chance to defend against poor evaluations and managers a chance to explain performance views.", "type": "MCQ" },
            { "q": "What is an 'exit interview'?", "o": ["An interview held with an employee about why they are leaving an organization", "An entrance interview conducted on the applicant's first day of work", "A quarterly performance review meeting", "A retirement financial planning seminar"], "a": 0, "e": "Correct answer ✓\nExit interviews are held with leaving employees to discuss reasons for departure and work experiences.", "type": "MCQ" },
            { "q": "How is a 'selection interview' defined?", "o": ["A selection procedure designed to predict future job performance based on applicants' oral responses to oral inquiries", "An informal chat about hobbies during lunch break", "An audit of past tax returns", "A psychological counseling session"], "a": 0, "e": "Correct answer ✓\nA selection interview is designed to predict future job performance based on oral responses to oral inquiries.", "type": "MCQ" },
            { "q": "What are the primary criteria used to classify selection interviews?", "o": ["How structured they are and how the firm administers the interviews", "The office floor color and building temperature", "The candidate's age and university GPA", "The time of day the interview takes place"], "a": 0, "e": "Correct answer ✓\nSelection interviews are classified according to how structured they are and how the firm administers them.", "type": "MCQ" },
            { "q": "What characterizes an unstructured (or nondirective) interview?", "o": ["The manager follows no set format and asks unstructured questions like a general conversation", "The employer uses strict printed forms with pre-scored benchmark answers", "Every candidate is asked identical predetermined questions", "The interview is conducted entirely by a computer algorithm"], "a": 0, "e": "Correct answer ✓\nIn unstructured interviews, the manager follows no set format, resembling a general conversation.", "type": "MCQ" },
            { "q": "What characterizes a structured (or directive) interview?", "o": ["The employer lists questions ahead of time and may even list and score possible answers using a printed form", "The manager asks random questions as they come to mind", "The interview has no prepared format or agenda", "The candidate interviews themselves on video"], "a": 0, "e": "Correct answer ✓\nStructured interviews involve listing questions ahead of time and following a printed form.", "type": "MCQ" },
            { "q": "Why are structured interviews generally superior to unstructured interviews?", "o": ["All interviewers ask the same questions, they are more reliable/valid, and they increase consistency and job relatedness", "They take less than 2 minutes to complete", "They eliminate the need for job descriptions", "They allow managers to hire friends easily"], "a": 0, "e": "Correct answer ✓\nStructured interviews are superior because they are reliable, valid, standardized, and ensure all applicants are asked the same questions.", "type": "MCQ" },
            { "q": "Which type of interview question asks the candidate what their behavior would be in a given situation?", "o": ["Situational Questions", "Behavioral Questions", "Job-related Questions", "Unstructured casual questions"], "a": 0, "e": "Correct answer ✓\nSituational questions ask what behavior would be in a given hypothetical situation.", "type": "MCQ." },
            { "q": "Which type of interview question asks applicants to describe how they reacted to actual situations in the past?", "o": ["Behavioral Questions", "Situational Questions", "Job-knowledge questions", "Graphical IQ questions"], "a": 0, "e": "Correct answer ✓\nBehavioral questions ask applicants to describe how they reacted to past actual situations.", "type": "MCQ." },
            { "q": "What do job-related interview questions focus on?", "o": ["Relevant past experiences and skills/strengths (without revolving around specific hypothetical scenarios)", "Hypothetical future zombie apocalypse scenarios", "Childhood hobbies and favorite movies", "Physical height and weight measurements"], "a": 0, "e": "Correct answer ✓\nJob-related questions ask about relevant past experiences and skills without revolving around hypothetical situations.", "type": "MCQ." },
            { "q": "What are the primary ways employers administer interviews?", "o": ["One-on-one or by a panel; sequentially or all at once; and computerized or personally", "By mail, fax, or carrier pigeon", "Only via public television broadcasts", "Exclusively through social media chat rooms"], "a": 0, "e": "Correct answer ✓\nEmployers administer interviews one-on-one/panel, sequentially/all-at-once, and computerized/personally.", "type": "MCQ." },
            { "q": "What is a 'sequential' (or serial) interview?", "o": ["Interviewing the applicant in sequence, one-on-one, by multiple interviewers before making a hiring decision", "Interviewing 50 candidates simultaneously in a large auditorium", "An interview conducted entirely by an automated chatbot", "A single phone call lasting 5 seconds"], "a": 0, "e": "Correct answer ✓\nSequential interviews involve interviewing the applicant in sequence, one-on-one, before deciding.", "type": "MCQ." },
            { "q": "What is a 'panel interview' (board interview)?", "o": ["An interview conducted by a team of interviewers (usually two to three) who together interview the candidate", "A single manager interviewing a candidate in a closed office", "An interview conducted by workers in a factory assembly line", "An online survey filled out independently"], "a": 0, "e": "Correct answer ✓\nPanel interviews are conducted by a team of 2-3 interviewers together.", "type": "MCQ." },
            { "q": "What is an advantage of a panel interview?", "o": ["It may get more meaningful responses than are normally produced by a series of one-on-one interviews", "It is always shorter than one-on-one interviews", "It eliminates all candidate stress completely", "It requires zero preparation by managers"], "a": 0, "e": "Correct answer ✓\nPanel interviews may produce more meaningful responses than individual interviews.", "type": "MCQ." },
            { "q": "What is a disadvantage of panel interviews?", "o": ["Some candidates find them more stressful, which may inhibit their responses", "They take less than 30 seconds", "They prevent interviewers from ever scoring candidates", "They are illegal in all manufacturing sectors"], "a": 0, "e": "Correct answer ✓\nCandidates may find panel interviews stressful, preventing optimal responses.", "type": "MCQ." },
            { "q": "What did research show regarding telephone interviews compared to face-to-face interviews?", "o": ["Phone interviews can be more accurate for judging conscientiousness, intelligence, and interpersonal skills, favoring less attractive candidates", "Phone interviews are completely useless and illegal", "Phone interviews eliminate all speech sounds", "Face-to-face interviews are always 100% objective"], "a": 0, "e": "Correct answer ✓\nPhone interviews can be more accurate for certain traits and favor less physically attractive applicants.", "type": "MCQ." },
            { "q": "Which of the following is recommended for candidates during video/web-assisted interviews?", "o": ["Look presentable, clean up the room, test first, do a dry run, and relax", "Wear pajamas and sit in front of a pile of trash", "Test your internet connection 5 seconds after the interview ends", "Shout loudly to test microphone gain"], "a": 0, "e": "Correct answer ✓\nVideo interview tips include looking presentable, cleaning the room, testing first, doing a dry run, and relaxing.", "type": "MCQ." },
            { "q": "What is a computerized selection interview?", "o": ["An interview where a candidate's oral/computerized replies are obtained in response to computerized questions/situations", "A video game played during office hours", "An automated payroll calculation spreadsheet", "A manual paper questionnaire filled with ink"], "a": 0, "e": "Correct answer ✓\nComputerized interviews obtain candidate replies in response to computerized questions and scenarios.", "type": "MCQ." },
            { "q": "What is the structured situational interview?", "o": ["A series of job-relevant questions with predetermined answers that interviewers ask all applicants, leading to superior results", "An informal conversation about sports over coffee", "An unscripted grilling session by department heads", "A psychological stress test with no right or wrong answers"], "a": 0, "e": "Correct answer ✓\nStructured situational interviews use job-relevant questions with predetermined answers for all applicants.", "type": "MCQ." },
            { "q": "What is the first step in designing a structured situational interview?", "o": ["Analyze the job (write a job description, duties, and required KSAs)", "Appoint the interview panel and buy coffee", "Print multiple-choice test booklets", "Hire external consultants"], "a": 0, "e": "Correct answer ✓\nStep 1 is analyzing the job by writing a job description and required KSAs.", "type": "MCQ." },
            { "q": "What is Step 2 in designing a structured situational interview?", "o": ["Rate the job's main duties (e.g., from 1 to 5 based on importance to job success)", "Create interview questions for hobbies", "Conduct mock interviews with interns", "Select office furniture"], "a": 0, "e": "Correct answer ✓\nStep 2 is rating each job duty based on importance to job success.", "type": "MCQ." },
            { "q": "What is Step 4 in designing a structured situational interview?", "o": ["Create benchmark answers (ideal answers for good [5], marginal [3], and poor [1] ratings)", "Schedule the office holiday party", "Test the office internet speed", "Publish job ads on social media"], "a": 0, "e": "Correct answer ✓\nStep 4 is creating benchmark answers for good, marginal, and poor ratings.", "type": "MCQ." },
            { "q": "What is Step 5 in designing a structured situational interview?", "o": ["Appoint the interview panel and conduct interviews (reviewing job description, questions, and benchmark answers beforehand)", "Dismiss all applicants who fail a background check", "File paperwork in archive cabinets", "Send rejection letters via postal mail"], "a": 0, "e": "Correct answer ✓\nStep 5 is appointing the interview panel and conducting interviews after reviewing materials.", "type": "MCQ." },
            { "q": "What is Step 1 of 'How to Conduct an Effective Interview'?", "o": ["Make sure you know the job (study the job description and human skills needed)", "Wear a formal suit and tie", "Turn off all office lights", "Prepare a list of trick questions"], "a": 0, "e": "Correct answer ✓\nStep 1 is making sure you know the job and studying the job description.", "type": "MCQ." },
            { "q": "What is Step 2 in conducting an effective interview?", "o": ["Structure the interview (use job-knowledge/situational/behavioral questions, same questions for all, rating scales)", "Improvise all questions on the spot", "Ask personal illegal questions about marital status", "Keep interviews completely unstructured"], "a": 0, "e": "Correct answer ✓\nStep 2 is structuring the interview using standardized job-related questions and rating scales.", "type": "MCQ." },
            { "q": "What is Step 3 in conducting an effective interview?", "o": ["Get organized (hold the interview in a private room minimizing phone calls and text interruptions)", "Conduct interviews in a busy cafeteria with loud music", "Leave your phone ringing on maximum volume", "Stand in the middle of a hallway"], "a": 0, "e": "Correct answer ✓\nStep 3 is getting organized in a private room minimizing interruptions.", "type": "MCQ." },
            { "q": "What is Step 4 in conducting an effective interview?", "o": ["Establish rapport (put the person at ease, greet them, and start with a noncontroversial question)", "Immediately interrogate the candidate about past failures", "Stare silently at the candidate for 10 minutes", "Ask the candidate to pay an application fee"], "a": 0, "e": "Correct answer ✓\nStep 4 is establishing rapport by putting the candidate at ease with a noncontroversial question.", "type": "MCQ." },
            { "q": "What is Step 5 in conducting an effective interview?", "o": ["Ask questions (follow the situational, behavioral, and job knowledge questions written ahead of time)", "Ask random personal questions about political views", "Change interview questions for every candidate", "Talk about yourself for the entire hour"], "a": 0, "e": "Correct answer ✓\nStep 5 is asking the pre-prepared situational, behavioral, and job knowledge questions.", "type": "MCQ." },
            { "q": "What is Step 6 in conducting an effective interview?", "o": ["Take brief notes during the interview (to avoid snap decisions and help memory recall)", "Memorize everything without writing a single word", "Record secret audio without candidate consent", "Write notes two weeks after the interview"], "a": 0, "e": "Correct answer ✓\nStep 6 is taking brief notes during the interview to avoid snap decisions and aid memory.", "type": "MCQ." },
            { "q": "What is Step 7 in conducting an effective interview?", "o": ["Close the interview (leave time to answer any questions the candidate may have)", "Abruptly kick the candidate out of the room", "Promise the job immediately to everyone", "Ask for the candidate's car keys"], "a": 0, "e": "Correct answer ✓\nStep 7 is closing the interview and leaving time for candidate questions.", "type": "MCQ." },
            { "q": "What is Step 8 in conducting an effective interview?", "o": ["Review the interview (review notes, score interview guide answers, and make a decision after the candidate leaves)", "Make a snap hiring decision in front of the candidate", "Throw away all interview notes immediately", "Delete candidate resumes permanently"], "a": 0, "e": "Correct answer ✓\nStep 8 is reviewing notes, scoring answers, and making a decision after the candidate leaves.", "type": "MCQ." },
            { "q": "Which interview type gives the manager a chance to explain views on performance while allowing the employee to defend against poor evaluations?", "o": ["Performance appraisal interview", "Exit interview", "Selection interview", "Panel interview"], "a": 0, "e": "Correct answer ✓\nPerformance appraisal interviews serve this exact evaluative and defensive purpose.", "type": "MCQ." },
            { "q": "Why do employers conduct exit interviews?", "o": ["To discuss the employee's reasons for leaving and their experience working for the organization", "To convince the employee to stay by doubling their salary on the spot", "To confiscate company equipment and keys", "To conduct a medical checkup"], "a": 0, "e": "Correct answer ✓\nExit interviews discuss reasons for leaving and workplace experiences.", "type": "MCQ." },
            { "q": "What distinguishes situational interviews from behavioral interviews?", "o": ["Situational ask how they would react to a hypothetical situation today/tomorrow, while behavioral ask about past actual reactions", "Situational are illegal, behavioral are legal", "Situational are written, behavioral are oral", "There is no difference between them"], "a": 0, "e": "Correct answer ✓\nSituational asks about hypothetical future reactions; behavioral asks about past actual reactions.", "type": "MCQ." },
            { "q": "In an unstructured sequential interview, how does the interviewer proceed?", "o": ["Generally just asks questions as they come to mind", "Uses a strict printed form with benchmark numerical scores", "Follows a rigid government-mandated script", "Asks zero questions"], "a": 0, "e": "Correct answer ✓\nIn unstructured sequential interviews, questions are asked as they come to mind.", "type": "MCQ." },
            { "q": "In a structured sequential interview, what does the hiring manager do before deciding whom to hire?", "o": ["Reviews and compares candidate ratings on standard evaluation forms using standardized questions", "Pulls names randomly from a hat", "Asks department interns to vote", "Relies entirely on gut feeling"], "a": 0, "e": "Correct answer ✓\nThe hiring manager reviews and compares standardized evaluation forms before deciding.", "type": "MCQ." },
            { "q": "What format do typical computerized selection interviews present questions in?", "o": ["Multiple-choice format", "Essay writing format", "Oral spoken poetry format", "Physical puzzle assembly"], "a": 0, "e": "Correct answer ✓\nTypical computerized interviews present questions in multiple-choice format.", "type": "MCQ." },
            { "q": "During Step 2 of designing a structured situational interview, what numerical range is suggested for rating job duties?", "o": ["From 1 to 5 based on importance to job success", "From 1 to 100", "From -10 to +10", "From A to Z"], "a": 0, "e": "Correct answer ✓\nDuties are rated from 1 to 5 based on importance.", "type": "MCQ." },
            { "q": "In benchmark answers for structured situational interviews, what rating corresponds to a 'good' answer?", "o": ["A 5 rating", "A 1 rating", "A 3 rating", "A 0 rating"], "a": 0, "e": "Correct answer ✓\nA good answer receives a 5 rating.", "type": "MCQ." },
            { "q": "In benchmark answers for structured situational interviews, what rating corresponds to a 'marginal' answer?", "o": ["A 3 rating", "A 5 rating", "A 1 rating", "A 10 rating"], "a": 0, "e": "Correct answer ✓\nA marginal answer receives a 3 rating.", "type": "MCQ." },
            { "q": "In benchmark answers for structured situational interviews, what rating corresponds to a 'poor' answer?", "o": ["A 1 rating", "A 3 rating", "A 5 rating", "A -5 rating"], "a": 0, "e": "Correct answer ✓\nA poor answer receives a 1 rating.", "type": "MCQ." },
            { "q": "Why should interviewers take brief notes during the interview (Step 6)?", "o": ["To help avoid making a snap decision early and to aid memory recall once complete", "To hand over notes to the candidate as a souvenir", "To doodle caricatures of applicants", "To write meeting minutes for the board of directors"], "a": 0, "e": "Correct answer ✓\nNotes prevent early snap decisions and aid memory after the interview.", "type": "MCQ." },
            { "q": "What is the primary benefit of standardizing interview questions across all candidates?", "o": ["Increases consistency, enhances job relatedness, and reduces bias", "Makes the interview last exactly 3 minutes", "Eliminates the need for job descriptions", "Allows managers to ask personal trivia questions"], "a": 0, "e": "Correct answer ✓\nStandardizing increases consistency, enhances job relatedness, and reduces bias.", "type": "MCQ." },
            { "q": "Which interview administration method involves meeting alone where one seeks oral responses to oral inquiries?", "o": ["One-on-one interview", "Panel interview", "Computerized interview", "Broadcast television interview"], "a": 0, "e": "Correct answer ✓\nOne-on-one interviews involve two people meeting alone with oral inquiries and responses.", "type": "MCQ." },

            // --- High-Level MCQs (46 to 50) ---
            { "q": "[HIGH-LEVEL] 46. An inexperienced hiring manager conducts an unstructured interview without a job description, asking random spontaneous questions and hiring the candidate who 'feels right'. Based on Chapter 5 principles, why is this hiring decision legally and operationally vulnerable?", "o": ["Because unstructured interviews lack standardization, reliability, and job relatedness, increasing bias and risk of poor hires or legal challenges", "Because the manager failed to use a computer webcam", "Because unstructured interviews are illegal for remote employees only", "Because the interview took less than 10 minutes"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nUnstructured interviews lack standardization, leading to high bias, low validity, and legal vulnerability.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 47. A selection panel designs a structured situational interview but fails to establish benchmark answers (good=5, marginal=3, poor=1) prior to interviewing candidates. How does this omission compromise the interview process?", "o": ["It removes objective scoring criteria, causing panel members to rely on subjective personal impressions rather than standardized evaluation", "It cuts the interview time in half", "It converts the interview into an automated video test", "It violates federal minimum wage laws"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nWithout benchmark answers, scoring lacks objective criteria, reintroducing subjectivity.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 48. During a video interview, a candidate sits in front of a messy room piled with laundry, experiences internet failure because they didn't test beforehand, and appears visibly stressed. What key guidelines from Chapter 5 were violated?", "o": ["Cleaning up the room, testing first, doing a dry run, and relaxing", "Looking professional and wearing a formal suit", "Submitting paper resumes via postal mail", "Conducting a panel interview in person"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nThe candidate violated video interview guidelines: cleaning the room, testing first, doing a dry run, and relaxing.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 49. A manager makes a final hiring decision immediately upon hearing the candidate's first answer during a 30-minute interview, ignoring all subsequent responses. Which interview step and pitfall does this violate?", "o": ["Step 6 (taking brief notes to avoid making a snap decision early in the interview)", "Step 1 (knowing the job description)", "Step 4 (establishing rapport)", "Step 7 (closing the interview)"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nMaking snap decisions early violates Step 6, where note-taking helps avoid premature conclusions.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 50. Why does a structured situational interview yield superior predictive validity compared to an unstructured conversational interview?", "o": ["Because it evaluates all candidates against identical job-derived duties using predetermined questions and benchmark scoring scales", "Because it is conducted entirely by artificial intelligence without human oversight", "Because it eliminates all job descriptions", "Because it relies solely on candidate physical appearance"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nStandardized job-derived duties, predetermined questions, and benchmark scoring yield superior validity.", "type": "MCQ" }
        ];

        const P2_SOURCE = [
            // --- Standard TFs (1 to 45) ---
            { "q": "1. An interview is defined as a procedure designed to obtain information through oral responses to oral inquiries.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: This is the exact definition of an interview in Chapter 5.", "type": "TF" },
            { "q": "2. Performance appraisal interviews give employees a chance to defend against poor evaluations.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appraisal interviews provide this defense opportunity.", "type": "TF" },
            { "q": "3. Exit interviews are conducted with employees to discuss why they are leaving an organization.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Exit interviews review departure reasons and work experiences.", "type": "TF" },
            { "q": "4. Selection interviews are designed to predict future job performance based on oral responses.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Selection interviews predict future performance.", "type": "TF" },
            { "q": "5. Selection interviews can be classified according to how structured they are and how the firm administers them.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structure and administration method are the two classification bases.", "type": "TF" },
            { "q": "6. Unstructured interviews follow a strict predetermined format with rigorous scoring keys.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured interviews follow no set format and resemble general conversations.", "type": "TF" },
            { "q": "7. Structured interviews involve listing questions ahead of time and using printed forms.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured interviews use pre-listed questions and forms.", "type": "TF" },
            { "q": "8. Structured interviews are generally superior because they are more reliable and valid.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured interviews offer higher reliability and validity.", "type": "TF" },
            { "q": "9. Situational questions ask candidates what their behavior would be in a given situation.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Situational questions address hypothetical future behavior.", "type": "TF" },
            { "q": "10. Behavioral questions ask applicants to describe how they reacted to actual situations in the past.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Behavioral questions examine past actual reactions.", "type": "TF" },
            { "q": "11. Job-related questions revolve around hypothetical future scenarios rather than past experiences.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Job-related questions ask about relevant past experiences and skills, not hypothetical scenarios.", "type": "TF" },
            { "q": "12. Most selection interviews are conducted one-on-one and sequentially.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: One-on-one and sequential is the most common format.", "type": "TF" },
            { "q": "13. A panel interview is conducted by a team of interviewers (usually two to three) who combine ratings.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Panel interviews involve a team of 2-3 interviewers.", "type": "TF" },
            { "q": "14. Panel interviews never cause candidate stress and are universally preferred by all applicants.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Some candidates find panel interviews more stressful, which may inhibit responses.", "type": "TF" },
            { "q": "15. Phone interviews can sometimes be more accurate than face-to-face interviews for judging conscientiousness and intelligence.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Phone interviews can be more accurate for these traits.", "type": "TF" },
            { "q": "16. Video/web-assisted interviews require candidates to check internet connections and clean up their rooms.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Room cleanliness and technical testing are key video guidelines.", "type": "TF" },
            { "q": "17. Computerized selection interviews obtain candidate replies in response to computerized questions in multiple-choice formats.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Computerized interviews use multiple-choice formats online.", "type": "TF" },
            { "q": "18. Structured situational interviews consist of job-relevant questions with predetermined answers asked of all applicants.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: This defines structured situational interviews.", "type": "TF" },
            { "q": "19. Step 1 of designing a structured situational interview is analyzing the job and writing a job description.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Job analysis is Step 1.", "type": "TF" },
            { "q": "20. Step 2 of designing a structured situational interview involves rating job duties from 1 to 5 based on importance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Duties are rated from 1 to 5.", "type": "TF" },
            { "q": "21. Step 4 of designing a structured situational interview involves creating benchmark answers for good, marginal, and poor responses.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Benchmark answers are created in Step 4.", "type": "TF" },
            { "q": "22. Step 5 of designing a structured situational interview involves appointing an interview panel and conducting interviews.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appointing the panel and conducting interviews is Step 5.", "type": "TF" },
            { "q": "23. Step 1 of conducting an effective interview is making sure you know the job by studying the job description.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Knowing the job description is Step 1.", "type": "TF" },
            { "q": "24. Step 2 of conducting an effective interview is structuring the interview using standardized job-related questions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structuring is Step 2.", "type": "TF" },
            { "q": "25. Step 3 of conducting an effective interview is getting organized by holding the interview in a private room minimizing interruptions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Private rooms and minimizing interruptions make up Step 3.", "type": "TF" },
            { "q": "26. Step 4 of conducting an effective interview is establishing rapport by putting the person at ease with a noncontroversial question.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Establishing rapport is Step 4.", "type": "TF" },
            { "q": "27. Step 5 of conducting an effective interview is asking pre-prepared situational, behavioral, and job knowledge questions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Asking prepared questions is Step 5.", "type": "TF" },
            { "q": "28. Step 6 of conducting an effective interview is taking brief notes during the interview to avoid snap decisions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Taking brief notes is Step 6.", "type": "TF" },
            { "q": "29. Step 7 of conducting an effective interview is closing the interview and answering candidate questions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Closing the interview is Step 7.", "type": "TF" },
            { "q": "30. Step 8 of conducting an effective interview is reviewing notes, scoring answers, and making a decision after the candidate leaves.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Reviewing notes and making a decision afterward is Step 8.", "type": "TF" },
            { "q": "31. Unstructured interviews are superior to structured interviews in predicting long-term job performance.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Structured interviews are superior in reliability and validity compared to unstructured ones.", "type": "TF" },
            { "q": "32. Sequential interviews involve multiple interviewers meeting the candidate one after another.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Sequential interviews happen one-on-one in sequence.", "type": "TF" },
            { "q": "33. Interviewers generally evaluated applicants more favorably in telephone versus face-to-face interviews when applicants were less physically attractive.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Phone interviews favored less physically attractive applicants.", "type": "TF" },
            { "q": "34. Candidates surveyed in Chapter 5 research preferred video interviews over face-to-face interviews.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: The text states applicants themselves preferred face-to-face interviews.", "type": "TF" },
            { "q": "35. Computerized selection interviews never use video-based scenarios or realistic workplace simulation tasks.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Some computerized interviews are video-based and confront candidates with realistic scenarios.", "type": "TF" },
            { "q": "36. Job analysis and job descriptions are irrelevant when designing structured situational interviews.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Job analysis and descriptions are the mandatory first step.", "type": "TF" },
            { "q": "37. In rating job duties during interview design, a rating of 1 to 5 reflects importance to job success.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Duties are rated 1 to 5 based on job success importance.", "type": "TF" },
            { "q": "38. Benchmark answers in structured interviews provide ideal reference points for good (5), marginal (3), and poor (1) ratings.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Benchmark answers provide 5, 3, and 1 ratings.", "type": "TF" },
            { "q": "39. Panel members should review job descriptions, questions, and benchmark answers before conducting interviews.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Panel members review these materials beforehand.", "type": "TF" },
            { "q": "40. Starting an interview with a controversial political question is an effective way to establish rapport.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Rapport is established by asking a noncontroversial question.", "type": "TF" },
            { "q": "41. Taking brief notes during an interview helps prevent early snap decisions and aids memory recall.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Note-taking prevents snap judgments and supports memory.", "type": "TF" },
            { "q": "42. Standardizing interview questions increases consistency across candidates and enhances job relatedness.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Standardization increases consistency and job relatedness.", "type": "TF" },
            { "q": "43. Less talented interviewers can conduct better interviews when using structured interview formats.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured formats help less talented interviewers conduct better interviews.", "type": "TF" },
            { "q": "44. Exit interviews are primarily designed to evaluate employee performance for annual salary raises.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Exit interviews discuss why an employee is leaving and their work experience, not salary raises.", "type": "TF" },
            { "q": "45. A selection interview aims to predict future job performance based on oral responses to oral inquiries.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: This defines selection interviews.", "type": "TF" },

            // --- High-Level TFs (46 to 50) ---
            { "q": "[HIGH-LEVEL] 46. An unstructured conversational interview yields higher inter-rater reliability and predictive validity than a structured situational interview.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Structured interviews yield superior reliability and validity compared to unstructured ones.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. Failing to review job descriptions or establish benchmark answers prior to conducting a selection panel introduces severe subjective bias into the hiring process.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Lack of preparation and benchmarks introduces subjective bias.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. In a structured sequential interview, independent interviewers rate candidates on standard evaluation forms using standardized questions before hiring managers compare evaluations.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Structured sequential interviews use standardized forms and questions before final review.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. Asking candidates illegal personal questions about religion or marital status is a recommended core component of Step 2 in conducting an effective interview.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Personal questions regarding protected characteristics violate equal employment laws and are not recommended.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. Taking no notes during an interview and relying entirely on memory hours later is the best practice recommended in Chapter 5 to prevent snap judgments.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Chapter 5 explicitly recommends taking brief notes during the interview to avoid snap decisions and aid memory.", "type": "TF" }
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
