<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HRM — Chapter 7</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Human Resource Management — Chapter 7 </h1>
            <p class="sub">Performance Management and Appraisal</p>
        </div>
    
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False </button>
        </div>
    
        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
    
    <script>
        const P1_SOURCE = [
            // --- Standard MCQs (1 to 45) ---
            { "q": "What is the formal definition of 'performance appraisal'?", "o": ["Evaluating an employee's current and past performance relative to his performance standards", "Calculating executive monthly payroll bonuses", "Auditing corporate tax compliance and inventory levels", "Conducting pre-employment background screening"], "a": 0, "e": "Correct answer ✓\nPerformance appraisal means evaluating an employee's current and past performance relative to their performance standards.", "type": "MCQ" },
            { "q": "What does the 3-step performance appraisal process involve?", "o": ["Setting work standards, assessing actual performance relative to standards, and providing feedback to eliminate deficiencies", "Recruiting applicants, interviewing candidates, and selecting new hires", "Analyzing jobs, designing training, and evaluating course effectiveness", "Setting pay scales, granting promotions, and issuing termination notices"], "a": 0, "e": "Correct answer ✓\nThe 3-step process involves setting work standards, assessing actual performance, and providing feedback.", "type": "MCQ" },
            { "q": "How many main reasons are cited in Chapter 7 for appraising employee performance?", "o": ["Five reasons", "Three reasons", "Ten reasons", "Two reasons"], "a": 0, "e": "Correct answer ✓\nThere are five reasons to appraise subordinates' performance.", "type": "MCQ" },
            { "q": "Which of the following is one of the five reasons to appraise performance?", "o": ["Most employers base pay, promotion, and retention decisions on employee appraisals", "To determine office electricity utility bills", "To select new company office furniture", "To schedule annual building maintenance"], "a": 0, "e": "Correct answer ✓\nEmployers base pay, promotion, and retention decisions on appraisals.", "type": "MCQ" },
            { "q": "How is 'performance management' formally defined?", "o": ["A goal-oriented and continuous way to appraise and manage employee performance by identifying, measuring, and aligning team performance with organizational goals", "A one-time annual meeting to discuss salary raises", "An automated software for tracking employee computer keystrokes", "A manual bookkeeping method for payroll distribution"], "a": 0, "e": "Correct answer ✓\nPerformance management is a goal-oriented and continuous way to appraise and manage performance, aligning it with goals.", "type": "MCQ" },
            { "q": "What does the acronym SMART stand for when defining effective employee goals?", "o": ["Specific, Measurable, Attainable, Relevant, and Timely", "Simple, Meaningful, Accountable, Rigid, and Thorough", "Systematic, Modern, Adaptive, Reliable, and Target-driven", "Structured, Managed, Active, Responsive, and Tracked"], "a": 0, "e": "Correct answer ✓\nEffective goals are SMART: Specific, Measurable, Attainable, Relevant, and Timely.", "type": "MCQ" },
            { "q": "What role does the job description play in performance appraisal?", "o": ["It should list job duties/tasks, including how critical each is and how often it is performed", "It dictates employee salary deductions", "It replaces the need for performance appraisal forms", "It measures employee personality traits"], "a": 0, "e": "Correct answer ✓\nJob descriptions list duties/tasks, criticality, and frequency.", "type": "MCQ" },
            { "q": "Who is considered the 'heart of most appraisal processes'?", "o": ["The immediate supervisor", "The human resources department", "Self-managing peers", "External customers"], "a": 0, "e": "Correct answer ✓\nAppraisals by the immediate supervisor are the heart of most appraisal processes.", "type": "MCQ" },
            { "q": "What is the primary role of the human resources department in performance appraisals?", "o": ["Serving a policy-making and advisory role, providing appraisal tools, and training supervisors", "Conducting all daily employee evaluations directly", "Deciding individual employee salary amounts unilaterally", "Handling peer evaluation chairpersons"], "a": 0, "e": "Correct answer ✓\nHR serves a policy-making and advisory role, providing tools and training supervisors.", "type": "MCQ." },
            { "q": "What occurs during a peer appraisal process?", "o": ["An employee due for appraisal chooses a chairperson who selects one supervisor and three peers to evaluate work", "Employees grade their immediate supervisors anonymously", "External consultants audit financial records", "Supervisors vote on department budgets"], "a": 0, "e": "Correct answer ✓\nIn peer appraisals, a chairperson is chosen who selects one supervisor and three peers to evaluate work.", "type": "MCQ." },
            { "q": "What immediate positive impacts were found regarding peer appraisals in research?", "o": ["Improved perception of open communication, task motivation, social loafing reduction, group viability, and satisfaction", "Elimination of all training costs", "Immediate double salary increases", "Reduction of office working hours to zero"], "a": 0, "e": "Correct answer ✓\nPeer appraisals positively impact open communication, task motivation, social loafing, group viability, and satisfaction.", "type": "MCQ." },
            { "q": "What is a 'rating committee' composed of?", "o": ["The employee's supervisor and three or four other supervisors", "Ten random peers from different departments", "External auditors and legal counsel", "Subordinates reporting to the employee"], "a": 0, "e": "Correct answer ✓\nA rating committee is usually composed of the supervisor and 3-4 other supervisors.", "type": "MCQ." },
            { "q": "What is the basic problem associated with self-ratings?", "o": ["Employees usually rate themselves higher than do their supervisors or peers", "Employees always rate themselves as completely unsatisfactory", "Self-ratings take 5 weeks to complete", "Self-ratings are illegal under labor law"], "a": 0, "e": "Correct answer ✓\nEmployees usually rate themselves higher than supervisors or peers do.", "type": "MCQ." },
            { "q": "Why do many employers have subordinates rate their managers?", "o": ["Usually for developmental rather than for pay purposes", "To determine annual manager bonuses", "To decide which managers to fire immediately", "To replace HR advisory functions"], "a": 0, "e": "Correct answer ✓\nSubordinate ratings of managers are usually for developmental rather than pay purposes.", "type": "MCQ." },
            { "q": "How does anonymity affect subordinate feedback of managers?", "o": ["Subordinates prefer anonymous responses, and those who must identify themselves tend to give inflated ratings", "Anonymous responses lead to lower ratings", "Identified responses are always completely objective", "Anonymity has zero effect on feedback"], "a": 0, "e": "Correct answer ✓\nSubordinates prefer anonymity; those who identify themselves tend to give inflated ratings.", "type": "MCQ." },
            { "q": "What is 360-degree feedback?", "o": ["Collecting performance information all around an employee from supervisors, subordinates, peers, and customers, generally for developmental purposes", "Evaluating an employee's physical rotation speed", "A 360-hour training workshop", "An audit of yearly corporate tax returns"], "a": 0, "e": "Correct answer ✓\n360-degree feedback collects multi-source performance info from supervisors, subordinates, peers, and customers.", "type": "MCQ." },
            { "q": "What is the simplest and most popular method for appraising performance?", "o": ["Graphic Rating Scale Method", "Paired Comparison Method", "Forced Distribution Method", "Management by Objectives"], "a": 0, "e": "Correct answer ✓\nThe graphic rating scale is the simplest and most popular appraisal method.", "type": "MCQ." },
            { "q": "What does a graphic rating scale list?", "o": ["Traits or performance dimensions (like teamwork) and a range of performance values (from unsatisfactory to outstanding)", "Only employee attendance hours", "Exact financial sales figures", "Departmental expense budgets"], "a": 0, "e": "Correct answer ✓\nGraphic rating scales list traits/dimensions and a range of values.", "type": "MCQ." },
            { "q": "What is the 'alternation ranking method'?", "o": ["Ranking employees from best to worst on a trait by crossing out names not known well enough", "Comparing every employee with every other employee in pairs", "Grading employees on a forced bell curve", "Writing narrative paragraphs about past performance"], "a": 0, "e": "Correct answer ✓\nAlternation ranking ranks employees from best to worst on traits.", "type": "MCQ." },
            { "q": "When does the paired comparison method become unwieldy?", "o": ["When large numbers of employees are being compared", "When only two employees are compared", "When graphic scales are used", "When MBO is implemented"], "a": 0, "e": "Correct answer ✓\nPaired comparison becomes unwieldy when large numbers of employees are compared.", "type": "MCQ." },
            { "q": "What does the forced distribution method resemble?", "o": ["Grading on a curve, placing predetermined percentages of ratees into performance categories", "A random lottery drawing", "A strict seniority-based promotion list", "An unguided conversational interview"], "a": 0, "e": "Correct answer ✓\nForced distribution is similar to grading on a curve with predetermined percentages.", "type": "MCQ." },
            { "q": "What is the critical incident method?", "o": ["The supervisor keeps a log of positive and negative examples of work behavior and meets every 6 months to discuss performance", "An emergency response drill for factory fires", "A daily time-clock punch system", "An automated computer bug tracking log"], "a": 0, "e": "Correct answer ✓\nThe supervisor keeps a log of critical incidents and meets semi-annually.", "type": "MCQ." },
            { "q": "What does a Behaviorally Anchored Rating Scale (BARS) do?", "o": ["Anchors a numerical rating scale with specific illustrative examples of good or poor performance", "Measures employee body temperature and heart rate", "Ranks employees strictly by years of service", "Provides narrative summaries without numbers"], "a": 0, "e": "Correct answer ✓\nBARS anchors numerical rating scales with specific illustrative behavioral examples.", "type": "MCQ." },
            { "q": "What is Management by Objectives (MBO)?", "o": ["A comprehensive and formal organization-wide goal-setting and appraisal program where goals cascade down from strategic to tactical levels", "A daily checklist for office stationery orders", "A peer review committee meeting", "A self-rating employee questionnaire"], "a": 0, "e": "Correct answer ✓\nMBO is a comprehensive organization-wide goal-setting and appraisal program cascading goals.", "type": "MCQ." },
            { "q": "What causes unfair appraisals when performance standards are ambiguous?", "o": ["Unclear Standards", "Halo Effect", "Central Tendency", "Recency Effects"], "a": 0, "e": "Correct answer ✓\nUnclear standards result in unfair appraisals because traits and degrees of merit are ambiguous.", "type": "MCQ." },
            { "q": "What is the 'halo effect' in performance appraisals?", "o": ["The influence of a rater's general impression on ratings of specific ratee qualities", "The physical lighting of the appraisal room", "An employee's outstanding annual sales bonus", "A halo-shaped rating scale form"], "a": 0, "e": "Correct answer ✓\nHalo effect is the influence of a rater's general impression on specific trait ratings.", "type": "MCQ." },
            { "q": "What is 'central tendency'?", "o": ["Rating all employees as average and sticking to the middle of rating scales", "Ranking employees from best to worst", "Evaluating only top performers", "Using 360-degree feedback"], "a": 0, "e": "Correct answer ✓\nCentral tendency means rating all employees as average in the middle.", "type": "MCQ." },
            { "q": "What problem occurs when supervisors rate everyone either excessively high or excessively low?", "o": ["Leniency or Strictness", "Halo Effect", "Unclear Standards", "Recency Effect"], "a": 0, "e": "Correct answer ✓\nLeniency or strictness causes raters to skew ratings high or low.", "type": "MCQ." },
            { "q": "What is the 'recency effect'?", "o": ["Letting what the employee has done recently blind you to what their performance has been over the entire year", "Remembering only events that happened five years ago", "Evaluating employees based on their first day on the job", "Scoring exams using modern computer software"], "a": 0, "e": "Correct answer ✓\nRecency effect means letting recent actions blind you to yearly performance.", "type": "MCQ." },
            { "q": "What is the main solution to the recency effect?", "o": ["Accumulating critical incidents and keeping a diary all year long", "Firing employees every month", "Avoiding supervisor appraisals entirely", "Using forced distribution curves"], "a": 0, "e": "Correct answer ✓\nAccumulating critical incidents all year long solves recency effects.", "type": "MCQ." },
            { "q": "Which guideline helps managers avoid appraisal problems effectively?", "o": ["Knowing and understanding potential appraisal problems, using the right tool, and keeping a diary", "Ignoring employee feedback and relying on intuition", "Conducting appraisals once every ten years", "Eliminating all performance standards"], "a": 0, "e": "Correct answer ✓\nKnowing problems, using right tools, and keeping diaries are core guidelines.", "type": "MCQ." },
            { "q": "What should be the ultimate aim of a performance appraisal according to effective guidelines?", "o": ["To improve unsatisfactory performance", "To humiliate underperforming staff", "To justify lowering departmental budgets", "To increase paperwork volume"], "a": 0, "e": "Correct answer ✓\nThe aim of appraisal should be to improve unsatisfactory performance.", "type": "MCQ." },
            { "q": "How does performance management differ from a once-a-year performance appraisal?", "o": ["Performance management means continuous, daily, or weekly interactions and feedback ensuring continuous improvement", "Performance management is done exclusively by external auditors", "Performance management involves zero employee interaction", "Performance management only applies to factory machinery"], "a": 0, "e": "Correct answer ✓\nPerformance management involves continuous daily/weekly interactions and feedback.", "type": "MCQ." },
            { "q": "What are the six basic elements summarizing performance management?", "o": ["Direction sharing, goal alignment, ongoing monitoring, ongoing feedback, coaching/developmental support, and recognition/rewards", "Planning, recruiting, selecting, training, appraising, and paying", "Analysis, Design, Develop, Implement, Evaluate", "Unclear standards, halo, leniency, central tendency, recency, bias"], "a": 0, "e": "Correct answer ✓\nThe six elements are direction sharing, goal alignment, monitoring, feedback, coaching, and recognition/rewards.", "type": "MCQ." },
            { "q": "What does 'direction sharing' mean in performance management?", "o": ["Communicating company goals throughout the firm and translating them into doable departmental and individual goals", "Giving driving directions to the company headquarters", "Sharing office computer passwords among staff", "Assigning office desks to new employees"], "a": 0, "e": "Correct answer ✓\nDirection sharing means communicating company goals and translating them into doable goals.", "type": "MCQ." },
            { "q": "What does 'goal alignment' enable managers and employees to see?", "o": ["The link between the employees' goals and those of their department and company", "Exact employee salary figures", "Upcoming office holiday schedules", "Competitor stock market prices"], "a": 0, "e": "Correct answer ✓\nGoal alignment enables seeing the link between employee, departmental, and company goals.", "type": "MCQ." },
            { "q": "What role do recognition and rewards play in performance management?", "o": ["They provide the consequences needed to keep goal-directed performance on track", "They replace the need for performance appraisals entirely", "They fund annual office holiday parties", "They dictate employee tax withholding rates"], "a": 0, "e": "Correct answer ✓\nRecognition and rewards provide consequences to keep performance on track.", "type": "MCQ." },
            { "q": "In forced distribution, what percentage of workers are typically categorized as excellent effective workers?", "o": ["20 percent (or similar high tier)", "50 percent", "99 percent", "Zero percent"], "a": 0, "e": "Correct answer ✓\n'Excellent' workers represent the most effective workers (around 20%).", "type": "MCQ." },
            { "q": "What percentage of workers form the vast majority in the forced distribution method?", "o": ["70 percent (good)", "10 percent", "50 percent", "5 percent"], "a": 0, "e": "Correct answer ✓\n'Good' represents the vast majority (around 70%).", "type": "MCQ." },
            { "q": "What percentage of ratees are categorized as poor in forced distribution models?", "o": ["10 percent (those who can be fired)", "50 percent", "90 percent", "Zero percent"], "a": 0, "e": "Correct answer ✓\n'Poor' represents those who can be fired (around 10%).", "type": "MCQ." },

            // --- High-Level MCQs (41 to 50) ---
            { "q": "[HIGH-LEVEL] 41. A supervisor evaluates an employee's entire annual performance based solely on a major mistake made during the final week of the year, ignoring 51 weeks of stellar performance. What appraisal error has occurred?", "o": ["Recency Effect", "Halo Effect", "Central Tendency", "Leniency Error"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nLetting recent actions blind you to yearly performance is the recency effect.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 42. An appraiser likes an employee because they share the same hometown hobby, and consequently rates that employee 'Outstanding' across all unrelated performance dimensions (teamwork, punctuality, quality). What appraisal problem is this?", "o": ["Halo Effect", "Recency Effect", "Forced Distribution", "Central Tendency"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nThe halo effect is the influence of a rater's general impression on specific trait ratings.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 43. A lazy supervisor wants to avoid conflict and paperwork, so they rate every single employee in the department as exactly 'Average' (3 out of 5) without differentiating high and low performers. What rating error has been committed?", "o": ["Central Tendency", "Strictness", "Critical Incident failure", "Alternation ranking"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nCentral tendency means rating all employees average and sticking to the middle.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 44. Why do self-ratings consistently pose a challenge in multi-source appraisal systems?", "o": ["Because employees usually rate themselves significantly higher than do their supervisors or peers", "Because employees refuse to complete rating forms", "Because self-ratings are legally prohibited", "Because employees lack access to job descriptions"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nThe basic problem with self-ratings is that employees usually rate themselves higher than supervisors or peers do.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 45. How does information technology enhance modern performance management systems beyond traditional annual appraisals?", "o": ["By enabling automated tracking of employee performance and immediate corrective action through continuous IT integration", "By eliminating all human managers from the organization", "By replacing employee salaries with digital cryptocurrency", "By preventing any feedback from being communicated"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nIT helps managers automatically track employee performance and take immediate corrective action.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 46. If a company implements 360-degree feedback for determining annual merit pay raises rather than employee development, what negative consequence is likely to result?", "o": ["Raters may give inflated or politically motivated scores to protect peers or avoid conflict when financial stakes are involved", "The software program will immediately crash", "All employees will quit on day one", "Job descriptions will become obsolete"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\n360-degree feedback is generally recommended for developmental rather than pay purposes to avoid political rating inflation.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 47. In a paired comparison evaluation involving 5 subordinates (A, B, C, D, E) for a single trait, how many total pairwise comparisons must the supervisor perform?", "o": ["10 comparisons [n*(n-1)/2 = 5*4/2 = 10]", "5 comparisons", "25 comparisons", "2 comparisons"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nPaired comparison compares every subordinate with every other subordinate, resulting in 10 pairs for 5 employees.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 48. What is the key advantage of using a rating committee composed of 3 or 4 supervisors plus the immediate supervisor?", "o": ["It helps cancel out individual rater biases and incorporates different perspectives of employee performance", "It reduces evaluation time to 2 minutes", "It eliminates the need for job descriptions", "It ensures all employees receive identical pay increases"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nMultiple raters help cancel out individual bias and capture different sides of performance.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 49. Why is keeping a critical incident diary throughout the year considered a superior management practice?", "o": ["It prevents recency bias by providing concrete behavioral logs for semi-annual or annual appraisal discussions", "It automatically calculates employee tax returns", "It replaces the need for performance standards", "It eliminates all employee grievances"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nKeeping a diary of critical incidents prevents recency bias by recording behaviors year-round.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 50. How do Behaviorally Anchored Rating Scales (BARS) overcome the ambiguity of traditional graphic rating scales?", "o": ["By replacing abstract adjectives (good/bad) with specific behavioral examples corresponding to numerical performance levels", "By eliminating numerical scores entirely", "By making appraisals completely optional", "By delegating ratings exclusively to customers"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nBARS anchors numerical scales with specific illustrative examples of good or poor behavior, removing ambiguity.", "type": "MCQ." }
        ];

        const P2_SOURCE = [
            // --- Standard TFs (1 to 45) ---
            { "q": "1. Performance appraisal means evaluating an employee's current and past performance relative to performance standards.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: This is the formal definition of performance appraisal.", "type": "TF" },
            { "q": "2. Effective appraisal requires setting work standards, assessing actual performance, and providing feedback.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: These constitute the 3-step appraisal process.", "type": "TF" },
            { "q": "3. Most employers base pay, promotion, and retention decisions on employee appraisals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appraisals drive pay, promotion, and retention decisions.", "type": "TF" },
            { "q": "4. Performance management is a goal-oriented and continuous way to appraise and manage performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Performance management is continuous and goal-oriented.", "type": "TF" },
            { "q": "5. Effective goals are SMART: Specific, Measurable, Attainable, Relevant, and Timely.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: SMART goals meet these exact criteria.", "type": "TF" },
            { "q": "6. Job descriptions should list duties, how critical each is, and how often it is performed.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Job descriptions detail duties, criticality, and frequency.", "type": "TF" },
            { "q": "7. Immediate supervisors are in the best position to observe and evaluate subordinate performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Supervisors are the heart of the appraisal process.", "type": "TF" },
            { "q": "8. The human resources department is responsible for executing daily employee appraisals directly.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: HR serves an advisory role, provides tools, and trains supervisors, leaving operations to managers.", "type": "TF" },
            { "q": "9. Peer appraisals can improve open communication, task motivation, and group viability.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Research shows peer appraisals have positive impacts on these areas.", "type": "TF" },
            { "q": "10. A rating committee is usually composed of the employee's supervisor and three or four other supervisors.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Rating committees include the supervisor and 3-4 others.", "type": "TF" },
            { "q": "11. Using multiple raters in a committee helps cancel out individual rater biases.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Multiple raters cancel out individual bias.", "type": "TF" },
            { "q": "12. Employees usually rate themselves lower than do their supervisors or peers.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Employees usually rate themselves higher than supervisors or peers do.", "type": "TF" },
            { "q": "13. Subordinates rating their managers are usually done for developmental rather than pay purposes.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Upward feedback is typically developmental.", "type": "TF" },
            { "q": "14. Subordinates forced to identify themselves when rating managers tend to give inflated ratings.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Identified subordinates tend to give inflated ratings.", "type": "TF" },
            { "q": "15. 360-degree feedback collects performance data from supervisors, subordinates, peers, and customers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: 360-degree feedback gathers multi-source input.", "type": "TF" },
            { "q": "16. The graphic rating scale is the simplest and most popular method for appraising performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Graphic rating scales are the simplest and most popular.", "type": "TF" },
            { "q": "17. The alternation ranking method involves ranking employees from best to worst on traits.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Alternation ranking orders employees from best to worst.", "type": "TF" },
            { "q": "18. The paired comparison method compares every subordinate with every other subordinate for every trait.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Paired comparison compares every employee pair.", "type": "TF" },
            { "q": "19. The forced distribution method places predetermined percentages of ratees into performance categories, like grading on a curve.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Forced distribution uses predetermined percentages.", "type": "TF" },
            { "q": "20. The critical incident method involves supervisors keeping a log of positive and negative examples of work behavior.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Supervisors log critical incidents for semi-annual reviews.", "type": "TF" },
            { "q": "21. A Behaviorally Anchored Rating Scale (BARS) anchors numerical ratings with specific illustrative examples of good or poor performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: BARS uses behavioral examples to anchor ratings.", "type": "TF" },
            { "q": "22. Management by Objectives (MBO) refers to a comprehensive organization-wide goal-setting and appraisal program.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: MBO is a comprehensive goal-setting program.", "type": "TF" },
            { "q": "23. Unclear standards result in unfair appraisals because traits and degrees of merit are ambiguous.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Ambiguous standards cause unfair appraisals.", "type": "TF" },
            { "q": "24. The halo effect occurs when a rater's general impression influences ratings of specific ratee qualities.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Halo effect links general impressions to specific traits.", "type": "TF" },
            { "q": "25. Central tendency means rating all employees as average and sticking to the middle of rating scales.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Central tendency rates everyone average.", "type": "TF" },
            { "q": "26. Leniency or strictness problems are especially severe with graphic rating scales.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Graphic rating scales are prone to leniency/strictness skew.", "type": "TF" },
            { "q": "27. The recency effect means letting recent actions blind you to performance over the entire year.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Recency effect focuses only on recent events.", "type": "TF" },
            { "q": "28. Keeping a diary of critical incidents all year long helps solve the recency effect.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Year-round critical incident logs prevent recency bias.", "type": "TF" },
            { "q": "29. The ultimate aim of a performance appraisal should be to improve unsatisfactory performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Improving performance is the primary appraisal aim.", "type": "TF" },
            { "q": "30. Performance management means meeting with subordinates once or twice a year without daily interactions.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Performance management means continuous, daily, or weekly interactions and feedback.", "type": "TF" },
            { "q": "31. Direction sharing means communicating company goals throughout the firm and translating them into doable goals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Direction sharing translates company goals into departmental/individual goals.", "type": "TF" },
            { "q": "32. Goal alignment enables managers and employees to see the link between employee goals and company goals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Goal alignment links employee goals to company objectives.", "type": "TF" },
            { "q": "33. Ongoing performance monitoring in modern systems uses computerized systems to measure and email progress reports.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Computerized systems track and email progress reports.", "type": "TF" },
            { "q": "34. Recognition and rewards provide the consequences needed to keep goal-directed performance on track.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Recognition and rewards keep performance on track.", "type": "TF" },
            { "q": "35. Performance appraisals play a central role in an employer's performance management process.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appraisals are central to performance management.", "type": "TF" },
            { "q": "36. Supervisors use appraisals to identify employee training and development needs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appraisals identify training and development needs.", "type": "TF" },
            { "q": "37. The paired comparison method remains extremely efficient and easy when comparing thousands of employees.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Paired comparison becomes unwieldy when large numbers are being compared.", "type": "TF" },
            { "q": "38. In forced distribution, approximately 70 percent of employees fall into the 'good' or vast majority category.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: The vast majority (70%) are rated 'good'.", "type": "TF" },
            { "q": "39. Narrative forms involve supervisors assessing past performance and required areas of improvement in written paragraphs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Narrative forms assess past performance and improvements in writing.", "type": "TF" },
            { "q": "40. MBO programs restrict goal-setting exclusively to top executives without cascading down to departments.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: MBO goals cascade down by level and department from strategic to tactical goals.", "type": "TF" },
            { "q": "41. Subordinates generally prefer giving anonymous feedback when rating their managers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Subordinates prefer giving anonymous responses.", "type": "TF" },
            { "q": "42. 360-degree feedback data is typically collected solely for termination decisions rather than employee development.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: 360-degree feedback is generally used for developmental rather than pay purposes.", "type": "TF" },
            { "q": "43. Web-based systems can help reduce administrative costs associated with collecting multi-source feedback.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Web-based systems reduce administrative feedback costs.", "type": "TF" },
            { "q": "44. Effective performance management systems increasingly use information technology to track employee performance automatically.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: IT automatically tracks performance and supports corrective action.", "type": "TF" },
            { "q": "45. Coaching and developmental support should be an integral part of the ongoing feedback process.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Coaching and development are integral to feedback.", "type": "TF" },

            // --- High-Level TFs (46 to 50) ---
            { "q": "[HIGH-LEVEL] 46. Forcing supervisors to rank employees using alternation or paired comparison methods eliminates the central tendency and leniency/strictness problems found in graphic rating scales.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Ranking methods force differentiation among employees, preventing central tendency and leniency errors.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. If an employee's appraisal is legally challenged for discrimination, having clear, job-related standards and documented critical incident diaries provides vital legal defense for the employer.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Documented standards and critical incidents ensure fairness and defensibility against legal challenges.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. In 360-degree feedback systems, anchoring rating dimensions and training raters are unnecessary administrative formalities.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Anchoring dimensions and training feedback givers/receivers are crucial guidelines to ensure productive, unbiased appraisals.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. Performance management is strictly an annual paperwork ritual completed by HR without requiring ongoing daily interactions or manager involvement.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Performance management requires continuous, daily, or weekly interactions and feedback.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. In MBO programs, tactical day-to-day goals established at lower levels operate independently and have no connection to company-wide strategic goals.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: MBO goals cascade down from company-wide strategic goals to tactical goals, ensuring complete alignment.", "type": "TF" }
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
