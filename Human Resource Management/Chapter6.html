<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HRM — Chapter 6</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>
<body>
   in>
    <div class="header-panel">
        <h1>Human Resource Management — Chapter 6 </h1>
        <p class="sub">Training and Developing Employees</p>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice </button>
        <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False </button>
    </div>

    <div class="bar"><i id="bar"></i></div>
    <div class="meta">
        <span id="n"></span>
        <span id="s"></span>
    </div>
    <div class="card" id="card"></div>
</main>

<script>
    const P1_SOURCE = [
        // --- Standard MCQs (1 to 45) ---
        { "q": "What is the primary purpose of employee orientation / onboarding?", "o": ["To provide new employees with information to function ideally and help them get emotionally attached to the firm", "To conduct performance appraisals for retiring executives", "To audit company tax returns and financial accounts", "To test physical athletic endurance"], "a": 0, "e": "Correct answer ✓\nOrientation provides new information for ideal functioning and emotional attachment.", "type": "MCQ" },
        { "q": "Which of the following is NOT one of the four main things you want to accomplish by orienting new employees?", "o": ["Make the employee feel welcome, ensure basic info, help understand organization, and start socialization into firm culture", "Force the employee to sign a lifetime non-compete waiver on day one", "Make the new employee feel welcome and part of the team", "Ensure the employee has basic info like email access and personnel policies"], "a": 1, "e": "Correct answer ✓\nThe four goals are making them feel welcome, ensuring basic info, understanding the organization, and socialization into culture.", "type": "MCQ" },
        { "q": "In firms like Toyota Motor USA, how long can onboarding-type orientations take?", "o": ["Up to a week", "Exactly 5 minutes", "One full year", "Zero days"], "a": 0, "e": "Correct answer ✓\nAt Toyota Motor USA, onboarding orientations take up to a week.", "type": "MCQ" },
        { "q": "What legal liability can be triggered by inadequate training?", "o": ["Negligent training liability", "Criminal tax evasion", "Corporate bankruptcy", "Product copyright infringement"], "a": 0, "e": "Correct answer ✓\nInadequate training can trigger negligent training liability.", "type": "MCQ" },
        { "q": "What does training mean in the context of Chapter 6?", "o": ["Giving new or current employees the skills that they need to perform their jobs", "Evaluating executive quarterly bonuses", "Firing underperforming staff members", "Managing office real estate leases"], "a": 0, "e": "Correct answer ✓\nTraining means giving new or current employees the skills they need to perform their jobs.", "type": "MCQ" },
        { "q": "What is the gold standard training process model known as ADDIE an acronym for?", "o": ["Analysis, Design, Develop, Implement, Evaluate", "Audit, Direct, Deploy, Inspect, Expand", "Appraise, Define, Document, Instruct, Examine", "Assess, Delegate, Deliver, Integrate, Execute"], "a": 0, "e": "Correct answer ✓\nADDIE stands for Analysis-Design-Develop-Implement-Evaluate.", "type": "MCQ" },
        { "q": "Which step in the ADDIE model involves actually assembling or creating the training content and materials?", "o": ["Develop", "Analyze", "Design", "Implement"], "a": 0, "e": "Correct answer ✓\nProgram development means assembling/creating the training content and materials.", "type": "MCQ" },
        { "q": "What does strategic training needs analysis focus on?", "o": ["Identifying the training that employees will need to fill future new jobs, tied to succession planning", "Fixing immediate daily machine breakdowns", "Checking employee attendance registers", "Calculating monthly payroll deductions"], "a": 0, "e": "Correct answer ✓\nStrategic training needs analysis focuses on training needed for future new jobs and succession planning.", "type": "MCQ" },
        { "q": "What tool do managers use to identify new employees' training needs?", "o": ["Task analysis", "Performance analysis", "Financial balance sheets", "Exit interview questionnaires"], "a": 0, "e": "Correct answer ✓\nManagers use task analysis to identify new employees' training needs.", "type": "MCQ." },
        { "q": "What tool do managers use to identify current employees' training needs?", "o": ["Performance analysis", "Task analysis", "Stock market charts", "Architectural blueprints"], "a": 0, "e": "Correct answer ✓\nManagers use performance analysis to identify current employees' training needs.", "type": "MCQ." },
        { "q": "What are essential reference points when conducting a task analysis?", "o": ["Job descriptions and job specifications", "Employee birth certificates", "Company profit margins", "Office cafeteria menus"], "a": 0, "e": "Correct answer ✓\nJob descriptions and job specifications are essential for task analysis.", "type": "MCQ." },
        { "q": "What is 'performance analysis' in training needs assessment?", "o": ["The process of verifying a performance deficiency and determining if training is the solution", "The process of buying new computer hardware", "The process of auditing corporate tax returns", "The process of interviewing job applicants"], "a": 0, "e": "Correct answer ✓\nPerformance analysis verifies performance deficiencies and determines if training is the correct solution.", "type": "MCQ." },
        { "q": "Which of the following methods can be used to identify how a current employee's performance is doing?", "o": ["Performance appraisals, job-related data, supervisor observations, and attitude surveys", "Checking local weather forecasts", "Inspecting parking lot cleanliness", "Counting office coffee mugs"], "a": 0, "e": "Correct answer ✓\nAppraisals, performance data, observations, interviews, attitude surveys, and software identify performance levels.", "type": "MCQ." },
        { "q": "What does designing the training program involve?", "o": ["Planning overall training objectives, delivery methods, training outline, budget, and program evaluation", "Actually printing textbooks and recording videos", "Conducting final evaluations after training ends", "Firing uncooperative trainees"], "a": 0, "e": "Correct answer ✓\nDesign means planning training objectives, delivery methods, outlines, budgets, and evaluation.", "type": "MCQ." },
        { "q": "What does implementing training programs mean?", "o": ["Actually doing the training using methods like on-the-job or online training", "Planning the training budget on paper", "Writing job descriptions", "Conducting strategic succession planning"], "a": 0, "e": "Correct answer ✓\nImplementing means actually conducting the training using chosen methods.", "type": "MCQ." },
        { "q": "What is On-the-Job Training (OJT)?", "o": ["Having a person learn a job by actually doing it", "Attending a 4-year university degree program", "Reading books at home without supervision", "Watching television commercials"], "a": 0, "e": "Correct answer ✓\nOJT means learning a job by actually doing it.", "type": "MCQ." },
        { "q": "Which OJT method involves an experienced worker or supervisor training an employee step-by-step?", "o": ["Coaching or understudy method", "Vestibule training", "Computer-based simulation", "Mobile learning"], "a": 0, "e": "Correct answer ✓\nCoaching or understudy involves supervisors or experts showing employees the ropes step-by-step.", "type": "MCQ." },
        { "q": "What is apprenticeship training?", "o": ["A process by which people become skilled workers through a combination of formal learning and long-term OJT", "A 5-minute online quiz", "An informal chat during lunch break", "A lecture on company history"], "a": 0, "e": "Correct answer ✓\nApprenticeship combines formal learning and long-term OJT.", "type": "MCQ." },
        { "q": "What is Job Instruction Training (JIT)?", "o": ["Training for jobs consisting of a sequence of steps best learned step-by-step, showing what to do and how/why", "An automated software bug tracking tool", "A physical fitness workout regimen", "An executive salary negotiation seminar"], "a": 0, "e": "Correct answer ✓\nJIT breaks sequential jobs into steps showing what to do and how/why.", "type": "MCQ." },
        { "q": "What are the three parts of Programmed Learning?", "o": ["Presenting questions/problems, allowing response, and providing immediate feedback", "Lecture, group discussion, and written exam", "Video screening, audio recording, and peer review", "Coding, testing, and debugging"], "a": 0, "e": "Correct answer ✓\nProgrammed learning involves presenting problems, getting responses, and providing feedback.", "type": "MCQ." },
        { "q": "Why is programmed learning beneficial?", "o": ["It reduces training time, lets trainees learn at their own pace, gives immediate feedback, and reduces error risk", "It requires 50 trainers present in the room", "It eliminates all computer usage", "It is legally mandatory for all firms"], "a": 0, "e": "Correct answer ✓\nProgrammed learning reduces time, allows self-pacing, gives feedback, and reduces errors.", "type": "MCQ." },
        { "q": "What is 'Vestibule Training'?", "o": ["Training where employees learn on actual or simulated equipment off the job because it is too costly or dangerous on the job", "Training conducted inside elevators", "Training held exclusively on mobile smartphones", "Training delivered via corporate radio broadcasts"], "a": 0, "e": "Correct answer ✓\nVestibule training uses actual/simulated equipment off the job due to cost or danger.", "type": "MCQ." },
        { "q": "What are Electronic Performance Support Systems (EPSS)?", "o": ["Computerized tools and displays that automate training, documentation, and phone support", "Manual paper filing cabinets", "Physical office furniture assemblies", "Employee health insurance plans"], "a": 0, "e": "Correct answer ✓\nEPSS are computerized tools automating training, documentation, and support.", "type": "MCQ." },
        { "q": "What is mobile learning (or on-demand learning)?", "o": ["Delivering learning content on demand via mobile devices like cell phones and iPads whenever the learner desires", "Driving a car while attending a seminar", "Moving office computers to a new building", "Attending physical evening classes"], "a": 0, "e": "Correct answer ✓\nMobile learning delivers content on demand via mobile devices anywhere and anytime.", "type": "MCQ." },
        { "q": "What is succession planning?", "o": ["Identifying training and development needed to fill a firm's key positions and formulating plans for high-potential employees", "Planning retirement parties for senior managers", "Scheduling annual office carpet cleaning", "Ordering stationary supplies for next month"], "a": 0, "e": "Correct answer ✓\nSuccession planning identifies training needed to fill key positions and formulates development plans.", "type": "MCQ." },
        { "q": "Which HR specialist duty is typically part of employee orientation?", "o": ["Explaining working hours, benefits, vacations, introducing supervisor, and reducing jitters", "Firing employees who fail performance reviews", "Negotiating corporate bank loans", "Designing factory machinery"], "a": 0, "e": "Correct answer ✓\nHR specialists explain matters, introduce supervisors, reduce jitters, and tour facilities.", "type": "MCQ." },
        { "q": "What is talent management?", "o": ["The goal-oriented and integrated process of planning, recruiting, selecting, developing, and compensating employees", "Managing the company cafeteria food budget", "Maintaining office air conditioning units", "Filing tax returns"], "a": 0, "e": "Correct answer ✓\nTalent management is the integrated process of planning, recruiting, selecting, developing, and compensating.", "type": "MCQ." },
        { "q": "How does talent management link training with other HR functions?", "o": ["By using the same competency profile/model for recruiting, selecting, training, appraising, and paying employees", "By ensuring all employees get paid identical salaries", "By eliminating all performance appraisals", "By banning external recruitment"], "a": 0, "e": "Correct answer ✓\nUsing consistent competency models across recruiting, selecting, training, appraising, and paying links HR functions.", "type": "MCQ." },
        { "q": "What is the first step in performance analysis?", "o": ["Comparing actual performance to what it should be to confirm a deficiency and identify its cause", "Immediately firing the employee", "Doubling the employee's salary", "Ordering new office computers"], "a": 0, "e": "Correct answer ✓\nComparing actual performance to standards confirms deficiencies and identifies causes.", "type": "MCQ." },
        { "q": "What training method is quick and simple for presenting knowledge to large groups of trainees?", "o": ["Lecture", "Vestibule training", "Apprenticeship", "Coaching"], "a": 0, "e": "Correct answer ✓\nLectures quickly present knowledge to large groups.", "type": "MCQ." },
        { "q": "Which method delivers training programs via compressed audio and video signals over broadband, internet, or satellite for geographically dispersed staff?", "o": ["Videoconferencing", "Manual paper mail", "Face-to-face coaching", "Vestibule training"], "a": 0, "e": "Correct answer ✓\nVideoconferencing delivers programs for geographic training via audio/video signals.", "type": "MCQ." },
        { "q": "What do computer-based training methods use to increase knowledge or skills?", "o": ["Interactive computer-based systems", "Manual paper textbooks only", "Physical assembly tools", "Audio cassette tapes"], "a": 0, "e": "Correct answer ✓\nComputer-based training uses interactive computer systems.", "type": "MCQ." },
        { "q": "Why is job analysis essential for task analysis?", "o": ["Because job descriptions and specifications list specific duties and skills required for training reference", "Because it determines executive bonuses", "Because it sets company tax rates", "Because it manages office security"], "a": 0, "e": "Correct answer ✓\nJob descriptions and specifications list duties and skills required for training reference.", "type": "MCQ." },
        { "q": "What does program development entail regarding materials?", "o": ["Assembling and creating training content, iPads, workbooks, PowerPoint slides, and manuals", "Evaluating quarterly financial performance", "Conducting exit interviews", "Reviewing corporate legal contracts"], "a": 0, "e": "Correct answer ✓\nDevelopment involves assembling content and materials like workbooks, slides, and manuals.", "type": "MCQ." },
        { "q": "What is informal learning on the job?", "o": ["What employees learn informally through daily work with colleagues", "Mandatory weekly corporate lectures", "Online university degree exams", "Structured apprenticeship exams"], "a": 0, "e": "Correct answer ✓\nInformal learning occurs daily on the job through colleagues.", "type": "MCQ." },
        { "q": "Which training method uses DVDs, films, PowerPoint, and audiotapes?", "o": ["Audiovisual-Based Training", "Vestibule Training", "Job Instruction Training", "Strategic Succession Planning"], "a": 0, "e": "Correct answer ✓\nAudiovisual techniques include DVDs, films, PowerPoint, and audiotapes.", "type": "MCQ." },
        { "q": "What is the primary role of evaluation in the ADDIE model?", "o": ["Evaluating the course's effectiveness", "Designing the course budget", "Recruiting new candidates", "Conducting exit interviews"], "a": 0, "e": "Correct answer ✓\nStep 5 evaluates course effectiveness.", "type": "MCQ." },
        { "q": "What does a strategic training needs analysis tie training directly into?", "o": ["Succession planning and future corporate job requirements", "Daily office stationery purchases", "Immediate machinery repairs", "Routine cleaning schedules"], "a": 0, "e": "Correct answer ✓\nStrategic analysis is tied to succession planning for future positions.", "type": "MCQ." },
        { "q": "When analyzing current employees' training needs, why is it more complex than for new employees?", "o": ["Because you must determine whether training is actually the solution or if standards/motivation are lacking", "Because current employees refuse to answer questions", "Because current employees have no job descriptions", "Because current employees work remotely"], "a": 0, "e": "Correct answer ✓\nAnalyzing current employees requires verifying if training solves the issue or if motivation/standards are the root cause.", "type": "MCQ." },
        { "q": "What does reviewing performance standards and questioning current job holders help managers uncover?", "o": ["Training needs", "Employee political affiliations", "Personal home addresses", "Bank account details"], "a": 0, "e": "Correct answer ✓\nReviewing standards and questioning holders uncovers training needs.", "type": "MCQ." },

        // --- High-Level MCQs (41 to 50) ---
        { "q": "[HIGH-LEVEL] 41. An employee's sales performance drops significantly. The manager immediately schedules expensive advanced sales training without investigating further. Upon analysis, it is discovered that sales targets were unrealistic and product pricing was uncompetitive. What training process failure occurred?", "o": ["Failure to conduct a proper performance analysis to verify whether training was actually the correct solution", "Failure to follow the ADDIE evaluation step", "Failure to provide mobile learning iPads", "Failure to conduct vestibule training"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nPerformance analysis is required to verify if training solves the deficiency or if other root causes exist.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 42. A manufacturing plant installs dangerous heavy machinery and decides to train new operators directly on the live production floor while the assembly line is running at full speed. Which training method should have been used instead for safety and cost reasons?", "o": ["Vestibule training (off-the-job training on simulated equipment)", "Informal peer learning", "Standard lecture", "Mobile on-demand learning"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nVestibule training is necessary when on-the-job training is too costly or dangerous.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 43. An HR department creates a training program without defining performance objectives, instructional outlines, or estimating a budget, jumping straight from needs analysis to printing materials. Which ADDIE phase was compromised?", "o": ["The Design phase", "The Implementation phase", "The Evaluation phase", "The Onboarding phase"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nPlanning objectives, delivery methods, outlines, and budgets define the Design phase.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 44. A firm trains employees on software systems using static textbooks without any interaction, quizzes, or feedback loops. Trainees struggle to retain information. Which training method outlined in Chapter 6 would have significantly reduced training time and error risk through immediate feedback?", "o": ["Programmed learning (step-by-step self-learning with questions, responses, and immediate feedback)", "Standard lecture", "Audiovisual audiotapes", "Vestibule training"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nProgrammed learning provides step-by-step problem-solving with immediate feedback, reducing time and errors.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 45. Why is talent management considered an integrated, goal-oriented process in relation to training?", "o": ["Because it aligns competency models across recruiting, selection, training, appraising, and paying employees toward unified goals", "Because it eliminates all performance appraisals", "Because it mandates identical job roles for all staff", "Because it relies solely on informal peer learning"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTalent management integrates recruiting, selecting, training, appraising, and paying using consistent competency models.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 46. If a newly hired employee is left entirely alone on their first day without orientation, email access, policy explanation, or supervisor introduction, what negative outcome is most likely to occur according to Chapter 6?", "o": ["Increased first-day jitters, slower time-to-productivity, and lack of emotional attachment to the firm", "Immediate termination of corporate taxes", "Automatic compliance with ISO standards", "Instant promotion to executive management"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nProper orientation reduces jitters, provides basic info, and builds attachment.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 47. An organization experiences high turnover among key senior managers. Strategic HR intervenes by mapping future leadership requirements and establishing development plans for high-potential internal candidates. What HR process is being executed?", "o": ["Succession planning tied to strategic training needs analysis", "Vestibule equipment training", "Job instruction training (JIT)", "Informal peer coaching"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nSuccession planning identifies training needed for key positions and prepares high-potential employees.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 48. When designing training materials, an instructional designer incorporates iPads, customized workbooks, PowerPoint slides, and trainer manuals. Which ADDIE step is being executed?", "o": ["Develop", "Analyze", "Implement", "Evaluate"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nAssembling content and materials like iPads, slides, and manuals is the Develop phase.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 49. A retail company needs to train 500 sales representatives across 20 countries simultaneously on new product features without incurring massive travel expenses or pulling staff off the floor for weeks. Which technology-enabled training method is most appropriate?", "o": ["Computer-based training, videoconferencing, or mobile learning", "Long-term apprenticeship", "Vestibule factory training", "Coaching understudy"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nComputer-based training, videoconferencing, and mobile learning effectively reach geographically dispersed employees.", "type": "MCQ." },
        { "q": "[HIGH-LEVEL] 50. What is the fundamental risk to an employer who assigns complex medical equipment operation to an untrained worker who subsequently injures a patient?", "o": ["Negligent training liability", "Copyright infringement", "Tax audit penalties", "Building lease termination"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nInadequate training triggers negligent training liability.", "type": "MCQ." }
    ];

    const P2_SOURCE = [
        // --- Standard TFs (1 to 45) ---
        { "q": "1. Employee orientation provides new employees with information needed to function ideally and builds emotional attachment.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Orientation provides essential information and fosters emotional attachment.", "type": "TF" },
        { "q": "2. One goal of orientation is to help new employees feel welcome and part of the team.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Making employees feel welcome is a core orientation goal.", "type": "TF" },
        { "q": "3. HR specialists typically explain basic matters like working hours, benefits, and introduce supervisors during orientation.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: HR handles basic matters, supervisor introductions, and facility tours.", "type": "TF" },
        { "q": "4. Training means giving new or current employees the skills they need to perform their jobs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: This is the formal definition of training.", "type": "TF" },
        { "q": "5. Inadequate training can trigger negligent training liability for an employer.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Inadequate training risks negligent training liability.", "type": "TF" },
        { "q": "6. The ADDIE training process model consists of five steps: Analysis, Design, Develop, Implement, Evaluate.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: ADDIE is the gold standard 5-step model.", "type": "TF" },
        { "q": "7. Strategic training needs analysis focuses on training needed to fill future new jobs and is tied to succession planning.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Strategic analysis identifies future needs via succession planning.", "type": "TF" },
        { "q": "8. Succession planning means identifying training needed to fill key positions and formulating development plans.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Succession planning prepares high-potential employees for key roles.", "type": "TF" },
        { "q": "9. Managers use task analysis to identify new employees' training needs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Task analysis identifies new employee training needs.", "type": "TF" },
        { "q": "10. Managers use performance analysis to identify current employees' training needs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Performance analysis identifies current employee training needs.", "type": "TF" },
        { "q": "11. Job descriptions and job specifications are essential reference points for task analysis.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Job descriptions and specs list specific duties and skills required.", "type": "TF" },
        { "q": "12. Performance analysis verifies whether a performance deficiency should be corrected through training or other means.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Performance analysis determines if training is the right solution.", "type": "TF" },
        { "q": "13. Comparing actual performance to what it should be is the first step in performance analysis.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Comparing actual vs. standard performance confirms deficiencies.", "type": "TF" },
        { "q": "14. Designing a training program includes setting performance objectives, creating training outlines, choosing delivery methods, and estimating budgets.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Design encompasses planning objectives, methods, outlines, and budgets.", "type": "TF" },
        { "q": "15. Program development means actually assembling and creating the training content and materials.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Development involves assembling materials like slides and workbooks.", "type": "TF" },
        { "q": "16. On-the-job training (OJT) means having a person learn a job by actually doing it.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: OJT involves learning by doing.", "type": "TF" },
        { "q": "17. The coaching or understudy method involves an experienced worker or supervisor training an employee step-by-step.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Coaching/understudy uses supervisors or experts.", "type": "TF" },
        { "q": "18. Apprenticeship training combines formal learning with long-term OJT to create skilled workers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Apprenticeships combine formal study and long-term OJT.", "type": "TF" },
        { "q": "19. Job instruction training (JIT) breaks sequential jobs into step-by-step instructions showing what to do, how, and why.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: JIT details steps, key points, and reasons.", "type": "MCQ.", "type": "TF" },
        { "q": "20. Lectures provide a quick and simple way to present knowledge to large groups of trainees.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Lectures efficiently present knowledge to large audiences.", "type": "TF" },
        { "q": "21. Programmed learning is a step-by-step self-learning method consisting of presenting problems, getting responses, and providing feedback.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Programmed learning uses questions, responses, and feedback.", "type": "TF" },
        { "q": "22. Vestibule training is conducted off the job using actual or simulated equipment when on-the-job training is too costly or dangerous.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Vestibule training takes place off-the-job on simulated equipment.", "type": "TF" },
        { "q": "23. Electronic performance support systems (EPSS) automate training, documentation, and phone support using computerized tools.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: EPSS automate training and support via computers.", "type": "TF" },
        { "q": "24. Videoconferencing delivers training programs to geographically dispersed employees via compressed audio and video signals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Videoconferencing bridges geographic gaps.", "type": "TF" },
        { "q": "25. Mobile learning allows delivering learning content on demand via cell phones and iPads whenever the learner desires.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Mobile learning provides on-demand access via mobile devices.", "type": "TF" },
        { "q": "26. Talent management involves using consistent competency models across recruiting, selecting, training, appraising, and paying employees.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Talent management integrates HR functions through consistent competency profiles.", "type": "TF" },
        { "q": "27. Analyzing current employees' training needs is simpler than analyzing new employees' training needs.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Analyzing current employees is more complex because you must determine if training is actually the solution or if motivation/standards are lacking.", "type": "TF" },
        { "q": "28. Attitude surveys and performance appraisals are valid tools used in performance analysis to identify training needs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Appraisals and attitude surveys help identify performance gaps.", "type": "TF" },
        { "q": "29. Implementing training programs means actually conducting the training using methods like OJT or online modules.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Implementation is the execution phase of training.", "type": "TF" },
        { "q": "30. Toyota Motor USA onboarding orientations can take up to a full week and include videos, lectures, and company history exercises.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Toyota's onboarding takes up to a week.", "type": "TF" },
        { "q": "31. Informal learning on the job occurs when employees perform daily tasks with colleagues.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Informal learning happens naturally through daily work.", "type": "TF" },
        { "q": "32. Audiovisual training techniques include DVDs, films, PowerPoint slides, and audiotapes.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: These are standard audiovisual training media.", "type": "TF" },
        { "q": "33. Computer-based training methods use interactive digital systems to enhance knowledge and skills.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Computer-based training is interactive and realistic.", "type": "TF" },
        { "q": "34. Programmed learning increases training time and makes it harder for trainees to learn at their own pace.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Programmed learning reduces training time and allows self-pacing.", "type": "TF" },
        { "q": "35. Strategic training needs analysis is completely disconnected from corporate succession planning.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Strategic training needs analysis is directly tied to succession planning.", "type": "TF" },
        { "q": "36. Job specifications and job descriptions are useless when conducting a task analysis.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Job descriptions and specifications are essential for task analysis.", "type": "TF" },
        { "q": "37. Performance analysis is used primarily for new employees before they start working.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Performance analysis is used for current employees, while task analysis is used for new employees.", "type": "TF" },
        { "q": "38. Designing a training program involves estimating the training program budget.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Estimating a budget is part of the training program design phase.", "type": "TF" },
        { "q": "39. Assembling training workbooks and trainer manuals occurs during the development phase of ADDIE.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Developing means creating and assembling course materials.", "type": "TF" },
        { "q": "40. On-the-job training requires trainees to learn entirely in off-the-job classrooms without touching actual equipment.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: OJT means learning a job by actually doing it on the job.", "type": "TF" },
        { "q": "41. The coaching or understudy method relies solely on textbook reading without supervisor interaction.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Coaching involves working with a supervisor or experienced expert step-by-step.", "type": "TF" },
        { "q": "42. Job instruction training breaks down tasks into sequential steps showing what to do, how, and why.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: JIT outlines steps, key points, and reasons.", "type": "TF" },
        { "q": "43. Vestibule training takes place on the live production floor while heavy machinery is operating.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Vestibule training takes place off the job on simulated equipment for safety/cost reasons.", "type": "TF" },
        { "q": "44. Mobile learning enables employees to access on-demand educational content via cell phones and iPads.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Mobile learning delivers content on demand via mobile devices.", "type": "TF" },
        { "q": "45. Evaluating the course's effectiveness is the final step in the ADDIE training process model.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Evaluation is Step 5 of ADDIE.", "type": "TF" },

        // --- High-Level TFs (46 to 50) ---
        { "q": "[HIGH-LEVEL] 46. If poor employee performance is caused by lack of motivation or unclear standards rather than lack of skills, conducting technical training will automatically solve the problem.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Performance analysis exists precisely to determine if training is the right solution; if motivation or standards are lacking, training will not fix the root cause.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 47. Negligent training liability can protect an employer from lawsuits if an untrained employee causes injury to a customer or coworker.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Inadequate training triggers negligent training liability, exposing the employer to lawsuits rather than protecting them.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 48. In the ADDIE model, developing training materials before conducting a thorough training needs analysis is considered best practice.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Analysis must precede design and development to ensure training addresses actual strategic or current performance gaps.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 49. Programmed learning decreases learning flexibility by forcing trainees to proceed at a rigid, uniform group pace without immediate feedback.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Programmed learning allows trainees to learn at their own pace and get immediate feedback.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 50. Talent management functions effectively when recruiting, training, and appraising use completely disconnected, unrelated competency models.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Talent management relies on using the same integrated competency model across recruiting, selecting, training, appraising, and paying.", "type": "TF" }
    ];

    const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

    const P1_DATA = [
        ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
        ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
    ];
    const P2_DATA = [
        ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
        ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
    ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
