<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HRM — Chapter 1: Introduction to Human Resource Management</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>

            {"q": "Recruiters search for qualified job applicants.", "o": ["True", "False"], "a": 0, "e": "True: Recruiters search for qualified job applicants.", "type": "TF"},
            {"q": "EEO coordinators investigate and resolve EEO grievances and compile EEO reports.", "o": ["True", "False"], "a": 0, "e": "True: EEO coordinators handle EEO grievances and reports.", "type": "TF"},
            {"q": "Job analysts collect and examine information about jobs to prepare job descriptions.", "o": ["True", "False"], "a": 0, "e": "True: Job analysts collect info to prepare job descriptions.", "type": "TF"},
            {"q": "Compensation managers develop compensation plans and handle employee benefits programs.", "o": ["True", "False"], "a": 0, "e": "True: Compensation managers develop plans and handle benefits.", "type": "TF"},
            {"q": "Training specialists plan, organize, and direct training activities.", "o": ["True", "False"], "a": 0, "e": "True: Training specialists plan, organize, and direct training.", "type": "TF"},
            {"q": "Labor relations specialists advise management on all aspects of union-management relations.", "o": ["True", "False"], "a": 0, "e": "True: Labor relations specialists advise management on union relations.", "type": "TF"},
            {"q": "Globalization refers to the tendency of firms to extend their sales, ownership, and manufacturing to new markets abroad.", "o": ["True", "False"], "a": 0, "e": "True: This is the exact definition of globalization in Chapter 1.", "type": "TF"},
            {"q": "Globalization means less competition and zero pressure to lower costs.", "o": ["True", "False"], "a": 1, "e": "False: Globalization means *more* competition and *more* pressure to lower costs and be world-class.", "type": "TF"},
            {"q": "For consumers, globalization brings lower prices and higher quality on products from computers to cars.", "o": ["True", "False"], "a": 0, "e": "True: Consumers benefit from lower prices and higher quality.", "type": "TF"},
            {"q": "Technology has changed almost everything we do, including recruitment via Facebook and LinkedIn.", "o": ["True", "False"], "a": 0, "e": "True: Technology changed HR applications, using Facebook and LinkedIn recruiting.", "type": "TF"},
            {"q": "High-tech jobs and service jobs are prominent examples of trends in the nature of work.", "o": ["True", "False"], "a": 0, "e": "True: High-tech jobs and service jobs represent trends in the nature of work.", "type": "TF"},
            {"q": "HR managers list critical thinking/problem-solving and IT application as skills increasing most in importance.", "o": ["True", "False"], "a": 0, "e": "True: Critical thinking and IT application are the top two skills increasing in importance.", "type": "TF"},
            {"q": "Many HR professionals call the aging workforce (retirees) the biggest demographic trend affecting employers.", "o": ["True", "False"], "a": 0, "e": "True: The aging workforce is cited as the biggest demographic trend.", "type": "TF"},
            {"q": "Nontraditional workers include employees holding multiple jobs, part-time workers, and contingent workers.", "o": ["True", "False"], "a": 0, "e": "True: Nontraditional workers hold multiple jobs, are contingent or part-time.", "type": "TF"},
            {"q": "Online professional websites like LinkedIn enable free agent professionals to promote their services.", "o": ["True", "False"], "a": 0, "e": "True: LinkedIn enables free agent professionals to promote services.", "type": "TF"},
            {"q": "Controlling involves establishing departments and delegating authority to subordinates.", "o": ["True", "False"], "a": 1, "e": "False: Establishing departments and delegating authority are part of *organizing*, not controlling.", "type": "TF"},
            {"q": "Hiring the wrong person for the job is a personnel mistake managers should actively avoid.", "o": ["True", "False"], "a": 0, "e": "True: Hiring the wrong person is a major personnel mistake to avoid.", "type": "TF"},
            {"q": "Staff authority creates a superior-subordinate order-giving relationship.", "o": ["True", "False"], "a": 1, "e": "False: *Line* authority creates the superior-subordinate relationship, whereas staff authority gives the right to advise.", "type": "TF"},
            {"q": "Controlling labor costs and protecting employee health are line manager HR duties.", "o": ["True", "False"], "a": 0, "e": "True: Controlling labor costs and protecting health are line manager duties.", "type": "TF"},
            {"q": "The HR manager's coordinative function ensures that line managers implement HR policies and practices.", "o": ["True", "False"], "a": 0, "e": "True: The coordinative function ensures line managers implement HR policies.", "type": "TF"},
            {"q": "Communicating through interviewing, counseling, and disciplining is an optional activity unrelated to HRM.", "o": ["True", "False"], "a": 1, "e": "False: Communicating (interviewing, counseling, disciplining) is a core HRM activity.", "type": "TF"},
            {"q": "Allowing a lack of training in an organization can seriously undermine department effectiveness.", "o": ["True", "False"], "a": 0, "e": "True: Lack of training undermines department effectiveness.", "type": "TF"},
            {"q": "Equal opportunity and affirmative action are topics a manager should know about.", "o": ["True", "False"], "a": 0, "e": "True: Managers should know about equal opportunity and affirmative action.", "type": "TF"},
            {"q": "Staffing is exclusively handled by external accountants rather than managers.", "o": ["True", "False"], "a": 1, "e": "False: Staffing is a core management and HRM function.", "type": "TF"},
            {"q": "Technological trends facilitate alternative work arrangements like freelance contracting.", "o": ["True", "False"], "a": 0, "e": "True: Technological trends facilitate alternative work arrangements.", "type": "TF"},
            {"q": "A manager's primary responsibility is accomplishing organizational goals by managing people.", "o": ["True", "False"], "a": 0, "e": "True: Managers accomplish goals by managing the efforts of people.", "type": "TF"},
            {"q": "Building employee commitment and training managers are part of broader HRM activities.", "o": ["True", "False"], "a": 0, "e": "True: Building employee commitment and training managers are key HRM activities.", "type": "TF"},
            {"q": "Having your company taken to court because of discriminatory actions is a desirable management outcome.", "o": ["True", "False"], "a": 1, "e": "False: Being taken to court for discrimination is a serious personnel mistake to avoid.", "type": "TF"},

            // High-Level Questions (46-50)
            {"q": "[HIGH-LEVEL] If a manager completely ignores labor safety laws, employee training, and fair compensation structures, Chapter 1 indicates they are successfully mitigating all personnel risks and maximizing organizational longevity.", "o": ["True", "False"], "a": 1, "e": "False: Ignoring safety laws, training, and fairness leads to court lawsuits, safety citations, high turnover, and undermined effectiveness, which are personnel mistakes to avoid.", "type": "TF"},
            {"q": "[HIGH-LEVEL] An entrepreneur who assumes human resource management principles apply exclusively to giant multinational corporations will miss out on the proven benefits of hiring, motivating, and developing the right people to drive small business performance.", "o": ["True", "False"], "a": 0, "e": "True: Small business managers need to learn HR practices because effective HRM ensures effective results through people regardless of company size.", "type": "TF"},
            {"q": "[HIGH-LEVEL] While globalization offers consumers lower prices and higher quality goods, it simultaneously exposes workers to heightened productivity pressures and job security concerns.", "o": ["True", "False"], "a": 0, "e": "True: Globalization brings lower prices and higher quality for consumers, but workers face working harder and perhaps less secure jobs.", "type": "TF"},
            {"q": "[HIGH-LEVEL] When an HR manager directs the staff within their own department, they are performing a coordinative function rather than a line function.", "o": ["True", "False"], "a": 1, "e": "False: Directing people in their *own* department is a *line* function, whereas coordinating HR policies across other departments is the coordinative function.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The convergence of globalization, advanced smartphone/social media technologies, and aging demographic shifts is actively transforming the nature of work toward high-tech service jobs and flexible nontraditional arrangements.", "o": ["True", "False"], "a": 0, "e": "True: Globalization, tech trends, nature of work shifts, and demographic trends collectively reshape modern employment and alternative work arrangements.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
