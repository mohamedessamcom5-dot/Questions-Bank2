<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Welcome - Question bank For BIDT Level Three</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.88);
            --text: #f8fafc;
            --muted: #a9b7cb;
            --border: rgba(148, 163, 184, 0.2);
            --blue: #3b82f6;
            --blue-light: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 20%, rgba(37, 99, 235, 0.2), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(30, 64, 175, 0.2), transparent 34%),
                var(--bg);
            font-family: "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
        }

        .login-layout {
            width: min(100%, 1000px);
            min-height: 570px;
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--surface);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(18px);
        }

        .welcome-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(32px, 6vw, 64px);
            overflow: hidden;
            background: linear-gradient(145deg, #1d4ed8 0%, #1e3a8a 52%, #172554 100%);
        }

        .welcome-panel::after {
            position: absolute;
            right: -100px;
            bottom: -150px;
            width: 390px;
            height: 390px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            box-shadow: 0 0 0 42px rgba(255, 255, 255, 0.035), 0 0 0 84px rgba(255, 255, 255, 0.025);
            content: "";
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
        }

        .welcome-copy {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 48px 0;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #bfdbfe;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .welcome-copy h1 {
            margin: 0;
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.05em;
        }

        .welcome-copy p {
            max-width: 350px;
            margin: 20px 0 0;
            color: #dbeafe;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .credit {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #bfdbfe;
            font-size: 0.9rem;
        }

        .form-panel {
            display: flex;
            align-items: center;
            padding: clamp(30px, 5vw, 58px);
        }

        .login-form {
            width: 100%;
        }

        .login-form h2 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -0.03em;
        }

        .form-intro {
            margin: 10px 0 32px;
            color: var(--muted);
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e2e8f0;
            font-size: 0.92rem;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 52px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: rgba(15, 23, 42, 0.62);
            color: var(--text);
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input::placeholder {
            color: #718096;
        }

        input:focus {
            border-color: var(--blue-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .login-button {
            width: 100%;
            min-height: 54px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(110deg, var(--blue), #2563eb);
            color: #fff;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.34);
        }

        .login-button:focus-visible {
            outline: 3px solid #bfdbfe;
            outline-offset: 3px;
        }

        .login-note {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 720px) {
            body {
                padding: 20px 14px;
            }

            .login-layout {
                max-width: 480px;
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                min-height: 300px;
                padding: 28px;
            }

            .welcome-copy {
                margin: 36px 0 22px;
            }

            .welcome-copy h1 {
                font-size: 2.65rem;
            }

            .welcome-copy p {
                margin-top: 12px;
                font-size: 0.95rem;
            }

            .credit {
                display: none;
            }

            .form-panel {
                padding: 32px 28px 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-layout">
        <section class="welcome-panel" aria-label="Welcome">
            <div class="brand">
                <img src="Logo.jpg" alt="Question Bank For BIDT Level Three Logo" aria-label="Question Bank For BIDT Level Three Logo" spellcheck="false">
            </div>
            <div class="welcome-copy">
                <p class="eyebrow">Your learning hub</p>
                <h1>Learn. Practice. Succeed.</h1>
                <p>Explore your courses and keep all your study materials in one place.</p>
            </div>
            <p class="credit">Prepared by Mohamed Essam</p>
        </section>

        <section class="form-panel" aria-labelledby="form-title">
            <form class="login-form" id="loginForm">
                <h2 id="form-title">Welcome back</h2>
                <p class="form-intro">Use your id in username and password.</p>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username"
                        inputmode="numeric" pattern="971240[0-9]{3}" maxlength="9"
                        title="Enter your id."
                        autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        inputmode="numeric" pattern="971240[0-9]{3}" maxlength="9"
                        title="Enter your id."
                        autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-button">
                    <span>Continue to Question bank</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        function validateCredentialsMatch() {
            const mismatch = usernameInput.value && passwordInput.value &&
                usernameInput.value !== passwordInput.value;
            passwordInput.setCustomValidity(
                mismatch ? "Wrong username or password." : ""
            );
        }

        usernameInput.addEventListener("input", validateCredentialsMatch);
        passwordInput.addEventListener("input", validateCredentialsMatch);

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            if (usernameInput.value !== passwordInput.value) {
                passwordInput.setCustomValidity(
                    "Wrong username or password."
                );
                passwordInput.reportValidity();
                return;
            }

            sessionStorage.setItem("questionBankAccess", "granted");
            window.location.assign("index.html");
        });
    </script>
</body>
</html>
