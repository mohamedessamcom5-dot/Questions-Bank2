<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Human Resource Management - Chapters</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #fdfeff;
            --card-bg: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #010e2b;
                --card-bg: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1;
            padding: 20px 16px 60px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-panel {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 10px solid var(--b);
            padding-bottom: 30px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            right: 0;
            top: 20px;
            background: #ffffff;
            color: #010e2b;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .back-btn:hover {
            background: #ff0303;
            transform: scale(1.05);
        }

        h1 { font-size: 3rem; margin: 0 0 8px; color: #ffffff; }
        .sub { color: var(--m); font-size: 1.1rem; margin: 0; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .chapter-card {
            background: var(--c);
            border: 1.5px solid var(--b);
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .card-inner {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            color: #ffffff;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chapter-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px -10px rgba(252, 253, 253, 0.3);
            border-color: var(--ac);
        }

        .chapter-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 10px;
            direction: ltr;
            color: #ffffff;
        }

        .btn-material {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            color: #010e2b;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
            margin: 0 auto;
            width: fit-content;
        }

        .btn-material:hover {
            background: #f2ff03;
            transform: scale(1.05);
        }
    </style>
    <link rel="stylesheet" href="site-theme.css">
</head>
