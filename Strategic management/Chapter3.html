<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Strategic Management — Chapter 3: Task Environment Analysis</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>

            {"q": "What are the five competitive forces in Porter's model?", "o": ["Threat of new entrants, Rivalry among existing firms, Threat of substitutes, Bargaining power of buyers, Bargaining power of suppliers", "Political, Economic, Sociocultural, Technological, Legal", "Strengths, Weaknesses, Opportunities, Threats", "Structure, Culture, Resources, Programs, Budgets"], "a": 0, "e": "Porter's five forces include new entrants, existing rivalry, substitutes, buyer power, and supplier power.", "type": "MCQ"},

            {"q": "Which of the following is considered a task environment stakeholder other than buyers and suppliers?", "o": ["Government, communities, media, unions, shareholders, and action groups", "Macroeconomic inflation rates and GDP", "Internal corporate payroll tax withholdings", "Physical climate patterns and wildlife"], "a": 0, "e": "Task environment stakeholders include government, communities, media, unions, shareholders, and action groups.", "type": "MCQ."},

            {"q": "Defenders focus on aggressive innovation in brand new uncharted market areas.", "o": ["True", "False"], "a": 1, "e": "False: Defenders focus on efficiency of existing operations with limited product lines; *prospectors* innovate.", "type": "TF"},
            {"q": "Reactors have a consistent strategy-structure-culture fit.", "o": ["True", "False"], "a": 1, "e": "False: Reactors lack a consistent strategy-structure fit and respond without a plan.", "type": "TF"},
            {"q": "In EFAS ratings, 5 represents outstanding performance and 1 represents poor performance.", "o": ["True", "False"], "a": 0, "e": "True: EFAS ratings use 5 for outstanding and 1 for poor.", "type": "TF"},
            {"q": "Benchmarking involves searching for best practices among competitors and non-competitors.", "o": ["True", "False"], "a": 0, "e": "True: Benchmarking searches for best practices among competitors and non-competitors.", "type": "TF"},
            {"q": "High exit barriers can trap a firm in an industry even during low profits.", "o": ["True", "False"], "a": 0, "e": "True: High exit barriers (specialized assets) keep firms in the industry.", "type": "TF"},
            {"q": "Maytag's EFAS total weighted score of 3.15 is slightly above average.", "o": ["True", "False"], "a": 0, "e": "True: Maytag's score of 3.15 is slightly above the 3.0 average.", "type": "TF"},
            {"q": "Competitive intelligence is an illegal and unethical process of industrial spying.", "o": ["True", "False"], "a": 1, "e": "False: Competitive intelligence is the *legal and ethical* process of collecting market info.", "type": "TF"},
            {"q": "Economies of scale act as an entry barrier by lowering unit costs through high production volume.", "o": ["True", "False"], "a": 0, "e": "True: Economies of scale lower unit cost, deterring new entrants.", "type": "TF"},
            {"q": "Supplier power peaks when few companies dominate and products are unique.", "o": ["True", "False"], "a": 0, "e": "True: Supplier power peaks when few firms dominate and products are unique.", "type": "TF"},
            {"q": "Task environment stakeholders include shareholders, employees, government, customers, suppliers, and unions.", "o": ["True", "False"], "a": 0, "e": "True: Task elements include shareholders, employees, government, customers, suppliers, unions, and media.", "type": "TF"},
            {"q": "Xerox benchmarking L.L.Bean's warehousing is a classic example of benchmarking.", "o": ["True", "False"], "a": 0, "e": "True: Xerox benchmarking L.L.Bean warehousing is a classic case.", "type": "TF"},
            {"q": "The sum of all factor weights in an EFAS table must equal 1.0.", "o": ["True", "False"], "a": 0, "e": "True: EFAS weights must sum to 1.0.", "type": "TF"},
            {"q": "Analyzers operate a stable core while experimenting on the edges.", "o": ["True", "False"], "a": 0, "e": "True: Analyzers maintain a stable core while experimenting on product edges.", "type": "TF"},
            {"q": "Prospectors sacrifice strict operational efficiency to achieve first-mover innovation advantage.", "o": ["True", "False"], "a": 0, "e": "True: Prospectors sacrifice efficiency for innovation and first-mover advantage.", "type": "TF"},
            {"q": "High seasonal fixed costs in hotels and airlines decrease rivalry during low seasons.", "o": ["True", "False"], "a": 1, "e": "False: High fixed costs *increase* rivalry as firms cut prices to cover overhead in low seasons.", "type": "TF"},
            {"q": "Backward integration occurs when a buyer enters the supplier's industry.", "o": ["True", "False"], "a": 0, "e": "True: Backward integration is when a buyer enters the supplier business.", "type": "TF"},
            {"q": "Forward integration occurs when a supplier enters the buyer's industry.", "o": ["True", "False"], "a": 0, "e": "True: Forward integration is when a supplier enters the buyer business.", "type": "TF"},
            {"q": "Intel's microprocessors give it low supplier power over personal computer makers.", "o": ["True", "False"], "a": 1, "e": "False: Intel's chips give it *high* supplier power over PC makers.", "type": "TF"},
            {"q": "Netflix and streaming services compete as substitutes to cable television.", "o": ["True", "False"], "a": 0, "e": "True: Netflix and streaming serve as substitutes to cable TV.", "type": "TF"},
            {"q": "Searching through public dumpsters for shredded competitor documents is considered legal competitive intelligence.", "o": ["True", "False"], "a": 1, "e": "False: Searching through trash and industrial spying are illegal and unethical.", "type": "TF"},
            {"q": "Government licensing policies can restrict new entrants and act as an entry barrier.", "o": ["True", "False"], "a": 0, "e": "True: Government policy and licensing act as entry barriers.", "type": "TF"},
            {"q": "Walmart's massive size gives it high buyer power over its suppliers.", "o": ["True", "False"], "a": 0, "e": "True: Walmart's size gives it high buyer power.", "type": "TF"},
            {"q": "EFAS column 4 is calculated by multiplying column 2 (weight) by column 3 (rating).", "o": ["True", "False"], "a": 0, "e": "True: Weighted score equals weight multiplied by rating.", "type": "TF"},
            {"q": "An EFAS score of 4.2 indicates below-average corporate performance.", "o": ["True", "False"], "a": 1, "e": "False: A score of 4.2 is well above the 3.0 average, indicating strong performance.", "type": "TF"},
            {"q": "Strategic groups consist of firms pursuing completely unrelated strategies in different industries.", "o": ["True", "False"], "a": 1, "e": "False: Strategic groups consist of firms within an industry following *similar* strategies.", "type": "TF"},
            {"q": "Undifferentiated commodity products (like gasoline) intensify price rivalry among firms.", "o": ["True", "False"], "a": 0, "e": "True: Undifferentiated products intensify price wars and rivalry.", "type": "TF"},
            {"q": "Capital requirements for heavy manufacturing plants serve as an entry barrier.", "o": ["True", "False"], "a": 0, "e": "True: High capital requirements deter new entrants.", "type": "TF"},
            {"q": "Switching costs refer to the one-time costs a customer incurs switching from one supplier to another.", "o": ["True", "False"], "a": 0, "e": "True: Switching costs are the costs incurred by buyers when changing suppliers.", "type": "TF"},
            {"q": "Trade associations and special interest groups have no influence on industry competition.", "o": ["True", "False"], "a": 1, "e": "False: Trade associations and special interest groups are key task environment stakeholders influencing firms.", "type": "TF"},
            {"q": "Interviewing a competitor's former talent is a recognized method of competitive intelligence.", "o": ["True", "False"], "a": 0, "e": "True: Interviewing former talent is part of market and talent interception.", "type": "TF"},
            {"q": "The center of Porter's Five Forces diagram represents rivalry among existing firms.", "o": ["True", "False"], "a": 0, "e": "True: Rivalry among existing firms sits at the center of Porter's model.", "type": "TF"},
            {"q": "Potential entrants sit at the top of Porter's Five Forces framework.", "o": ["True", "False"], "a": 0, "e": "True: Potential entrants are at the top of Porter's diagram.", "type": "TF"},
            {"q": "Substitute products are positioned at the bottom of Porter's Five Forces framework.", "o": ["True", "False"], "a": 0, "e": "True: Substitutes are positioned at the bottom.", "type": "TF"},
            {"q": "Suppliers are located on the left side and buyers on the right side of Porter's framework.", "o": ["True", "False"], "a": 0, "e": "True: Suppliers are on the left and buyers on the right.", "type": "TF"},
            {"q": "Chapter 3 covers macro PESTEL societal trends while Chapter 2 covers micro industry forces.", "o": ["True", "False"], "a": 1, "e": "False: Chapter 2 covers macro societal PESTEL trends, whereas Chapter 3 covers micro task environment and industry analysis.", "type": "TF"},
            {"q": "EFAS analysis synthesizes macro-trends and micro-factors into a single strategic evaluation score.", "o": ["True", "False"], "a": 0, "e": "True: EFAS distills macro and micro factors into a single strategic score.", "type": "TF"},
            {"q": "Industry analysis helps management understand the competitive intensity and profit potential of their market sector.", "o": ["True", "False"], "a": 0, "e": "True: Industry analysis assesses competitive intensity and profit potential.", "type": "TF"},

            // High-Level Questions (46-50)
            {"q": "[HIGH-LEVEL] According to Chapter 3, if an industry has zero entry barriers, perfect product homogeneity, high fixed costs, and numerous equal competitors, profitability will be exceptionally high and rivalry will be non-existent.", "o": ["True", "False"], "a": 1, "e": "False: Zero entry barriers, homogeneity, high fixed costs, and many equal competitors trigger *intense rivalry* and price wars, driving industry profitability *down*.", "type": "TF"},
            {"q": "[HIGH-LEVEL] An EFAS weighted score of 3.15 achieved by Maytag indicates that the company's strategic response to external opportunities and threats is slightly above the industry average baseline of 3.0.", "o": ["True", "False"], "a": 0, "e": "True: Maytag's score of 3.15 is above the 3.0 average, demonstrating a slightly better-than-average response.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Miles & Snow's Reactors possess a highly disciplined, consistent strategy-structure-culture fit that rivals Prospectors in market innovation.", "o": ["True", "False"], "a": 1, "e": "False: Reactors *lack* a consistent strategy-structure fit and only respond to threats when forcefully compelled.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Rummaging through public dumpsters for shredded competitor files is classified under Chapter 3 as standard legal benchmarking.", "o": ["True", "False"], "a": 1, "e": "False: Rummaging through trash is illegal and unethical industrial espionage, whereas benchmarking involves copying best practices legally.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Porter's Five Forces model demonstrates that supplier power and buyer power operate in direct opposition across an industry's value chain, placing upward or downward pressure on profit margins.", "o": ["True", "False"], "a": 0, "e": "True: Supplier and buyer power exert opposing pressures on industry margins across the value chain.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
