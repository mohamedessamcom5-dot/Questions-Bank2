            color: var(--t);

            line-height: 1.6;

        main {

            margin: 0 auto;
            padding: 24px 16px 60px;

        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;

        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);

            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);

            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;

            border-radius: 8px;
            direction: ltr;
            text-align: left;

        .ex.no { background: var(--nob); border: 1px solid var(--no); }

            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }

    </style>

            {"q": "Health consciousness, population growth, and age distribution are Sociocultural forces.", "o": ["True", "False"], "a": 0, "e": "True: Health consciousness, population growth, and age distribution are sociocultural.", "type": "TF"},
            {"q": "Plastic-straw and bag bans are examples of Ecological forces.", "o": ["True", "False"], "a": 0, "e": "True: Plastic-straw and bag bans are ecological forces.", "type": "TF"},
            {"q": "The Issues Priority Matrix plots the probability of occurrence against the probable impact of trends.", "o": ["True", "False"], "a": 0, "e": "True: The matrix plots probability of occurrence versus probable impact.", "type": "TF"},
            {"q": "Trends with high probability and high impact become external strategic factors in the High-High cells.", "o": ["True", "False"], "a": 0, "e": "True: High-probability and high-impact trends become external strategic factors.", "type": "TF"},
            {"q": "A trend with low probability and low impact is classified as a high priority in the priority matrix.", "o": ["True", "False"], "a": 1, "e": "False: Low probability and low impact fall in low-priority cells.", "type": "TF"},
            {"q": "Kodak's failure to embrace digital photography is a real-world example of neglecting technological scanning.", "o": ["True", "False"], "a": 0, "e": "True: Kodak was slow to accept digital photography, illustrating technological scanning failure.", "type": "TF"},
            {"q": "Egypt floating its pound in November 2016 is an example of a societal economic force.", "o": ["True", "False"], "a": 0, "e": "True: Floating the Egyptian pound is an economic force.", "type": "TF"},
            {"q": "The EU General Data Protection Regulation (GDPR) is an example of a legal force.", "o": ["True", "False"], "a": 0, "e": "True: EU GDPR is a legal force forcing data practice changes.", "type": "TF"},
            {"q": "Societal forces affect multiple industries simultaneously rather than just one specific industry.", "o": ["True", "False"], "a": 0, "e": "True: Societal forces influence long-run decisions across multiple industries.", "type": "TF"},
            {"q": "The mass market is currently expanding rapidly while mass customization is declining.", "o": ["True", "False"], "a": 1, "e": "False: The reverse is true: mass market is declining while mass customization is rising.", "type": "TF"},
            {"q": "Rising health consciousness prompted beverage brands like Coca-Cola and Pepsi to expand zero-sugar lines.", "o": ["True", "False"], "a": 0, "e": "True: Health awareness pushed beverage brands toward zero-sugar lines.", "type": "TF"},
            {"q": "BRIC stands for Brazil, Russia, India, and China.", "o": ["True", "False"], "a": 0, "e": "True: BRIC represents Brazil, Russia, India, and China.", "type": "TF"},
            {"q": "Internal environmental variables are typically within top management's control, unlike external variables.", "o": ["True", "False"], "a": 0, "e": "True: Internal variables are within top management's control, unlike external ones.", "type": "TF"},
            {"q": "External environmental scanning identifies opportunities and threats for SWOT analysis.", "o": ["True", "False"], "a": 0, "e": "True: Scanning external environments identifies opportunities and threats.", "type": "TF"},
            {"q": "Internal environmental scanning identifies strengths and weaknesses for SWOT analysis.", "o": ["True", "False"], "a": 0, "e": "True: Internal scanning identifies strengths and weaknesses.", "type": "TF"},
            {"q": "Climate change and long-run weather patterns have zero impact on agriculture and energy industries.", "o": ["True", "False"], "a": 1, "e": "False: Climate change alters agriculture, energy, insurance, and supply-chain risk.", "type": "TF"},
            {"q": "Physical resources in the natural environment include raw materials, minerals, energy, land, and water.", "o": ["True", "False"], "a": 0, "e": "True: Physical resources include raw materials, minerals, energy sources, land, and water.", "type": "TF"},
            {"q": "Wildlife and ecosystems are vital for industries such as agriculture, medicine, and tourism.", "o": ["True", "False"], "a": 0, "e": "True: Agriculture, medicine, and tourism depend on wildlife and ecosystems.", "type": "TF"},
            {"q": "Societal environment forces shape multi-year strategic choices more than this quarter's operations.", "o": ["True", "False"], "a": 0, "e": "True: Societal forces shape multi-year strategic choices rather than short-run operations.", "type": "TF"},
            {"q": "A rise in interest rates affects retailers, manufacturers, and banks simultaneously, illustrating a societal force.", "o": ["True", "False"], "a": 0, "e": "True: Societal forces affect multiple industries at once.", "type": "TF"},
            {"q": "R&D spending by government and industry is classified as a sociocultural force.", "o": ["True", "False"], "a": 1, "e": "False: R&D spending is a *technological* force, not sociocultural.", "type": "TF"},
            {"q": "Unemployment rates and oil prices are classified as economic forces.", "o": ["True", "False"], "a": 0, "e": "True: Unemployment and oil prices are economic forces.", "type": "TF"},
            {"q": "The seniors market (people over 55) is an example of a demographic sociocultural force.", "o": ["True", "False"], "a": 0, "e": "True: The seniors market over 55 is a demographic sociocultural force.", "type": "TF"},
            {"q": "Government stability and trade regulations are part of technological forces.", "o": ["True", "False"], "a": 1, "e": "False: Government stability and trade regulations are political-legal forces.", "type": "TF"},
            {"q": "Environmental protection laws and labor laws belong to political-legal forces.", "o": ["True", "False"], "a": 0, "e": "True: Environmental and labor laws are political-legal forces.", "type": "TF"},
            {"q": "Chapter 2 focuses on analyzing the internal environment while Chapter 3 focuses on the external environment.", "o": ["True", "False"], "a": 1, "e": "False: Chapter 2 focuses on external environmental scanning (natural and societal), while Chapter 3 focuses on the task environment/industry analysis.", "type": "TF"},
            {"q": "Environmental scanning helps firms avoid strategic surprise and risk.", "o": ["True", "False"], "a": 0, "e": "True: Environmental scanning avoids strategic surprise and risk.", "type": "TF"},
            {"q": "The natural environment is considered the most basic layer of the external environment.", "o": ["True", "False"], "a": 0, "e": "True: The natural environment is the most basic layer upon which all industries depend.", "type": "TF"},
            {"q": "In the Issues Priority Matrix, probability and impact are evaluated on High, Medium, and Low scales.", "o": ["True", "False"], "a": 0, "e": "True: The matrix uses High, Medium, and Low scales for probability and impact.", "type": "TF"},
            {"q": "External strategic factors derived from PESTEL analysis are irrelevant to SWOT formulation.", "o": ["True", "False"], "a": 1, "e": "False: External strategic factors extracted from PESTEL and Porter's form the foundation of SWOT and EFAS analysis.", "type": "TF"},
            {"q": "Consumer demand for instant communication and the pace of life are sociocultural forces.", "o": ["True", "False"], "a": 0, "e": "True: Pace and location of life are sociocultural forces.", "type": "TF"},
            {"q": "Cloud computing and portable mobile devices are economic forces rather than technological forces.", "o": ["True", "False"], "a": 1, "e": "False: Cloud computing and portable devices are technological forces.", "type": "TF"},
            {"q": "Foreign trade regulations and WTO policies are political-legal forces.", "o": ["True", "False"], "a": 0, "e": "True: Trade regulations and WTO policies are political-legal forces.", "type": "TF"},
            {"q": "Strategic management requires continuous scanning of both macro-environmental trends and micro-environmental industry forces.", "o": ["True", "False"], "a": 0, "e": "True: Effective strategic management requires scanning macro societal trends and micro task forces.", "type": "TF"},

            // High-Level Questions (46-50)
            {"q": "[HIGH-LEVEL] If a management team concludes that societal environmental forces only impact single-firm short-run daily workflows, they have accurately interpreted Chapter 2 foundational definitions.", "o": ["True", "False"], "a": 1, "e": "False: Societal forces affect *multiple industries* over the *long run* rather than short-run daily workflows.", "type": "TF"},
            {"q": "[HIGH-LEVEL] According to Chapter 2, top management exercises direct operational control over external macroeconomic interest rates and global climate patterns in the short term.", "o": ["True", "False"], "a": 1, "e": "False: External variables are outside direct managerial control; organizations must monitor and adapt.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The Issues Priority Matrix categorizes trends into priority cells based on their probability of occurrence and probable impact on the corporation or industry.", "o": ["True", "False"], "a": 0, "e": "True: The matrix plots probability of occurrence against probable impact to establish priorities.", "type": "TF"},
            {"q": "[HIGH-LEVEL] PESTEL analysis treats legal regulations as entirely identical to political stability without any separate distinction.", "o": ["True", "False"], "a": 1, "e": "False: PESTEL explicitly treats Legal as a separate force distinct from Political.", "type": "TF"},
            {"q": "[HIGH-LEVEL] Environmental scanning serves as the critical initial diagnostic phase that uncovers external opportunities and threats, directly fueling SWOT analysis and strategic decision-making.", "o": ["True", "False"], "a": 0, "e": "True: Scanning external environments uncovers opportunities and threats to form SWOT and guide long-term performance.", "type": "TF"}
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = cIdx >= 45;
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
