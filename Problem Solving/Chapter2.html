<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Problem Solving and Decision Making — Chapter 2 Quiz</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q-badge.high-level {
            background: #f59e0b;
            color: #000;
            font-weight: bold;
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
</head>
<body>
  ain>
    <div class="header-panel">
        <h1>Problem Solving — Chapter 2</h1>
        <p class="sub">Understanding and Defining a Problem</p>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice</button>
        <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False</button>
    </div>

    <div class="bar"><i id="bar"></i></div>
    <div class="meta">
        <span id="n"></span>
        <span id="s"></span>
    </div>
    <div class="card" id="card"></div>
</main>

<script>
    const P1_SOURCE = [
        // --- MCQs (50 Questions) ---
        { "q": "How does Chapter 2 build upon the definition of a problem introduced in Chapter 1?", "o": ["By moving from a general gap statement to defining the problem precisely as an actionable analytical question", "By ignoring the current state and focusing only on solutions", "By assuming that all problems can be solved using static inventory formulas", "By replacing qualitative evidence with subjective managerial opinions"], "a": 0, "e": "Correct answer ✓\nChapter 2 transitions from defining a problem as a general gap to precisely defining and framing it into an actionable analytical question.", "type": "MCQ" },
        { "q": "According to Section 2.1, what makes a problem description effective rather than just an annoying statement?", "o": ["Specifying observed condition, affected group, context, time period, performance measure, and scope", "Declaring a solution immediately in the first sentence", "Relying strictly on total counts without calculating rates", "Assuming the root cause is weak marketing without evidence"], "a": 0, "e": "Correct answer ✓\nA good description specifies: observed condition, affected group, context, time period, performance measure, and scope of investigation.", "type": "MCQ" },
        { "q": "In Example 2.1, complaints grew from 1,200 (out of 100k transactions) in Jan to 1,560 (out of 120k) in June. What is the percentage increase in count vs. the complaint rate change?", "o": ["Count increased by 30%, but complaint rate rose only from 1.20% to 1.30%", "Count increased by 15%, and rate doubled from 1% to 2%", "Count fell by 10%, while rate stayed constant", "Count increased by 30%, and rate increased by 30%"], "a": 0, "e": "Correct answer ✓\nCount increase = (1560-1200)/1200 * 100 = 30%. Jan rate = 1.20%, June rate = 1.30%.", "type": "MCQ" },
        { "q": "In Example 2.2, Branch A has 100 delayed transactions out of 2,000, while Branch B has 300 delayed out of 10,000. Which branch has a higher delay rate?", "o": ["Branch A (5% vs Branch B's 3%)", "Branch B (30% vs Branch A's 10%)", "Both branches have identical delay rates", "Branch B because 300 > 100"], "a": 0, "e": "Correct answer ✓\nBranch A late rate = 100/2000 = 5%. Branch B late rate = 300/10000 = 3%. Branch A has the higher late rate.", "type": "MCQ" },
        { "q": "What determines how a problem should be handled according to Section 2.2?", "o": ["The degree of clarity of objectives, variables, constraints, and procedures", "The cost of hiring external consultant agencies", "The size of the company's IT server infrastructure", "The physical location of the company headquarters"], "a": 0, "e": "Correct answer ✓\nProblems differ in the extent to which their objectives, variables, constraints, and procedures are known.", "type": "MCQ" },
        { "q": "Which type of problem has relatively clear objectives, variables, constraints, and procedures that can be solved using rules or quantitative models?", "o": ["Structured problem", "Semi-structured problem", "Unstructured problem", "Complex qualitative crisis"], "a": 0, "e": "Correct answer ✓\nStructured problems have clear objectives, variables, constraints, and procedures.", "type": "MCQ" },
        { "q": "In Example 2.3, if average daily demand is 80 units, supplier lead time is 5 days, and safety stock is 100 units, what is the Reorder Point (ROP)?", "o": ["500 units", "400 units", "180 units", "900 units"], "a": 0, "e": "Correct answer ✓\nROP = (Average Daily Demand * Lead Time) + Safety Stock = (80 * 5) + 100 = 500 units.", "type": "MCQ" },
        { "q": "Why is a Reorder Point (ROP) calculation classified as a structured problem?", "o": ["Because the variables and the calculation rule are completely specified", "Because it requires high-level executive strategic negotiation", "Because it involves high ambiguity and uncertain lead times", "Because it relies purely on subjective employee judgment"], "a": 0, "e": "Correct answer ✓\nIt is structured because the variables and calculation rules are specified.", "type": "MCQ" },
        { "q": "What characterizes a Semi-structured problem?", "o": ["Part can be analyzed quantitatively and part requires managerial judgment and expertise", "It has no quantitative data whatsoever", "It is solved entirely by automated algorithms without human intervention", "It applies only to routine inventory reordering"], "a": 0, "e": "Correct answer ✓\nSemi-structured problems combine quantitative analysis with managerial judgment.", "type": "MCQ" },
        { "q": "In Example 2.4, Project A costs 2M with 600k annual benefit (30% ratio). Project B costs 3M with 750k benefit (25% ratio). Why might management still choose Project B?", "o": ["Because Project B may offer strategic benefits not captured by the simplified ratio", "Because Project B is strictly cheaper than Project A", "Because ratios are illegal in decision making", "Because Project A has a lower efficiency rating"], "a": 0, "e": "Correct answer ✓\nNumbers help compare options, but Project B may offer strategic benefits not reflected in the ratio, requiring judgment.", "type": "MCQ" },
        { "q": "What defines an Unstructured problem according to Section 2.2.3?", "o": ["High ambiguity, novelty, or complexity where relevant variables and solution recipes are not initially known", "Clear mathematical constraints and automated software procedures", "Low operational risk and high historical data availability", "Single-variable operational scheduling"], "a": 0, "e": "Correct answer ✓\nUnstructured problems are characterized by ambiguity, novelty, complexity, or uncertainty with no ready-made recipe.", "type": "MCQ" },
        { "q": "Which of the following is an example of an unstructured problem?", "o": ["Responding to a disruptive technology or transforming an established business model", "Calculating inventory reorder point with constant demand", "Computing first-year benefit-to-investment ratio for standard equipment", "Calculating employee complaint percentage increase"], "a": 0, "e": "Correct answer ✓\nResponding to disruptive technology or transforming a business model are unstructured problems.", "type": "MCQ" },
        { "q": "In Section 2.3, how is a 'Symptom' defined?", "o": ["An observable sign indicating that something may require attention", "A specific description of the situation requiring investigation", "An explanation that has been proven by statistical evidence", "The final solution implemented by management"], "a": 0, "e": "Correct answer ✓\nA symptom is an observable sign indicating that something may require attention.", "type": "MCQ" },
        { "q": "What is a 'Possible Cause' in the context of problem definition?", "o": ["An explanation that may contribute to the situation but is not necessarily proven", "An observable sign like a drop in sales volume", "The exact boundary of the affected population", "A mandatory reference benchmark"], "a": 0, "e": "Correct answer ✓\nA possible cause is an hypothesized explanation that requires testing and evidence before confirmation.", "type": "MCQ" },
        { "q": "In Example 2.5 (Online Orders), site visits dropped 2%, conversion fell from 4% to 3.4%, and payment failures rose from 1% to 4%. Why shouldn't an analyst immediately declare 'payment failures caused the decline'?", "o": ["Because temporal order or co-occurrence does not prove causation without analytical design and evidence", "Because payment failures have no connection to online orders", "Because site visits increased by 20%", "Because conversion rate is a symptom, not a metric"], "a": 0, "e": "Correct answer ✓\nStating payment failures caused the decline requires stronger evidence and proper analytical design.", "type": "MCQ" },
        { "q": "What elements must be established when setting the boundaries of a problem (Section 2.4.1)?", "o": ["Population, location or operational scope, and time frame", "Software budget, server brand, and CPU speed", "Executive salary brackets and stock prices", "Cafeteria seating capacity and shift hours"], "a": 0, "e": "Correct answer ✓\nBoundaries specify: Population (who/what), Location/scope (where), and Time frame (when).", "type": "MCQ" },
        { "q": "Which of the following represents a strong, precise problem statement?", "o": ["'Average customer satisfaction among digital payment users on the mobile app declined during Q2 relative to Q1.'", "'Customer satisfaction is low.'", "'Customer satisfaction declined because the mobile app interface is poorly designed.'", "'We must fire the software development team immediately.'"], "a": 0, "e": "Correct answer ✓\nIt identifies population, activity, time frame, and comparison period without assuming unproven causes.", "type": "MCQ" },
        { "q": "How is 'Absolute Change' calculated?", "o": ["Current Value - Previous Value", "[(Current Value - Previous Value) / Previous Value] * 100", "(Current Value / Previous Value) * 100", "Current Value + Safety Stock"], "a": 0, "e": "Correct answer ✓\nAbsolute change is the numerical difference: Current value - Previous value.", "type": "MCQ" },
        { "q": "If customer churn rate increases from 8% to 11%, what is the percentage-point change versus the relative percentage increase?", "o": ["3 percentage points change, and 37.5% relative increase", "3% relative increase, and 37.5 percentage points change", "11 percentage points change, and 8% relative increase", "30 percentage points change, and 3% relative increase"], "a": 0, "e": "Correct answer ✓\nPercentage-point change = 11% - 8% = 3 points. Relative increase = (3/8)*100 = 37.5%.", "type": "MCQ" },
        { "q": "What is the 'Unit of Analysis'?", "o": ["The entity about which observations are collected and conclusions are made", "The statistical formula used to calculate percentages", "The software unit running the database query", "The reference target set by executive management"], "a": 0, "e": "Correct answer ✓\nThe unit of analysis is the entity (customer, branch, product, company) under study.", "type": "MCQ" },
        { "q": "In Example 2.11, Branch A has avg satisfaction 4.5 (100 cust), Branch B has 4.1 (500 cust). Why doesn't this prove every customer in Branch A is happier than every customer in Branch B?", "o": ["Because data summarize branches as the unit of analysis, not individual customer experiences", "Because Branch B has fewer total customers", "Because satisfaction scales cannot be averaged", "Because Branch A used a 10-point scale"], "a": 0, "e": "Correct answer ✓\nThe data summarize branches rather than individual customer experiences; some Branch B customers may score higher than Branch A customers.", "type": "MCQ" },
        { "q": "Why is a reference point essential in problem definition (Section 2.4.3)?", "o": ["Because a numerical value alone does not establish whether a condition is problematic without comparison", "Because reference points automatically fix software errors", "Because reference points eliminate the need for data collection", "Because reference points prove cause-and-effect relationships"], "a": 0, "e": "Correct answer ✓\nA reference point provides a basis for comparison (target, historical, benchmark) to determine if attention is needed.", "type": "MCQ" },
        { "q": "If hospital average patient wait time is 18 minutes, is it problematic?", "o": ["It depends on the reference point (e.g., problematic if target is 15 min, acceptable if target is 20 min)", "Yes, 18 minutes is always illegal in healthcare", "No, wait times under 30 minutes are never problems", "Yes, because wait times must be exactly zero"], "a": 0, "e": "Correct answer ✓\nWhether 18 minutes is problematic depends on the applicable standard or target.", "type": "MCQ" },
        { "q": "What is the purpose of translating a business problem into an analytical question (Section 2.5)?", "o": ["To define what we need to know using evidence, rather than what we want to prove", "To select a solution before analyzing data", "To justify an executive's pre-existing opinion", "To convert quantitative data into unstructured qualitative noise"], "a": 0, "e": "Correct answer ✓\nA good question defines what we need to know, not what we want to prove.", "type": "MCQ" },
        { "q": "Which type of analytical question examines differences between groups, periods, or organizational units?", "o": ["Comparative questions", "Measurement questions", "Predictive questions", "Decision-oriented questions"], "a": 0, "e": "Correct answer ✓\nComparative questions examine differences between groups, periods, or units.", "type": "MCQ" },
        { "q": "Which type of analytical question investigates factors associated with the observed condition?", "o": ["Diagnostic questions", "Descriptive questions", "Measurement questions", "Decision-oriented questions"], "a": 0, "e": "Correct answer ✓\nDiagnostic questions investigate factors associated with the observed condition.", "type": "MCQ" },
        { "q": "What are the six criteria of an effective analytical question (Section 2.5.1)?", "o": ["Relevance, Specificity, Measurability, Feasibility, Neutrality, Decision relevance", "Speed, Low cost, Popularity, Authority, Length, Complexity", "Calculated ROP, Safety stock, Lead time, Demand, Units, Inventory", "Symptom, Condition, Cause, Solution, Action, Evaluation"], "a": 0, "e": "Correct answer ✓\nSix criteria: Relevance, Specificity, Measurability, Feasibility, Neutrality, Decision relevance.", "type": "MCQ" },
        { "q": "Why is the question 'How much does poor employee training reduce productivity?' flawed?", "o": ["It is a leading question that assumes training is poor and that it causes reduced productivity", "It lacks a numerical calculation for Reorder Point", "It uses the word productivity", "It is too short to be analytical"], "a": 0, "e": "Correct answer ✓\nIt assumes conclusions not yet supported by evidence. A neutral formulation is 'Is employee training associated with differences in productivity?'.", "type": "MCQ" },
        { "q": "What is Step 1 in the practical 6-step framework for defining a problem (Section 2.6)?", "o": ["Describe the observable condition using available observations without assigning cause", "Calculate the relative percentage increase", "Formulate a leading analytical question", "Hire additional employees to fix the issue"], "a": 0, "e": "Correct answer ✓\nStep 1: Describe the observable condition using available observations.", "type": "MCQ" },
        { "q": "In Step 4 of the 6-step framework, what is the key distinction to record?", "o": ["Separate known facts from unverified assumptions and hypotheses", "Separate total costs from net profit ratios", "Separate mobile users from desktop users", "Separate structured problems from reorder points"], "a": 0, "e": "Correct answer ✓\nStep 4: Separate facts from assumptions.", "type": "MCQ" },
        { "q": "In Example 2.14, if churn increased from 8% to 11% against a 7% target, what is the classification of 'Prices may have increased'?", "o": ["Possible explanation (hypothesis requiring testing)", "Observed condition (fact)", "Reference point standard", "Boundary limit"], "a": 0, "e": "Correct answer ✓\nPossible explanations remain hypotheses until investigated.", "type": "MCQ" },
        { "q": "What is the classification of the statement: 'Hire five additional employees' in Section 2.6.1?", "o": ["Proposed solution", "Observed condition", "Comparison with reference point", "Analytical question"], "a": 0, "e": "Correct answer ✓\n'Hire five additional employees' is a proposed solution.", "type": "MCQ" },
        { "q": "In the Quick Exercise (Section 2.6.3), if purchase completion rate fell from 62% to 54%, what is the decrease in percentage points?", "o": ["8 percentage points", "12.9%", "8%", "54%"], "a": 0, "e": "Correct answer ✓\nDecrease = 62% - 54% = 8 percentage points.", "type": "MCQ" },
        { "q": "Which of the following is a key characteristic of a strong problem statement (Section 2.7)?", "o": ["Neutral regarding unverified causes and proposed solutions", "Contains a pre-selected solution in the opening phrase", "Ignores time frames and operational scope", "Blames specific employees for performance failures"], "a": 0, "e": "Correct answer ✓\nA strong problem statement is neutral regarding unverified causes and proposed solutions.", "type": "MCQ" },
        { "q": "What is the practical structure for a comprehensive problem statement?", "o": ["Observed Condition + Magnitude + Population/Context + Time Frame + Scope + Reference Point", "Symptom + Cause + Immediate Solution + Executive Approval", "Reorder Point + Safety Stock + Lead Time + Demand", "Question + Hypothesis + Experiment + Conclusion"], "a": 0, "e": "Correct answer ✓\nStructure: Observed Condition + Magnitude + Population/Context + Time Frame + Relevant Scope + Reference Point.", "type": "MCQ" },
        { "q": "How should an analyst handle a situation where evidence is incomplete (e.g., reported turnover increase without data)?", "o": ["State what is known and identify missing information requiring verification rather than inventing figures", "Invent estimated numbers to make the problem statement look professional", "Assume the worst-case scenario and implement immediate layoffs", "Ignore the concern completely until next year"], "a": 0, "e": "Correct answer ✓\nState what is known and identify missing information requiring verification.", "type": "MCQ" },
        { "q": "What is the proper logical sequence from problem definition to investigation (Section 2.8)?", "o": ["Problem Definition -> Analytical Questions -> Required Evidence -> Analysis -> Interpretation", "Solution Selection -> Data Collection -> Problem Definition -> Analysis", "Analysis -> Interpretation -> Problem Statement -> Reorder Point", "Executive Judgment -> Immediate Action -> Symptom Check -> Question"], "a": 0, "e": "Correct answer ✓\nSequence: Problem Definition -> Analytical Questions -> Required Evidence -> Analysis -> Interpretation.", "type": "MCQ" },
        { "q": "In the Integrated Example (Section 2.9), online sales fell from 12.0M to 10.2M pounds. What is the absolute and percentage decrease?", "o": ["Absolute decrease = 1.8M pounds; Percentage decrease = 15%", "Absolute decrease = 2.0M pounds; Percentage decrease = 20%", "Absolute decrease = 1.8M pounds; Percentage decrease = 18%", "Absolute decrease = 10.2M pounds; Percentage decrease = 85%"], "a": 0, "e": "Correct answer ✓\nAbsolute decrease = 12.0 - 10.2 = 1.8M. Percentage decrease = (1.8/12.0)*100 = 15%.", "type": "MCQ" },
        { "q": "In 'Test Yourself 1', why is 'Online sales fell 15% during the last quarter' the most accurate statement?", "o": ["Because it describes a measurable change without assuming a cause or proposing a solution", "Because it blames the marketing department directly", "Because it recommends doubling the ad budget", "Because it uses unstructured qualitative terms"], "a": 0, "e": "Correct answer ✓\nIt describes a measurable change without assuming a cause or proposing a solution.", "type": "MCQ" },
        { "q": "In 'Test Yourself 2', how are the 3 scenarios classified?\n1. ROP formula calculation\n2. Platform purchase with known cost vs staff readiness\n3. Business model transformation for disruptive tech", "o": ["1: Structured, 2: Semi-structured, 3: Unstructured", "1: Unstructured, 2: Structured, 3: Semi-structured", "1: Semi-structured, 2: Unstructured, 3: Structured", "All three are structured problems"], "a": 0, "e": "Correct answer ✓\n1: Structured (formula), 2: Semi-structured (cost + readiness), 3: Unstructured (disruptive tech).", "type": "MCQ" },

        // --- High-Level MCQs (41 to 50) ---
        { "q": "[HIGH-LEVEL] 41. In Test Yourself 3, 'Conversion rate dropped from 4% to 3.4% after changing the checkout page; therefore the page change caused it.' What part is certain and what part is an assumption?", "o": ["Certain: Conversion fell after change. Assumption: Page change caused it (temporal sequence != causation)", "Certain: Page change caused it. Assumption: Conversion rate fell", "Both statements are proven facts", "Both statements are unverified assumptions"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nCertain: Conversion fell after change. Assumption: That the change caused it (temporal order alone does not prove causation).", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 42. What is the fundamental golden rule of Chapter 2?", "o": ["Define the problem well before you try to solve it", "Choose a solution immediately to save operational time", "Always assume weak marketing is the root cause", "Convert all structured problems into unstructured scenarios"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nChapter rule: Define the problem well before you try to solve it.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 43. An analyst evaluates two branches. Branch X has 500 delays out of 20,000 transactions (2.5%). Branch Y has 200 delays out of 4,000 transactions (5.0%). If the goal is to lower the late rate, which branch requires primary intervention?", "o": ["Branch Y, because its late rate (5.0%) is double Branch X's (2.5%)", "Branch X, because 500 > 200", "Both branches require identical intervention", "Neither, because delays under 1,000 are acceptable"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nIf the goal is to lower the late rate, Branch Y needs intervention (5% vs 2.5%).", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 44. Why does relying solely on a total count of complaints (e.g. 1,200 to 1,560) risk misinterpreting business performance during business volume growth?", "o": ["Because total count ignores transaction volume growth; if volume grew proportionally, the complaint rate may barely change", "Because total counts cannot be added or subtracted", "Because complaint counts are always inaccurate", "Because rate changes are legally restricted"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nIt is not enough to know a number increased; we must know what it represents relative to volume.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 45. A subscription business target churn is 5%. Actual churn rose from 6% to 9%. What is the gap relative to the target, and what is the relative growth of churn?", "o": ["Exceeds target by 4 percentage points; relative increase is 50%", "Exceeds target by 3 percentage points; relative increase is 33%", "Exceeds target by 9 percentage points; relative increase is 90%", "Exceeds target by 1 percentage point; relative increase is 15%"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTarget gap = 9% - 5% = 4 percentage points. Relative increase = (9-6)/6 * 100 = 50%.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 46. Which of the following analytical question sequences correctly follows the progressive depth model outlined in Section 2.5?", "o": ["Measurement -> Description -> Comparison -> Diagnosis -> Prediction -> Decision", "Decision -> Prediction -> Diagnosis -> Comparison -> Description -> Measurement", "Diagnosis -> Measurement -> Decision -> Prediction -> Description", "Description -> Decision -> Measurement -> Prediction -> Diagnosis"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nSequence moves progressively from measurement/description to comparison, diagnosis, prediction, and decision.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 47. Why is 'Customer waiting time increased from 12 to 20 minutes' classified as an observed condition, while 'Staff shortages caused it' is a possible explanation?", "o": ["Because the first is an empirical measurement, whereas the second is an unverified hypothesis", "Because waiting time cannot be measured", "Because staff shortages are always true", "Because 20 minutes is a reference point"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nObserved condition is verified data; staff shortage is a hypothesis requiring testing.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 48. If an analyst states: 'The company's outdated software is reducing productivity', what primary flaw violates Chapter 2 principles?", "o": ["It embeds an unproven causal assumption into the problem statement", "It uses the word software", "It measures productivity in daily terms", "It lacks a Reorder Point calculation"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nIt assumes outdated software caused the decline before evidence is examined.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 49. In a scenario where mobile checkout conversion drops while desktop conversion remains stable, what framing strategy should the analyst use?", "o": ["Isolate the boundary to mobile channel transactions rather than total company sales", "Expand the investigation to offline retail stores", "Assume desktop software is broken", "Declare total company failure"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nFraming boundaries isolates the affected population/channel (mobile) to keep inquiry focused.", "type": "MCQ" },
        { "q": "[HIGH-LEVEL] 50. What is the main hazard of jumping straight to a solution without executing Section 2.6's problem definition framework?", "o": ["Investing resources in interventions that fail to address the actual underlying condition", "Increasing company stock valuation prematurely", "Automating structured inventory policies", "Reducing total complaint counts"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nDefining the problem before selecting a solution reduces the risk of investing in interventions that do not address the actual condition.", "type": "MCQ" }
    ];

    const P2_SOURCE = [
        // --- True/False (50 Questions) ---
        { "q": "1. Problem solving starts by understanding the problem, not by jumping straight to a solution.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Problem solving starts by understanding the problem, not jumping to a solution.", "type": "TF" },
        { "q": "2. It is sufficient to know that a raw number increased without knowing what that number represents.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Rule: It is not enough to know that a number increased; we must know what that number represents.", "type": "TF" },
        { "q": "3. In Example 2.1, the complaint rate rose by 30% between January and June.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: The COUNT rose 30%, but the RATE increased only from 1.20% to 1.30%.", "type": "TF" },
        { "q": "4. No single performance metric is best in all problem situations.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: No single metric is best in all situations.", "type": "TF" },
        { "q": "5. A branch with a larger total number of late transactions always has a higher late rate than a smaller branch.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Example 2.2 shows Branch B had more late transactions (300 vs 100) but a lower rate (3% vs 5%).", "type": "TF" },
        { "q": "6. Structured problems have clear objectives, variables, constraints, and procedures.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured problems have clear objectives, variables, constraints, and procedures.", "type": "TF" },
        { "q": "7. The Reorder Point (ROP) formula is ROP = (Average Daily Demand * Lead Time) + Safety Stock.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: ROP = (Average Daily Demand * Lead Time) + Safety Stock.", "type": "TF" },
        { "q": "8. Semi-structured problems rely entirely on automated quantitative models without any human judgment.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Semi-structured problems require both quantitative analysis AND managerial judgment.", "type": "TF" },
        { "q": "9. In comparing digital projects, a simplified benefit-to-investment ratio provides a complete financial analysis.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: The ratio is a simplified comparison, not a net return on investment or complete financial analysis.", "type": "TF" },
        { "q": "10. Unstructured problems are characterized by ambiguity, novelty, and lack of a ready-made solution recipe.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Unstructured problems feature high ambiguity, novelty, or uncertainty.", "type": "TF" },
        { "q": "11. An unstructured problem can become more structured after clarifying objectives, variables, and criteria.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Problems may become more structured as information and objectives are clarified.", "type": "TF" },
        { "q": "12. A symptom is a proven root cause of an organizational problem.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: A symptom is an observable sign that something requires attention, not a proven cause.", "type": "TF" },
        { "q": "13. A possible cause is an explanation that may contribute to a situation but is not necessarily proven.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Possible cause = hypothesized explanation needing evidence.", "type": "TF" },
        { "q": "14. Increased patient complaints at a hospital is a problem condition, while long wait times is a symptom.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Increased complaints is the observable symptom; long wait times/poor communication are part of the problem condition data.", "type": "TF" },
        { "q": "15. Defining problem boundaries helps prevent an investigation from becoming too broad.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Boundaries specify population, scope, and time frame to keep inquiry focused.", "type": "TF" },
        { "q": "16. A weak problem statement includes population, location, activity, time frame, and comparison period.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Weak statements like 'Customer satisfaction is low' lack these details; strong statements include them.", "type": "TF" },
        { "q": "17. Absolute change is calculated as Current Value minus Previous Value.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Absolute change = Current value - Previous value.", "type": "TF" },
        { "q": "18. If churn rate increases from 8% to 11%, the relative percentage increase is 3%.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: The percentage-point change is 3 points; the relative percentage increase is 37.5%.", "type": "TF" },
        { "q": "19. The unit of analysis is the entity about which observations are collected and conclusions are drawn.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Definition of unit of analysis.", "type": "TF" },
        { "q": "20. Summarizing data at the branch level proves that every individual customer in a high-scoring branch is satisfied.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Summaries reflect the branch unit, not individual customer experiences.", "type": "TF" },
        { "q": "21. A condition is automatically problematic whenever a measure changes, regardless of reference points.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Whether a condition is problematic depends on comparison with a reference point (target, historical, benchmark).", "type": "TF" },
        { "q": "22. An average wait time of 18 minutes is problematic if the target is 20 minutes.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: If target is 20 minutes, 18 minutes remains within target and is not problematic.", "type": "TF" },
        { "q": "23. An analytical question should define what we want to prove rather than what we need to know.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: A good question defines what we need to know, NOT what we want to prove.", "type": "TF" },
        { "q": "24. Measurement questions establish how a concept should be defined and calculated.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Measurement questions define concepts and calculations.", "type": "TF" },
        { "q": "25. Diagnostic questions examine whether available information can estimate future outcomes.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: PREDICTIVE questions estimate future outcomes; DIAGNOSTIC questions investigate associated factors.", "type": "TF" },
        { "q": "26. Neutrality means an analytical question should not assume an explanation before evidence is examined.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Neutrality avoids pre-assumed conclusions.", "type": "TF" },
        { "q": "27. 'Is customer waiting time too high?' is an effective analytical question.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: 'Too high' is vague; an effective question specifies standard (e.g. 'exceeds standard of 6 minutes?').", "type": "TF" },
        { "q": "28. Leading questions contain unverified conclusions embedded within their wording.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Leading questions assume unverified conclusions.", "type": "TF" },
        { "q": "29. Step 1 of the problem definition framework requires assigning a cause immediately.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Step 1 describes the observable condition while AVOIDING assigning a cause.", "type": "TF" },
        { "q": "30. Step 3 of the framework determines why a condition is problematic by comparing it to a reference point.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Step 3 establishes the reference point.", "type": "TF" },
        { "q": "31. In problem definition, facts and assumptions should be treated as identical.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Step 4 explicitly separates facts from assumptions.", "type": "TF" },
        { "q": "32. A problem definition should be kept completely separate from a proposed solution.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Defining the problem must not be confused with proposing a solution.", "type": "TF" },
        { "q": "33. 'Hire five additional employees' is an analytical question.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: It is a proposed solution.", "type": "TF" },
        { "q": "34. If completion rate drops from 62% to 54%, the decrease is 8 percentage points.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: 62% - 54% = 8 percentage points.", "type": "TF" },
        { "q": "35. A strong problem statement must specify unverified causes to guide management.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: A strong problem statement is NEUTRAL regarding unverified causes and solutions.", "type": "TF" },
        { "q": "36. The practical structure of a problem statement includes observed condition, magnitude, scope, timeframe, and reference point.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structure: Observed Condition + Magnitude + Population/Context + Time Frame + Scope + Reference Point.", "type": "TF" },
        { "q": "37. When information is incomplete, analysts should invent figures to complete the problem statement.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Analysts should state what is known and identify missing info rather than inventing figures.", "type": "TF" },
        { "q": "38. Temporal order alone (Event B happening after Event A) proves that Event A caused Event B.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Temporal order alone does not prove causation.", "type": "TF" },
        { "q": "39. Evidence collection directly follows the formulation of analytical questions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Logic: Problem Definition -> Analytical Questions -> Required Evidence -> Analysis -> Interpretation.", "type": "TF" },
        { "q": "40. In Section 2.9, an e-commerce sales drop from 12M to 10.2M pounds represents a 15% decrease.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: (1.8 / 12.0) * 100 = 15%.", "type": "TF" },

        // --- High-Level True/False (41 to 50) ---
        { "q": "[HIGH-LEVEL] 41. True or False: In Test Yourself 1, 'Sales are poor due to weak marketing' is an ideal problem statement.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Statement A assumes a cause (weak marketing) without proof. Statement B is correct.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 42. True or False: Reorder Point calculation assumes constant average demand and lead time in basic structured models.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Basic ROP assumes constant average demand and lead time.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 43. True or False: If site visits drop 2% while payment failures rise from 1% to 4%, payment failures are automatically proven as the sole cause of order decline.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: They are potential factors worth investigating, not proven causes without analytical design.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 44. True or False: Percentage change expresses change relative to the previous value, while absolute change is the numerical difference.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Definitions of absolute and percentage change.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 45. True or False: In Example 2.14, a target churn rate of 7% serves as the reference point for evaluating an 11% current churn rate.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Target of 7% is the reference point.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 46. True or False: 'How does employee productivity vary across production shifts?' is a diagnostic question.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: It is a COMPARATIVE question. Diagnostic questions investigate associated factors.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 47. True or False: A neutral analytical question prevents analysts from seeking data only to confirm pre-existing biases.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Neutrality ensures evidence is examined objectively.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 48. True or False: Defining problem boundaries includes identifying population, location/scope, and timeframe.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Boundaries specify population, scope, and time frame.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 49. True or False: In Section 2.6.1, 'Staff shortages may be contributing to the increase' is classified as an observed condition.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: It is a POSSIBLE EXPLANATION.", "type": "TF" },
        { "q": "[HIGH-LEVEL] 50. True or False: A good problem definition guarantees an automatic solution without further analysis.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: A good problem definition does not guarantee an automatic solution, but makes subsequent analysis and decision-making more disciplined.", "type": "TF" }
    ];

    const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

    const P1_DATA = [
        ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
        ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
    ];
    const P2_DATA = [
        ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
        ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
    ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            const isHighLevel = q.q.includes("[HIGH-LEVEL]");
            const badgeClass = isHighLevel ? "q-badge high-level" : "q-badge";
            const badgeText = isHighLevel 
                ? (getQuestionType(q) === 'TF' ? 'True / False — High Level' : 'Multiple Choice — High Level')
                : (getQuestionType(q) === 'TF' ? 'True / False' : 'Multiple Choice');
            
            $("card").innerHTML = `
                <span class="${badgeClass}">${badgeText}</span>
                <p class="q">${q.q}</p>
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${getQuestionType(q) === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
