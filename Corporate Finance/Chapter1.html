<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Finance — Chapter 1: Introduction to Financial Management</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .diagram-container {
            direction: ltr;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--b);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
    <link rel="stylesheet" href="../site-theme.css">
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Finance — Chapter 1</h1>
            <p class="sub">Introduction to Financial Management</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice</button>

        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
      
    <script>
        const P1_DATA = [
            // Standard Questions (1-45)
            {"q": "How is 'Finance' defined in Chapter 1?", "o": ["The art and science of managing money", "The process of manufacturing physical goods", "The study of macroeconomic labor markets", "The regulation of government taxes"], "a": 0, "e": "Finance is defined as the art and science of managing money, and the provision of funds at the right time.", "type": "MCQ"},
            {"q": "Finance is also referred to as:", "o": ["The elimination of operational risk", "The provision of funds at the right time", "The auditing of accounting records", "The maximization of short-term inventory"], "a": 1, "e": "Finance also is referred as the provision of funds at the right time.", "type": "MCQ"},
            {"q": "What are the two primary sources of funds a company depends on to finance its capital?", "o": ["Short-term loans and credit cards", "Debt (External finance) and Equity (Internal finance)", "Retained earnings and government subsidies", "Bonds and physical inventory"], "a": 1, "e": "A company depends on two sources: debt (external finance) and equity (internal finance).", "type": "MCQ"},

            {"q": "Equity financing is classified as:", "o": ["External finance", "Internal finance", "Debt obligation", "Public liability"], "a": 1, "e": "Equity is internal finance.", "type": "MCQ"},

            {"q": "Why is profit maximization rejected as the primary goal? (Select the matching disadvantage)", "o": ["It considers the time value of money", "It ignores the time value of money concept", "It focuses strictly on future cash flows", "It eliminates all business risk"], "a": 1, "e": "Profit maximization objective ignores the time value of money concept.", "type": "MCQ"},
            {"q": "Another major disadvantage of profit maximization is that it:", "o": ["Focuses too much on stockholders' actual cash", "Ignores the risk associated with any investment opportunity", "Relies on net present value calculations", "Reduces agency conflicts"], "a": 1, "e": "Profit maximization ignores the risk associated with any investment opportunity.", "type": "MCQ"},

            {"q": "Financial decisions are classified into investment decisions and financing decisions.", "o": ["True", "False"], "a": 0, "e": "True: Financial decisions are classified into these two groups.", "type": "TF"},
            {"q": "Investment decisions relate to the right-hand side of the balance sheet.", "o": ["True", "False"], "a": 1, "e": "False: Investment decisions relate to the left-hand side of the balance sheet (assets).", "type": "TF"},
            {"q": "Financing decisions relate to the right-hand side of the balance sheet (liabilities and stockholders equity).", "o": ["True", "False"], "a": 0, "e": "True: Financing decisions relate to the right-hand side.", "type": "TF"},
            {"q": "Short-term investment decisions involve managing current assets.", "o": ["True", "False"], "a": 0, "e": "True: Short-term investment decisions involve managing current assets.", "type": "TF"},
            {"q": "Long-term investment decisions involve managing long-term assets.", "o": ["True", "False"], "a": 0, "e": "True: Long-term investment decisions involve managing long-term assets.", "type": "TF"},
            {"q": "Short-term financing decisions involve managing current liabilities.", "o": ["True", "False"], "a": 0, "e": "True: Short-term financing decisions involve managing current liabilities.", "type": "TF"},
            {"q": "Long-term financing decisions involve managing long-term liabilities and stockholders equity.", "o": ["True", "False"], "a": 0, "e": "True: Long-term financing decisions involve managing long-term liabilities and stockholders equity.", "type": "TF"},
            {"q": "Money having a time value means a unit of currency today is worth the exact same in the future.", "o": ["True", "False"], "a": 1, "e": "False: Time value means currency today does not equal the same unit in the future.", "type": "TF"},
            {"q": "The risk-return tradeoff means individuals will not take extra risk unless compensated with additional return.", "o": ["True", "False"], "a": 0, "e": "True: Risk-return tradeoff requires compensation for added risk.", "type": "TF"},
            {"q": "Accounting profit and cash flow are identical economic concepts.", "o": ["True", "False"], "a": 1, "e": "False: Profit is an accounting performance measure, while cash flow measures actual cash in/out.", "type": "TF"},
            {"q": "Market prices reflect information when investors react through buying and selling securities.", "o": ["True", "False"], "a": 0, "e": "True: Market prices reflect information via investor trading.", "type": "TF"},
            {"q": "The agency problem refers to the conflict of interest between shareholders and managers.", "o": ["True", "False"], "a": 0, "e": "True: Agency problem is the conflict between shareholders and managers.", "type": "TF"},
            {"q": "The agency problem occurs because management and ownership of the firm are united.", "o": ["True", "False"], "a": 1, "e": "False: The conflict appears because of the separation between management and ownership.", "type": "TF"},
            {"q": "Managers act as the agents of the owner or owners of the firm.", "o": ["True", "False"], "a": 0, "e": "True: Managers act as agents for owners.", "type": "TF"},
            {"q": "When managers own less than 100% of the firm, they always prioritize owners over themselves.", "o": ["True", "False"], "a": 1, "e": "False: They may act on their own benefits rather than owners' interests.", "type": "TF"},
            {"q": "Managing foreign exchange is considered a financial activity for a financial manager.", "o": ["True", "False"], "a": 0, "e": "True: Managing foreign exchange is listed as a financial activity.", "type": "TF"},
            {"q": "Business finance is a branch of public finance.", "o": ["True", "False"], "a": 1, "e": "False: Business finance is a branch of private finance.", "type": "TF"},
            {"q": "Central government finance is a branch of private finance.", "o": ["True", "False"], "a": 1, "e": "False: Central government finance belongs to public finance.", "type": "TF"},
            {"q": "Financial analysis for performance is a key duty of the financial manager.", "o": ["True", "False"], "a": 0, "e": "True: Financial analysis for performance is a financial activity.", "type": "TF"},

            // High-Level Questions (46-50)
            {"q": "[HIGH-LEVEL] If a firm focuses strictly on short-term EPS (profit maximization) by cutting essential R&D expenditures, it may temporarily boost stock prices while destroying long-term shareholder value and ignoring the time value of money.", "o": ["True", "False"], "a": 0, "e": "True: Profit maximization is short-term, ignores time value of money, and can sacrifice long-term wealth maximization.", "type": "TF"},
            {"q": "[HIGH-LEVEL] A financing decision involving the issuance of short-term bank debt affects the left-hand side (assets) of the balance sheet.", "o": ["True", "False"], "a": 1, "e": "False: Financing decisions relate to the right-hand side (liabilities and equity), whereas investment decisions relate to assets on the left.", "type": "TF"},
            {"q": "[HIGH-LEVEL] The separation of ownership and management in modern corporations completely eliminates the agency problem by ensuring shareholders manage daily operations.", "o": ["True", "False"], "a": 1, "e": "False: Separation of ownership and management is precisely what creates the agency problem and potential conflicts of interest.", "type": "TF"},
            {"q": "[HIGH-LEVEL] In accordance with the risk-return tradeoff principle, a rational investor would accept a lower expected return for a substantially higher level of investment risk.", "o": ["True", "False"], "a": 1, "e": "False: Investors require higher returns to compensate for higher risks, not lower returns.", "type": "TF"},
            {"q": "[HIGH-LEVEL] An investor who assumes that reported accounting net income is identical to net cash generated during the same period violates the core finance principle that cash flows (not accounting profit) are the true source of value.", "o": ["True", "False"], "a": 0, "e": "True: Profit is an accounting performance measure over a period, while cash flows represent actual cash movements and are the true source of value.", "type": "TF"}
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            let diagHtml = q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : '';
            
            $("card").innerHTML = `
                <span class="q-badge">${q.type === 'TF' ? 'True / False' : 'Multiple Choice'}</span>
                <p class="q">${q.q}</p>
                ${diagHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);
            
            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
