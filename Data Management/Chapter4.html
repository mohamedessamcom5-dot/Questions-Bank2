<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Management</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .diagram-container {
            direction: ltr;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--b);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
    <link rel="stylesheet" href="../site-theme.css">
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Data Management — Chapter 4</h1>
            <p class="sub">Structured, Semi-structured, and Unstructured Data</p>
        </div>
    
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False </button>
        </div>
    
        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
    
    <script>
        const P1_SOURCE = [
            // --- MCQs (50 Questions) ---
            { "q": "How is structured data formally defined in Chapter 4?", "o": ["Data organized in fixed format (rows/columns) with a predefined schema", "Data with no predefined data model or schema", "Data that does not fit rigid tables but has tags and metadata", "Free-form human-generated content requiring AI/NLP"], "a": 0, "e": "Correct answer ✓\nStructured data is organized in fixed format (rows/columns) with a predefined schema.", "type": "MCQ" },
            { "q": "Where is structured data typically stored?", "o": ["In relational databases or spreadsheets", "In data lakes and file systems exclusively", "In NoSQL document stores without schemas", "In unstructured text archives"], "a": 0, "e": "Correct answer ✓\nStructured data is stored in relational databases or spreadsheets.", "type": "MCQ" },
            { "q": "What are the main features of structured data?", "o": ["Predefined schema, high data quality, and easy to query/analyze using SQL", "Flexible schema with self-describing tags", "No fixed format and difficult to search directly", "Free-form text requiring AI tools"], "a": 0, "e": "Correct answer ✓\nStructured data features a predefined schema, high data quality, and easy SQL querying.", "type": "MCQ" },
            { "q": "Which of the following is an example of structured data?", "o": ["Customer names, IDs, transactions", "Videos, images, and social media posts", "XML and JSON dataset documents", "Emails with unstructured body text"], "a": 0, "e": "Correct answer ✓\nCustomer names, IDs, and transactions are examples of structured data.", "type": "MCQ" },
            { "q": "What is the concept of semi-structured data?", "o": ["Data that does not fit rigid tables but has tags/metadata and a flexible schema", "Data organized in strict rows and columns with a fixed schema", "Data with no model, schema, or tags", "Raw binary code files"], "a": 0, "e": "Correct answer ✓\nSemi-structured data does not fit rigid tables but has tags/metadata and a flexible schema.", "type": "MCQ" },
            { "q": "How can a semi-structured schema evolve?", "o": ["Without breaking structure", "Only by deleting the entire database", "By converting into rigid relational tables", "It cannot evolve at all"], "a": 0, "e": "Correct answer ✓\nSemi-structured schema is flexible and can evolve without breaking structure.", "type": "MCQ" },
            { "q": "What are the main features of semi-structured data?", "o": ["Self-describing elements (tags, markers), partly structured, partly free-form", "Fixed rows, columns, and strict RDBMS enforcement", "Complete absence of schema or metadata", "Tabular layout queried solely by SQL"], "a": 0, "e": "Correct answer ✓\nSemi-structured data features self-describing elements, being partly structured and partly free-form.", "type": "MCQ" },
            { "q": "Which of the following are examples of semi-structured data?", "o": ["XML, JSON, emails", "Customer IDs and financial transactions", "Raw video recordings and high-resolution images", "Audio podcast files"], "a": 0, "e": "Correct answer ✓\nXML, JSON, and emails are classic examples of semi-structured data.", "type": "MCQ" },
            { "q": "In the XML dataset example in Chapter 4, what is the building ID specified?", "o": ["Surrey Head Office", "Vancouver Central", "Admin_100", "Canada_Headquarters"], "a": 0, "e": "Correct answer ✓\nThe building ID in the XML example is Surrey Head Office.", "type": "MCQ" },
            { "q": "What city is listed for the building in the XML dataset example?", "o": ["Surrey", "Vancouver", "Toronto", "Ottawa"], "a": 0, "e": "Correct answer ✓\nThe city listed is Surrey.", "type": "MCQ" },
            { "q": "What province and country are specified in the XML dataset example?", "o": ["Province: BC, Country: Canada", "Province: ON, Country: USA", "Province: AB, Country: Mexico", "Province: QC, Country: UK"], "a": 0, "e": "Correct answer ✓\nThe province is BC and the country is Canada.", "type": "MCQ" },
            { "q": "What room ID is given under the building structure in the XML example?", "o": ["Admin_100", "Room_500", "Reception_A", "Office_202"], "a": 0, "e": "Correct answer ✓\nThe room ID given is Admin_100.", "type": "MCQ" },
            { "q": "What name and material are specified for the room and wall in the XML example?", "o": ["Name: Reception, Wall material: wood", "Name: Conference, Wall material: glass", "Name: Lobby, Wall material: steel", "Name: Storage, Wall material: concrete"], "a": 0, "e": "Correct answer ✓\nThe room name is Reception and the wall material is wood.", "type": "MCQ" },
            { "q": "What is the concept of unstructured data?", "o": ["No predefined data model or schema, mostly human-generated content, hard to store in RDBMS", "Organized in fixed tabular rows and columns with strict constraints", "Embedded with self-describing XML and JSON tags", "Partly structured and partly free-form metadata"], "a": 0, "e": "Correct answer ✓\nUnstructured data has no predefined model or schema and is mostly human-generated content.", "type": "MCQ" },
            { "q": "What are the main features of unstructured data?", "o": ["No fixed format, difficult to search directly, large volume, requires AI/NLP for analysis", "Predefined schema with high data quality", "Self-describing XML tags and markers", "Easily queried using standard SQL statements"], "a": 0, "e": "Correct answer ✓\nUnstructured data has no fixed format, is hard to search, and requires AI/NLP for analysis.", "type": "MCQ" },
            { "q": "Which of the following are examples of unstructured data?", "o": ["Videos, images, social media posts", "Customer names, IDs, and transactions", "XML dataset configurations", "JSON database schemas"], "a": 0, "e": "Correct answer ✓\nVideos, images, and social media posts are examples of unstructured data.", "type": "MCQ" },
            { "q": "According to the data types comparison table, what is the schema type for structured data?", "o": ["Fixed", "Flexible", "None", "Dynamic"], "a": 0, "e": "Correct answer ✓\nStructured data has a fixed schema.", "type": "MCQ" },
            { "q": "According to the comparison table, what is the schema type for semi-structured data?", "o": ["Flexible", "Fixed", "None", "Rigid"], "a": 0, "e": "Correct answer ✓\nSemi-structured data has a flexible schema.", "type": "MCQ" },
            { "q": "According to the comparison table, what is the schema type for unstructured data?", "o": ["None", "Fixed", "Flexible", "Hierarchical"], "a": 0, "e": "Correct answer ✓\nUnstructured data has no schema.", "type": "MCQ" },
            { "q": "What format does structured data have according to the comparison table?", "o": ["Tabular", "Hierarchical / Tagged", "Free-form", "Relational binary"], "a": 0, "e": "Correct answer ✓\nStructured data format is tabular.", "type": "MCQ" },
            { "q": "What format does semi-structured data have according to the comparison table?", "o": ["Hierarchical / Tagged", "Tabular", "Free-form", "Strict grid"], "a": 0, "e": "Correct answer ✓\nSemi-structured data format is hierarchical / tagged.", "type": "MCQ" },
            { "q": "What format does unstructured data have according to the comparison table?", "o": ["Free-form", "Tabular", "Hierarchical / Tagged", "XML schema"], "a": 0, "e": "Correct answer ✓\nUnstructured data format is free-form.", "type": "MCQ" },
            { "q": "Where is structured data stored according to the comparison table?", "o": ["RDBMS", "NoSQL / XML / JSON", "Data lakes / File systems", "Spreadsheet caches"], "a": 0, "e": "Correct answer ✓\nStructured data is stored in RDBMS.", "type": "MCQ" },
            { "q": "Where is semi-structured data stored according to the comparison table?", "o": ["NoSQL / XML / JSON", "RDBMS", "Data lakes / File systems only", "Relational tables"], "a": 0, "e": "Correct answer ✓\nSemi-structured data is stored in NoSQL / XML / JSON.", "type": "MCQ" },
            { "q": "Where is unstructured data stored according to the comparison table?", "o": ["Data lakes / File systems", "RDBMS", "NoSQL document tables", "Spreadsheet grids"], "a": 0, "e": "Correct answer ✓\nUnstructured data is stored in data lakes / file systems.", "type": "MCQ" },
            { "q": "How easy is it to search structured data according to the comparison table?", "o": ["Very easy (SQL)", "Moderate", "Hard (AI/NLP required)", "Impossible without conversion"], "a": 0, "e": "Correct answer ✓\nSearching structured data is very easy using SQL.", "type": "MCQ" },
            { "q": "How easy is it to search semi-structured data according to the comparison table?", "o": ["Moderate", "Very easy (SQL)", "Hard (AI/NLP required)", "Extremely simple"], "a": 0, "e": "Correct answer ✓\nSearching semi-structured data has moderate ease of search.", "type": "MCQ" },
            { "q": "How easy is it to search unstructured data according to the comparison table?", "o": ["Hard (AI/NLP required)", "Very easy (SQL)", "Moderate", "Instantaneous"], "a": 0, "e": "Correct answer ✓\nSearching unstructured data is hard and requires AI/NLP.", "type": "MCQ" },
            { "q": "Why is unstructured data hard to store in traditional relational database management systems (RDBMS)?", "o": ["Because it has no predefined data model or schema", "Because it is too small in volume", "Because it uses strict XML tags", "Because SQL cannot process text files"], "a": 0, "e": "Correct answer ✓\nIt is hard to store in RDBMS because it lacks a predefined data model or schema.", "type": "MCQ" },
            { "q": "What technology is required to analyze unstructured data effectively?", "o": ["AI/NLP (Artificial Intelligence / Natural Language Processing)", "Standard SQL queries", "Relational joins", "Tabular pivot tables"], "a": 0, "e": "Correct answer ✓\nUnstructured data requires AI/NLP for analysis.", "type": "MCQ" },
            { "q": "Which data type benefits from self-describing elements like tags and markers?", "o": ["Semi-structured data", "Structured data", "Unstructured data", "Tabular relational data"], "a": 0, "e": "Correct answer ✓\nSemi-structured data features self-describing elements like tags and markers.", "type": "MCQ" },
            { "q": "What guarantees high data quality in structured data?", "o": ["Predefined schema and fixed row/column format", "Free-form text generation", "Self-describing JSON tags", "Unstructured data lakes"], "a": 0, "e": "Correct answer ✓\nPredefined schema ensures high data quality in structured data.", "type": "MCQ" },
            { "q": "Which data type category best describes most human-generated content?", "o": ["Unstructured data", "Structured data", "Relational database tables", "Spreadsheet grids"], "a": 0, "e": "Correct answer ✓\nUnstructured data consists mostly of human-generated content.", "type": "MCQ" },
            { "q": "What makes semi-structured data different from structured data regarding tables?", "o": ["Semi-structured data does not fit rigid tables but uses tags/metadata", "Semi-structured data must always be stored in strict RDBMS grids", "Structured data uses XML tags while semi-structured uses SQL", "There is no difference"], "a": 0, "e": "Correct answer ✓\nSemi-structured data does not fit rigid tables but has tags/metadata.", "type": "MCQ" },
            { "q": "Which query language is highlighted as ideal for analyzing structured data?", "o": ["SQL", "AI/NLP", "NoSQL scripts", "XML parser"], "a": 0, "e": "Correct answer ✓\nSQL is used to query and analyze structured data easily.", "type": "MCQ" },

            // --- High-Level MCQs (36 to 50) ---
            { "q": "[HIGH-LEVEL] 36. An enterprise collects customer names, account IDs, and transaction amounts. A data analyst needs to query this information instantly using relational operators and SQL. How should this data be classified?", "o": ["Structured Data", "Semi-Structured Data", "Unstructured Data", "Raw Audio Data"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nCustomer names, IDs, and transactions stored in fixed formats with predefined schemas are structured data.", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 37. A healthcare application stores patient records using JSON documents where new fields can be added dynamically without altering the overall database structure. What core property is demonstrated here?", "o": ["Flexible schema that can evolve without breaking structure (Semi-Structured)", "Fixed tabular schema with high data quality", "Complete absence of schema requiring AI/NLP", "Relational foreign key constraints"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nSemi-structured data features a flexible schema that evolves without breaking structure.", "type": "MCQ" },
            { "q": "[HIGH-LEVEL] 38. Why would storing hours of raw unformatted CCTV video footage directly in a standard RDBMS table designed for financial transactions fail or be highly inefficient?", "o": ["Because unstructured video data lacks a predefined schema or fixed tabular format and cannot be queried easily via standard SQL without AI/NLP", "Because videos have fixed schemas and high data quality", "Because videos use XML tags and relational keys", "Because RDBMS systems are specifically built for video data lakes"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nUnstructured data has no fixed format or schema, making it difficult to store in RDBMS and requiring specialized storage like data lakes.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 39. According to the comparison table in Chapter 4, if an organization stores semi-structured configurations in XML or JSON, what storage technology and search ease are expected?", "o": ["Storage in NoSQL/XML/JSON with moderate ease of search", "Storage in RDBMS with very easy SQL search", "Storage in data lakes with hard AI/NLP search", "Storage in spreadsheets with fixed tabular schemas"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nSemi-structured data is stored in NoSQL/XML/JSON and has moderate search ease.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 40. Why are emails classified as semi-structured data rather than fully unstructured data?", "o": ["Because they contain self-describing elements and metadata (like sender, recipient, subject tags) alongside free-form text", "Because they are stored exclusively in relational database tables", "Because they lack any tags or metadata whatsoever", "Because they can only be analyzed using SQL"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nEmails contain tags and metadata, making them partly structured and partly free-form (semi-structured).", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 41. Compare the search ease of structured data versus unstructured data: why is one classified as 'Very easy (SQL)' and the other as 'Hard (AI/NLP required)'?", "o": ["Structured data has a fixed tabular format and predefined schema ideal for SQL indexing, whereas unstructured data has no fixed format and requires complex language models to parse", "Structured data requires AI/NLP while unstructured data uses SQL", "Both share identical search mechanisms in data lakes", "Unstructured data has higher data quality than structured data"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nStructured tabular data is easily queried with SQL, while unstructured free-form data requires AI/NLP.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 42. In the XML dataset example provided in the chapter, how is hierarchical relationship structured between the building and the rooms?", "o": ["The Building element contains attributes like id, address, city, country, location, and nested Room elements with their own attributes and wall materials", "Rooms are stored in flat RDBMS rows without tags", "Rooms exist independently without any building hierarchy", "The building list is stored as unstructured video frames"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nThe XML example shows a hierarchical structure where Building contains Location and nested Room elements.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 43. If a company's data architecture utilizes data lakes and file systems to hold massive volumes of human-generated images and audio files, which data type is being managed?", "o": ["Unstructured Data", "Structured Data", "Semi-Structured Data", "Relational Tabular Data"], "a": 0, "e": "[HIGH-LEVEL] Data lakes and file systems store unstructured data.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 44. What is the operational consequence of a data source having 'no predefined data model or schema'?", "o": ["It is difficult to search directly and requires advanced AI/NLP techniques to extract insights", "It can be queried immediately using standard SQL in an RDBMS", "It guarantees 100% data quality and tabular alignment", "It automatically converts into relational rows and columns"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nLack of schema means difficult direct search and a need for AI/NLP.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 45. Which of the following best summarizes the spectrum of data types covered in Chapter 4?", "o": ["Structured (fixed schema, tabular, RDBMS), Semi-Structured (flexible schema, tagged, NoSQL/JSON), and Unstructured (no schema, free-form, data lakes)", "Structured (free-form), Semi-Structured (tabular), Unstructured (SQL)", "Primitive, Composite, and User-Defined Data Types", "Descriptive, Diagnostic, Predictive, and Prescriptive Analytics"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nThis summarizes the core classification of structured, semi-structured, and unstructured data in Chapter 4.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 46. An application processes log files that contain timestamps and error codes tagged with XML markers. How should these tagged log files be categorized?", "o": ["Semi-structured data", "Fully unstructured data", "Purely structured relational data", "Tabular spreadsheet data"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTagged log files with markers represent semi-structured data.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 47. Why is high data quality specifically attributed as a main feature of structured data?", "o": ["Because strict predefined schemas and fixed row/column constraints prevent invalid entries and format inconsistencies", "Because unstructured text files correct errors automatically", "Because AI/NLP cleans up data lakes", "Because semi-structured tags allow random data types"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nPredefined schemas enforce strict rules, ensuring high data quality.", "type": "MCQ." },
            { "q": "[HIGH-LEVEL] 48. If an analyst needs to migrate data from a rigid RDBMS table into a NoSQL document store that accepts hierarchical JSON objects, what type of data transformation is occurring in terms of structure?", "o": ["Moving from structured data to semi-structured data", "Moving from unstructured data to structured data", "Moving from unstructured data to relational tables", "Moving from semi-structured tags to raw binary video"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nMoving from RDBMS tables to JSON document stores transitions structured data into semi-structured data.", "type": "MCQ." },

            { "q": "[HIGH-LEVEL] 50. Reviewing the comprehensive comparison table in Chapter 4, which combination correctly matches Structured Data to its schema, format, storage, and search ease?", "o": ["Schema: Fixed, Format: Tabular, Storage: RDBMS, Search Ease: Very easy (SQL)", "Schema: Flexible, Format: Free-form, Storage: Data lakes, Search Ease: Hard", "Schema: None, Format: Tagged, Storage: NoSQL, Search Ease: Moderate", "Schema: Fixed, Format: Free-form, Storage: File systems, Search Ease: AI/NLP"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nStructured data has a fixed schema, tabular format, RDBMS storage, and very easy SQL search.", "type": "MCQ." }

        const P2_SOURCE = [
            // --- True/False (50 Questions) ---

            { "q": "8. Semi-structured data contains tags and metadata.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Semi-structured data has tags and metadata.", "type": "TF" },
            { "q": "9. Semi-structured data has a flexible schema that can evolve without breaking structure.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Its flexible schema evolves without breaking structure.", "type": "TF" },
            { "q": "10. Semi-structured data features self-describing elements like tags and markers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Self-describing elements are a main feature.", "type": "TF" },
            { "q": "11. XML, JSON, and emails are examples of semi-structured data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: XML, JSON, and emails are semi-structured data.", "type": "TF" },
            { "q": "12. Unstructured data has a strict predefined data model and schema.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured data has no predefined schema or model.", "type": "TF" },

            { "q": "14. Unstructured data has a fixed tabular format.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured data has no fixed format.", "type": "TF" },

            { "q": "17. Videos, images, and social media posts are examples of unstructured data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Videos, images, and social posts are unstructured.", "type": "TF" },

            { "q": "22. According to the comparison table, semi-structured data has a hierarchical or tagged format.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Semi-structured format is hierarchical / tagged.", "type": "TF" },
            { "q": "23. According to the comparison table, unstructured data has a tabular format.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured format is free-form.", "type": "TF" },
            { "q": "24. According to the comparison table, structured data is stored in RDBMS.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured storage is RDBMS.", "type": "TF" },
            { "q": "25. According to the comparison table, semi-structured data is stored in NoSQL, XML, or JSON.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Semi-structured storage is NoSQL / XML / JSON.", "type": "TF" },
            { "q": "26. According to the comparison table, unstructured data is stored in data lakes or file systems.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Unstructured storage is data lakes / file systems.", "type": "TF" },
            { "q": "27. According to the comparison table, searching structured data using SQL is very easy.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Structured search is very easy using SQL.", "type": "TF" },
            { "q": "28. According to the comparison table, semi-structured data search has moderate ease of search.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Semi-structured search is moderate.", "type": "TF" },
            { "q": "29. According to the comparison table, searching unstructured data is very easy without special tools.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured search is hard and requires AI/NLP.", "type": "TF" },
            { "q": "30. Unstructured data search requires AI/NLP.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: AI/NLP is required for unstructured search.", "type": "TF" },
            { "q": "31. In the XML dataset example, the building ID is listed as 'Surrey Head Office'.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: The building ID in the XML example is Surrey Head Office.", "type": "TF" },
            { "q": "32. In the XML example, the city listed is Vancouver.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: The city listed is Surrey.", "type": "TF" },
            { "q": "33. In the XML example, the province is BC and the country is Canada.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Province is BC and country is Canada.", "type": "TF" },
            { "q": "34. In the XML example, the room ID is 'Admin_100' and room name is 'Reception'.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Room ID is Admin_100 and name is Reception.", "type": "TF" },
            { "q": "35. In the XML example, the wall material is specified as wood.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Wall material is wood.", "type": "TF" },
            { "q": "36. Structured data requires AI/NLP for basic relational queries.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Structured data uses SQL, not AI/NLP.", "type": "TF" },
            { "q": "37. Semi-structured data is partly structured and partly free-form.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: It is partly structured and partly free-form.", "type": "TF" },
            { "q": "38. Data lakes and file systems are typical storage environments for unstructured data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Data lakes and file systems store unstructured data.", "type": "TF" },
            { "q": "39. RDBMS is the primary recommended storage system for unstructured video and image lakes.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Unstructured data is stored in data lakes/file systems, not RDBMS.", "type": "TF" },
            { "q": "40. Predefined schemas are a defining characteristic of structured data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Predefined schema defines structured data.", "type": "TF" },

            // --- High-Level TFs (41 to 50) ---
            { "q": "[HIGH-LEVEL] 41. True or False: Because semi-structured data possesses self-describing tags, its schema can evolve over time without breaking existing data structures or applications.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Semi-structured schema is flexible and can evolve without breaking structure.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 42. True or False: Storing petabytes of raw unformatted CCTV camera footage in a rigid tabular RDBMS without preprocessing is the optimal recommended storage architecture.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Unstructured data is hard to store in RDBMS and belongs in data lakes or file systems.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 43. True or False: The comparison table indicates that structured data has a flexible schema and free-form format.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Structured data has a fixed schema and tabular format.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 44. True or False: Emails contain both structured headers (sender, recipient, date) and unstructured body text, which is why they are classified as semi-structured data.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Emails are a classic example of semi-structured data combining structured elements/tags with free-form text.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 45. True or False: In a scenario where an application needs to execute complex relational joins and aggregations, structured data queried via SQL provides superior performance and ease of analysis compared to unstructured text.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Structured data queried via SQL is very easy to analyze and query.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 46. True or False: Unstructured data is characterized by a complete absence of a predefined data model or schema.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Unstructured data has no predefined data model or schema.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. True or False: According to Chapter 4, semi-structured data cannot be stored in XML or JSON formats.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: XML and JSON are the primary storage formats for semi-structured data.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. True or False: Searching unstructured data directly with basic SQL statements is fast and effective.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Unstructured data search is hard and requires AI/NLP, not basic SQL.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. True or False: High data quality is a recognized main feature of structured data due to its fixed row/column format and predefined schema enforcement.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Predefined schema ensures high data quality in structured data.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. True or False: The primary differentiation between structured, semi-structured, and unstructured data lies in the presence, flexibility, or absence of a predefined schema and organizational format.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Schema type and format differentiate structured (fixed/tabular), semi-structured (flexible/tagged), and unstructured (none/free-form) data.", "type": "TF" }
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            let diagHtml = q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : '';
            
            $("card").innerHTML = `
                <span class="q-badge">${q.type === 'TF' ? 'True / False' : 'Multiple Choice'}</span>
                <p class="q">${q.q}</p>
                ${diagHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
