<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Management</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .diagram-container {
            direction: ltr;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--b);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
    <link rel="stylesheet" href="../site-theme.css">
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Data Management — Chapter 5 </h1>
            <p class="sub">Cloud Computing</p>
        </div>
    
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice </button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False </button>
        </div>
    
        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
    
    <script>
        const P1_SOURCE = [
            // --- Standard & High-Level MCQs (50 Questions) ---
            { "q": "What is the formal definition of cloud computing in Chapter 5?", "o": ["The delivery of computing services including servers, storage, databases, networking, software, and analytics over the internet", "A physical hardware storage device installed on personal local desktop computers", "A local database management system running strictly on on-premise servers", "An offline software suite for word processing and spreadsheet calculation"], "a": 0, "e": "Correct answer ✓\nCloud computing is the delivery of computing services over the internet instead of local servers.", "type": "MCQ" },
            { "q": "Which of the following best describes a Public Cloud?", "o": ["Provided by third-party companies (e.g., AWS, Microsoft Azure, Google Cloud) where resources are shared among multiple users", "Dedicated infrastructure used exclusively by a single organization on-premises", "Shared infrastructure restricted only to educational institutions", "An offline database managed internally by corporate staff"], "a": 0, "e": "Correct answer ✓\nPublic clouds are provided by third-party companies and shared among multiple users.", "type": "MCQ" },
            { "q": "Which platforms are examples of Public Cloud providers mentioned in Chapter 5?", "o": ["Amazon Web Services (AWS), Microsoft Azure, Google Cloud Platform (GCP)", "Local desktop file systems and personal hard drives", "On-premises company data servers only", "Internal corporate intranet networks"], "a": 0, "e": "Correct answer ✓\nAWS, Azure, and GCP are prime examples of public clouds.", "type": "MCQ" },
            { "q": "What characterizes a Private Cloud?", "o": ["Dedicated infrastructure used by a single organization, hosted on-premises or by a third-party provider", "Shared resources open to the general public over the open internet", "Infrastructure shared among multiple competing commercial enterprises", "An unmanaged public data lake"], "a": 0, "e": "Correct answer ✓\nPrivate clouds utilize dedicated infrastructure for a single organization.", "type": "MCQ" },
            { "q": "Which of the following is an example format or type of Private Cloud?", "o": ["On-Premises Private Cloud, Hosted/Managed Private Cloud, Virtual Private Cloud (VPC)", "Public AWS EC2 instances shared with external users", "Community healthcare shared labs", "Public Google Cloud storage buckets"], "a": 0, "e": "Correct answer ✓\nPrivate cloud types include on-premises, hosted/managed, and VPC.", "type": "MCQ" },
            { "q": "What is a Hybrid Cloud?", "o": ["Combines public and private clouds, allowing data and apps to move between them", "A cloud that operates exclusively without internet connectivity", "A cloud model restricted solely to educational institutions", "An infrastructure that uses only on-premise physical servers"], "a": 0, "e": "Correct answer ✓\nHybrid cloud combines public and private clouds allowing data and app movement.", "type": "MCQ" },
            { "q": "How does Netflix utilize hybrid clouds according to Chapter 5 examples?", "o": ["Uses AWS for storing streaming content while running analytics and development in private setups", "Runs all operations on local personal laptops", "Uses community clouds exclusively for video streaming", "Relies solely on on-premise physical disk drives"], "a": 0, "e": "Correct answer ✓\nNetflix uses AWS for streaming storage and private setups for analytics/development.", "type": "MCQ" },
            { "q": "What is a Community Cloud?", "o": ["Shared infrastructure for a specific group (e.g., healthcare hospitals/labs or educational institutions)", "A public cloud open to every internet user globally", "A single-tenant private infrastructure owned by one person", "An isolated offline corporate database"], "a": 0, "e": "Correct answer ✓\nCommunity cloud is a shared infrastructure for a specific group.", "type": "MCQ" },
            { "q": "What are typical use case examples of Community Clouds?", "o": ["Healthcare (hospitals/labs sharing info) and Education (schools sharing online learning platforms)", "Global video streaming for commercial movie theaters", "Personal file backups on individual flash drives", "Single-company internal payroll processing"], "a": 0, "e": "Correct answer ✓\nHealthcare and education are cited as community cloud examples.", "type": "MCQ" },
            { "q": "What does IaaS (Infrastructure as a Service) provide?", "o": ["Virtualized computing resources such as servers, storage, and networking", "Ready-to-use software applications on a subscription basis", "A complete programming development platform without infrastructure management", "A local desktop operating system"], "a": 0, "e": "Correct answer ✓\nIaaS provides virtualized computing resources like servers, storage, and networking.", "type": "MCQ." },
            { "q": "Which of the following are examples of IaaS?", "o": ["Amazon Elastic Compute Cloud (EC2) and Google Compute Engine", "Gmail and Microsoft 365", "Google App Engine and Azure App Service", "Dropbox and local flash drives"], "a": 0, "e": "Correct answer ✓\nAWS EC2 and Google Compute Engine are IaaS examples.", "type": "MCQ." },
            { "q": "What does PaaS (Platform as a Service) provide?", "o": ["A platform for developers to build, test, and deploy applications without managing underlying infrastructure", "Virtualized raw network cables and server hardware racks", "End-user software applications delivered over the internet", "Personal cloud storage folders"], "a": 0, "e": "Correct answer ✓\nPaaS provides a development platform for building, testing, and deploying apps.", "type": "MCQ." },
            { "q": "Which of the following are examples of PaaS?", "o": ["Google App Engine and Microsoft Azure App Service", "Amazon EC2 and Google Compute Engine", "Gmail and Dropbox", "Microsoft 365 and local spreadsheets"], "a": 0, "e": "Correct answer ✓\nGoogle App Engine and Azure App Service are PaaS examples.", "type": "MCQ." },
            { "q": "What does SaaS (Software as a Service) deliver?", "o": ["Software applications over the internet on a subscription basis", "Raw virtual servers and storage arrays", "Development code compilers and testing platforms", "On-premise hardware maintenance tools"], "a": 0, "e": "Correct answer ✓\nSaaS delivers software applications over the internet on a subscription basis.", "type": "MCQ." },
            { "q": "Which of the following are examples of SaaS?", "o": ["Gmail, Microsoft 365, and Dropbox", "Amazon EC2 and Google Compute Engine", "Google App Engine and Azure App Service", "On-premises private server racks"], "a": 0, "e": "Correct answer ✓\nGmail, Microsoft 365, and Dropbox are SaaS examples.", "type": "MCQ." },
            { "q": "What are the core aims of Data Availability & Accessibility as a cloud goal?", "o": ["Ensuring data is always available even during failures and providing global access from anywhere, anytime", "Restricting data access to a single physical computer terminal", "Eliminating internet connectivity entirely", "Storing data exclusively on local magnetic tapes"], "a": 0, "e": "Correct answer ✓\nAvailability and accessibility ensure data is always available and globally accessible.", "type": "MCQ." },
            { "q": "How does Scalability function as a cloud computing goal?", "o": ["Easily scaling storage and processing power as data grows, supporting both structured and unstructured data", "Fixing storage capacity at a rigid permanent limit", "Requiring manual purchase of new physical hard drives", "Restricting data growth to prevent system expansion"], "a": 0, "e": "Correct answer ✓\nScalability easily scales storage and processing as data grows for structured and unstructured data.", "type": "MCQ." },
            { "q": "What does Data Security & Compliance involve in cloud goals?", "o": ["Protecting data with encryption, authentication, access control, and meeting standards like GDPR, HIPAA, and ISO", "Leaving data unencrypted on public networks", "Ignoring international legal regulations", "Restricting security policies to local office hours"], "a": 0, "e": "Correct answer ✓\nSecurity and compliance protect data via encryption/controls and meet GDPR, HIPAA, and ISO.", "type": "MCQ." },
            { "q": "How is Cost Efficiency achieved in cloud computing?", "o": ["Through pay-as-you-go models and optimizing storage/processing costs", "By purchasing expensive permanent physical hardware upfront", "By paying fixed maintenance fees regardless of usage", "By eliminating all software licensing"], "a": 0, "e": "Correct answer ✓\nCost efficiency reduces infrastructure costs through pay-as-you-go models.", "type": "MCQ." },
            { "q": "What does Data Integration & Interoperability enable in cloud goals?", "o": ["Smooth integration across multiple applications, services, and cloud providers (supporting hybrid/multi-cloud)", "Complete isolation of applications from one another", "Permanent lock-in to a single proprietary vendor format", "Manual data re-entry between isolated systems"], "a": 0, "e": "Correct answer ✓\nIntegration and interoperability enable smooth connection across apps and providers.", "type": "MCQ." },

            { "q": "What does Performance Optimization target in cloud data management?", "o": ["Delivering low-latency access to large datasets and ensuring efficient data movement and query performance", "Increasing network delay across regions", "Slowing down database queries to save power", "Eliminating query execution entirely"], "a": 0, "e": "Correct answer ✓\nPerformance optimization delivers low-latency access and efficient query performance.", "type": "MCQ." },
            { "q": "What is the focus of Data Governance & Quality in cloud goals?", "o": ["Maintaining accuracy, consistency, and trustworthiness of data through metadata management and lifecycle policies", "Allowing random data corruption across servers", "Deleting data metadata permanently", "Ignoring data consistency standards"], "a": 0, "e": "Correct answer ✓\nGovernance and quality maintain accuracy, consistency, and metadata policies.", "type": "MCQ." },
            { "q": "What are the primary risks associated with Data Security & Privacy challenges in cloud computing?", "o": ["Potential for cyberattacks, breaches, unauthorized access, and difficulties in meeting strict compliance", "Guaranteed zero risk of data loss", "Instant physical security of local paper files", "Elimination of all password requirements"], "a": 0, "e": "Correct answer ✓\nSecurity risks include cyberattacks, breaches, and compliance difficulties.", "type": "MCQ." },
            { "q": "What does 'Vendor Lock-In' refer to as a cloud challenge?", "o": ["Moving data between cloud providers can be costly and complex due to proprietary formats restricting flexibility", "The ability to switch cloud providers instantly for free without restrictions", "Renting physical office buildings from a landlord", "Locking office doors during server maintenance"], "a": 0, "e": "Correct answer ✓\nVendor lock-in makes moving between providers costly and complex due to proprietary formats.", "type": "MCQ." },
            { "q": "Why is Data Integration Complexity considered a major cloud challenge?", "o": ["Integrating data from on-premise, hybrid, and multi-cloud systems is challenging due to lack of standardization", "Data integration is instantaneous and requires zero configuration", "Cloud providers all use identical standardized protocols", "On-premise systems cannot connect to networks"], "a": 0, "e": "Correct answer ✓\nIntegration complexity arises from mixing on-premise, hybrid, and multi-cloud systems without standardization.", "type": "MCQ." },
            { "q": "What causes High Costs as a cloud challenge?", "o": ["Unexpected expenses due to storage, bandwidth, retrieval fees, and inefficient resource allocation", "Fixed monthly subscriptions with no extra fees", "Free unlimited storage and bandwidth", "Elimination of all cloud resource consumption"], "a": 0, "e": "Correct answer ✓\nHigh costs stem from unexpected storage, bandwidth, retrieval fees, and inefficient allocation.", "type": "MCQ." },
            { "q": "What are Data Latency & Performance Issue causes in cloud environments?", "o": ["Large datasets causing slow access across regions and network bottlenecks affecting real-time analytics", "Instantaneous data transmission across light-speed local busses", "Absence of network cables", "Running all computations on a single local desktop"], "a": 0, "e": "Correct answer ✓\nLatency and performance issues arise from large datasets across regions and network bottlenecks.", "type": "MCQ." },
            { "q": "Why are Compliance & Legal Issues complex in cloud computing?", "o": ["Different regions have different data residency laws, making ongoing compliance resource-heavy", "All countries share identical legal data laws", "Cloud data never crosses regional boundaries", "Legal regulations do not apply to digital data"], "a": 0, "e": "Correct answer ✓\nCompliance is complex because different regions enforce different data residency laws.", "type": "MCQ." },
            { "q": "What issues arise from Data Governance & Quality Control challenges in distributed clouds?", "o": ["Maintaining consistent, clean, and reliable data is hard, leading to potential data duplication and inconsistency", "Data automatically cleans and organizes itself perfectly", "Data duplication becomes impossible", "Consistency is naturally guaranteed across all nodes"], "a": 0, "e": "Correct answer ✓\nGovernance challenges cause difficulties in maintaining clean data, leading to duplication and inconsistency.", "type": "MCQ." },
            { "q": "What are Disaster Recovery Limitations in cloud systems?", "o": ["While clouds provide DR solutions, recovery speed and cost may not always meet business requirements", "Cloud disaster recovery is always instantaneous and completely free", "Backups are physically impossible in cloud setups", "Disaster recovery never encounters cost barriers"], "a": 0, "e": "Correct answer ✓\nDR limitations mean recovery speed and cost may not always meet business needs.", "type": "MCQ." },
            { "q": "What are the main advantages of Public Clouds?", "o": ["Cost-effective (pay-as-you-go), high scalability/flexibility, no infrastructure management, and global accessibility", "Complete physical control over server hardware racks", "Isolated offline operation without internet", "Zero shared resource dependency"], "a": 0, "e": "Correct answer ✓\nPublic cloud advantages include cost-effectiveness, scalability, no management, and global access.", "type": "MCQ." },
            { "q": "What are the primary risks of Public Clouds?", "o": ["Security/privacy concerns, compliance issues, less control over infrastructure, and potential downtime from shared resources", "High hardware maintenance costs on-premises", "Complete isolation from external networks", "Mandatory in-house server assembly"], "a": 0, "e": "Correct answer ✓\nPublic cloud risks involve security concerns, compliance, less control, and shared resource downtime.", "type": "MCQ." },
            { "q": "What are the key advantages of Private Clouds?", "o": ["Greater control and customization, enhanced security/compliance, better performance for critical workloads, and dedicated infrastructure", "Pay-as-you-go shared multi-tenant pricing with zero configuration", "Elimination of all IT staff requirements", "Instant global public sharing"], "a": 0, "e": "Correct answer ✓\nPrivate cloud advantages include greater control, security, compliance, and dedicated infrastructure.", "type": "MCQ." },

            { "q": "[HIGH-LEVEL] 41. A multinational enterprise must store sensitive financial records that legally cannot leave the physical borders of Germany due to strict regional regulations, while simultaneously needing elastic public compute power for transient web traffic. Which cloud architecture best satisfies these conflicting requirements?", "o": ["Hybrid Cloud, keeping sensitive data in a private setup while leveraging public cloud scalability", "Public Cloud exclusively for all workloads", "Community Cloud shared with external competitors", "Discarding cloud computing entirely for local pen-and-paper ledgers"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nHybrid cloud combines public and private setups, allowing data and apps to move between them to meet compliance and scale.", "type": "MCQ." },

        const P2_SOURCE = [
            // --- Standard & High-Level True/False (50 Questions) ---
            { "q": "1. Cloud computing delivers computing services including servers, storage, databases, networking, and software over the internet.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Cloud computing delivers these services over the internet.", "type": "TF" },
            { "q": "2. Public clouds are provided by third-party companies where resources are shared among multiple users.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Public clouds are third-party shared environments.", "type": "TF" },
            { "q": "3. Amazon Web Services (AWS), Microsoft Azure, and Google Cloud are examples of Public Clouds.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: AWS, Azure, and GCP are public cloud providers.", "type": "TF" },
            { "q": "4. A private cloud uses dedicated infrastructure shared publicly with any external commercial enterprise.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Private clouds use dedicated infrastructure for a single organization.", "type": "TF" },
            { "q": "5. Private clouds can be hosted on-premises, by a third-party provider, or configured as a Virtual Private Cloud (VPC).", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Private clouds can be on-premises, hosted, or VPC.", "type": "TF" },
            { "q": "6. Hybrid cloud combines public and private clouds, allowing data and apps to move between them.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Hybrid cloud combines public and private clouds.", "type": "TF" },
            { "q": "7. Netflix uses hybrid clouds by storing content on AWS while running analytics in private setups.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Netflix uses AWS for storage and private setups for analytics.", "type": "TF" },
            { "q": "8. Community cloud is a shared infrastructure for a specific group, such as healthcare labs or educational institutions.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Community clouds serve specific groups like healthcare and education.", "type": "TF" },
            { "q": "9. IaaS provides virtualized computing resources such as virtual servers, storage, and networking.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: IaaS provides virtualized storage, networking, and computing resources.", "type": "TF" },
            { "q": "10. Amazon EC2 and Google Compute Engine are examples of PaaS rather than IaaS.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Amazon EC2 and Google Compute Engine are IaaS examples.", "type": "TF" },
            { "q": "11. PaaS provides a platform for developers to build, test, and deploy applications without managing infrastructure.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: PaaS provides a development platform without infrastructure management.", "type": "TF" },
            { "q": "12. Google App Engine and Microsoft Azure App Service are examples of PaaS.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Google App Engine and Azure App Service are PaaS examples.", "type": "TF" },
            { "q": "13. SaaS delivers software applications over the internet on a subscription basis.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: SaaS delivers software over the internet on subscription.", "type": "TF" },
            { "q": "14. Gmail, Microsoft 365, and Dropbox are examples of SaaS.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Gmail, M365, and Dropbox are SaaS examples.", "type": "TF" },
            { "q": "15. Cloud computing goals include Data Availability & Accessibility, Scalability, and Data Security & Compliance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Availability, scalability, and security are core cloud goals.", "type": "TF" },
            { "q": "16. Scalability in cloud computing supports both structured and unstructured data as storage grows.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Scalability supports both structured and unstructured data expansion.", "type": "TF" },
            { "q": "17. Compliance standards supported by cloud security include GDPR, HIPAA, and ISO.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: GDPR, HIPAA, and ISO are standard compliance frameworks supported.", "type": "TF" },
            { "q": "18. Cost efficiency in cloud computing is achieved through pay-as-you-go models.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Pay-as-you-go models deliver cost efficiency.", "type": "TF" },
            { "q": "19. Data integration and interoperability enable smooth integration across multiple applications, services, and cloud providers.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Integration and interoperability enable multi-cloud and app connectivity.", "type": "TF" },
            { "q": "20. Automated backup and disaster recovery in cloud goals help reduce downtime during system failures.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Automated backup and recovery ensure business continuity and reduce downtime.", "type": "TF" },
            { "q": "21. Performance optimization in cloud computing targets low-latency access to large datasets and efficient query performance.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Performance optimization ensures low-latency access and efficient queries.", "type": "TF" },
            { "q": "22. Data governance and quality maintain accuracy, consistency, and trustworthiness using metadata and lifecycle policies.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Governance and quality maintain consistency and metadata policies.", "type": "TF" },
            { "q": "23. Vendor lock-in occurs when moving data between cloud providers is costly and complex due to proprietary formats.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Proprietary formats and migration costs cause vendor lock-in.", "type": "TF" },
            { "q": "24. Data integration complexity is non-existent when mixing on-premise, hybrid, and multi-cloud systems.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Integrating on-premise, hybrid, and multi-cloud systems is challenging due to lack of standardization.", "type": "TF" },
            { "q": "25. Unexpected expenses from storage, bandwidth, and retrieval fees contribute to high cloud costs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Storage, bandwidth, and retrieval fees can cause unexpected high expenses.", "type": "TF" },
            { "q": "26. Data latency and performance issues in cloud computing are never affected by network bottlenecks or distributed regions.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Network bottlenecks and regional distance cause latency and performance issues.", "type": "TF" },
            { "q": "27. Different regions enforcing different data residency laws create complex compliance and legal issues for cloud users.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Regional data residency laws make compliance complex.", "type": "TF" },
            { "q": "28. Maintaining consistent, clean data across distributed cloud systems is effortless and never leads to duplication.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Maintaining clean data across distributed systems is hard and prone to duplication/inconsistency.", "type": "TF" },
            { "q": "29. Disaster recovery solutions in the cloud always guarantee instant recovery speeds with zero cost barriers.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Recovery speed and cost may not always meet business requirements.", "type": "TF" },
            { "q": "30. Public clouds offer advantages such as cost-effectiveness, high scalability, and no infrastructure management.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Public clouds provide cost-effectiveness, scalability, and no management.", "type": "TF" },
            { "q": "31. Private clouds provide greater control, customization, enhanced security, and dedicated infrastructure.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Private clouds offer control, security, and dedicated infrastructure.", "type": "TF" },
            { "q": "32. Private clouds are invariably cheaper to deploy and maintain than public clouds.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Private clouds involve higher hardware and maintenance costs.", "type": "TF" },
            { "q": "33. Hybrid clouds combine public and private benefits but introduce complex management and integration challenges.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Hybrid clouds balance benefits but involve complex management and integration risks.", "type": "TF" },
            { "q": "34. Community clouds are the most common deployment model used by individual consumer shoppers.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Community clouds are less common and shared by specific groups like healthcare/education.", "type": "TF" },
            { "q": "35. SaaS applications require users to manage local database servers and server operating systems manually.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: SaaS delivers software over the internet on a subscription basis without local server management.", "type": "TF" },
            { "q": "36. Encryption, authentication, and access control are core mechanisms for cloud data security.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Encryption, authentication, and access control protect cloud data.", "type": "TF" },
            { "q": "37. Multi-cloud strategies are supported by cloud data integration and interoperability goals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Integration supports multi-cloud and hybrid strategies.", "type": "TF" },
            { "q": "38. Inefficient resource allocation in cloud environments can lead to unexpected high costs.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Inefficient resource allocation increases cloud expenses.", "type": "TF" },
            { "q": "39. Public clouds offer absolute complete physical control over underlying server hardware racks for every tenant.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Public clouds involve less control over infrastructure due to shared multi-tenant resources.", "type": "TF" },
            { "q": "40. Cloud computing entirely eliminates the need for disaster recovery planning because failures never occur.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Disaster recovery and backup are essential goals precisely because system failures and downtime can occur.", "type": "TF" },

            // --- High-Level True/False (41 to 50) ---
            { "q": "[HIGH-LEVEL] 41. True or False: A hybrid cloud architecture allows organizations to keep sensitive workloads in a private cloud while bursting transient computing tasks to a public cloud.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Hybrid cloud combines public and private clouds, allowing data and apps to move between them.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 42. True or False: Vendor lock-in is advantageous because proprietary cloud formats guarantee effortless zero-cost migration between competing cloud vendors at any time.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Vendor lock-in makes moving between cloud providers costly and complex due to proprietary formats.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 43. True or False: PaaS relieves software developers from managing underlying operating systems and servers, enabling them to focus purely on application development.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: PaaS provides a platform for developers to build, test, and deploy without managing infrastructure.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 44. True or False: Data residency laws across different geographic regions have zero impact on cloud compliance and legal strategies.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Different regions have different data residency laws, making ongoing compliance complex.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 45. True or False: In a public cloud, shared multi-tenant resources can occasionally introduce risks of downtime or security concerns compared to dedicated private infrastructure.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Public cloud risks include security concerns and potential downtime due to shared resources.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 46. True or False: Automated backup and disaster recovery mechanisms in cloud computing are designed to support business continuity and reduce downtime during system failures.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Backup and disaster recovery provide business continuity and reduce downtime.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 47. True or False: Private clouds provide unlimited scalability superior to public clouds with lower initial hardware costs.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Private clouds involve higher costs and limited scalability compared to public clouds.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 48. True or False: Data governance and quality control in distributed cloud environments are trivial tasks that never encounter data duplication or inconsistency.", "o": ["True", "False"], "a": 1, "e": "[HIGH-LEVEL] Correct answer ✓\nFalse: Maintaining consistent, clean data across distributed systems is hard and prone to duplication and inconsistency.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 49. True or False: Community clouds provide a collaborative shared infrastructure tailored to the specific security and operational needs of groups like hospitals or educational institutions.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Community clouds provide shared infrastructure for specific groups like healthcare and education.", "type": "TF" },
            { "q": "[HIGH-LEVEL] 50. True or False: Performance optimization in cloud data management aims to deliver low-latency access to large datasets and ensure efficient query execution across distributed regions.", "o": ["True", "False"], "a": 0, "e": "[HIGH-LEVEL] Correct answer ✓\nTrue: Performance optimization delivers low-latency access and efficient data/query performance.", "type": "TF" }
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            let diagHtml = q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : '';
            
            $("card").innerHTML = `
                <span class="q-badge">${q.type === 'TF' ? 'True / False' : 'Multiple Choice'}</span>
                <p class="q">${q.q}</p>
                ${diagHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
