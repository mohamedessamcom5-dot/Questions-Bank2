<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Data Management</title>
    <style>
        :root {
            --bg: #0f172a;
            --c: #1e293b;
            --t: #f8fafc;
            --m: #94a3b8;
            --b: #334155;
            --ac: #38bdf8;
            --ok: #22c55e;
            --okb: #052e16;
            --no: #ef4444;
            --nob: #450a0a;
            box-sizing: border-box;
        }

        @media(prefers-color-scheme: light) {
            :root[data-theme=light] {
                --bg: #f8fafc;
                --c: #ffffff;
                --t: #0f172a;
                --m: #64748b;
                --b: #e2e8f0;
                --ac: #0284c7;
                --okb: #dcfce7;
                --nob: #fee2e2;
                --ok: #16a34a;
                --no: #dc2626;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .header-panel {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 8px solid var(--b);
            padding-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--ac); }
        .sub { color: var(--m); font-size: 0.95rem; margin: 0; }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--c);
            border: 1px solid var(--b);
            color: var(--t);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--ac);
            color: #000;
            border-color: var(--ac);
        }

        .bar {
            height: 8px;
            background: var(--b);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            width: 0;
            transition: width 0.3s;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--m);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .q-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--b);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--ac);
        }
        .q {
            font-size: 1.1rem;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            margin: 0 0 16px;
        }
        .diagram-container {
            direction: ltr;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--b);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .opt {
            display: flex;
            gap: 12px;
            direction: ltr;
            text-align: left;
            width: 100%;
            background: var(--c);
            color: var(--t);
            border: 1.5px solid var(--b);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .opt:hover:not(:disabled) { border-color: var(--ac); }
        .opt b { min-width: 1.5em; color: var(--ac); }
        .opt.ok { background: var(--okb); border-color: var(--ok); }
        .opt.no { background: var(--nob); border-color: var(--no); }
        .opt:disabled { cursor: default; }

        .ex {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            direction: ltr;
            text-align: left;
            font-size: 0.95rem;
        }
        .ex.ok { background: var(--okb); border: 1px solid var(--ok); }
        .ex.no { background: var(--nob); border: 1px solid var(--no); }
        .ex strong { display: block; margin-bottom: 4px; }

        .btn {
            margin-top: 16px;
            background: var(--ac);
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 12px 24px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        .score { text-align: center; font-size: 3rem; font-weight: 800; margin: 12px 0; color: var(--ac); }
        .rev { margin: 16px 0 0; padding: 0; list-style: none; direction: ltr; text-align: left; font-size: 0.9rem; }
        .rev li { padding: 8px 0; border-top: 1px solid var(--b); }
    </style>
    <link rel="stylesheet" href="../site-theme.css">
</head>
<body>
    <main>
        <div class="header-panel">
            <h1>Data Management — Chapter 3</h1>
            <p class="sub">Data Types</p>
        </div>
    
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab1" onclick="switchPart(1)">Multiple Choice</button>
            <button class="tab-btn" id="tab2" onclick="switchPart(2)">True/False</button>
        </div>
    
        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
            <span id="n"></span>
            <span id="s"></span>
        </div>
        <div class="card" id="card"></div>
    </main>
    
    <script>
        const P1_SOURCE = [
            // --- MCQs (50 Questions) ---
            { "q": "What are the four broad categories of data analytics?", "o": ["Descriptive, diagnostic, predictive, and prescriptive", "Categorical, ordinal, interval, and ratio", "Primitive, composite, user-defined, and casting", "Integer, float, char, and boolean"], "a": 0, "e": "Correct answer ✓\nData analytics is broadly categorized into descriptive, diagnostic, predictive, and prescriptive.", "type": "MCQ" },
            { "q": "Which analytic data type answers the question 'What happened?' by summarizing historical data?", "o": ["Descriptive analytics", "Diagnostic analytics", "Predictive analytics", "Prescriptive analytics"], "a": 0, "e": "Correct answer ✓\nDescriptive analytics summarizes past/historical data and answers 'What happened?'.", "type": "MCQ" },
            { "q": "What is the primary focus of diagnostic analytics?", "o": ["Investigating data to explain 'Why did it happen?'", "Forecasting future trends using machine learning", "Recommending optimal decisions", "Summarizing past monthly sales dashboards"], "a": 0, "e": "Correct answer ✓\nDiagnostic analytics investigates data to explain 'Why did it happen?'.", "type": "MCQ" },
            { "q": "Which type of analytics uses statistical models and machine learning to answer 'What is likely to happen?'", "o": ["Predictive analytics", "Descriptive analytics", "Diagnostic analytics", "Prescriptive analytics"], "a": 0, "e": "Correct answer ✓\nPredictive analytics uses statistical models and ML to forecast what is likely to happen.", "type": "MCQ" },
            { "q": "What does prescriptive analytics aim to answer?", "o": ["'What should we do?' by recommending optimal decisions", "'What happened?' through historical dashboards", "'Why did it happen?' through root cause analysis", "'What is likely to happen?' through risk prediction"], "a": 0, "e": "Correct answer ✓\nPrescriptive analytics recommends optimal decisions and answers 'What should we do?'.", "type": "MCQ" },
            { "q": "Which data type consists of named categories with no inherent order?", "o": ["Categorical (Nominal) Data", "Ordinal Data", "Interval Data", "Ratio Data"], "a": 0, "e": "Correct answer ✓\nCategorical (nominal) data features named categories with no inherent order.", "type": "MCQ" },
            { "q": "What is an example of categorical (nominal) data?", "o": ["Gender, Eye Color, Marital Status", "Education Level, Satisfaction Rating", "Temperature in Celsius, IQ scores", "Height, Weight, Income, Age"], "a": 0, "e": "Correct answer ✓\nExamples of nominal data include gender, eye color, and marital status.", "type": "MCQ" },
            { "q": "How is ordinal data characterized?", "o": ["Categories with a meaningful order but unequal intervals", "Numeric data with equal intervals and a true zero", "Unordered collection of unique elements", "Single Unicode characters enclosed in single quotes"], "a": 0, "e": "Correct answer ✓\nOrdinal data features categories with a meaningful order but unequal intervals.", "type": "MCQ" },
            { "q": "Which data type features numeric data with equal intervals and NO true zero?", "o": ["Interval Data", "Ratio Data", "Nominal Data", "Ordinal Data"], "a": 0, "e": "Correct answer ✓\nInterval data has numeric values with equal intervals and no true zero.", "type": "MCQ" },
            { "q": "What is an example of interval data?", "o": ["Temperature in Celsius and IQ scores", "Height and Weight", "Gender and Eye Color", "Likert survey scales"], "a": 0, "e": "Correct answer ✓\nExamples of interval data include temperature in Celsius and IQ scores.", "type": "MCQ" },
            { "q": "Which data type features numeric data with equal intervals AND a true zero?", "o": ["Ratio Data", "Interval Data", "Ordinal Data", "Categorical Data"], "a": 0, "e": "Correct answer ✓\nRatio data features numeric data with equal intervals and a true zero.", "type": "MCQ" },
            { "q": "Which of the following is an example of ratio data?", "o": ["Height, Weight, Income, Age", "Temperature in Celsius, IQ scores", "Strongly disagree to strongly agree survey scale", "Gender and marital status"], "a": 0, "e": "Correct answer ✓\nExamples of ratio data include height, weight, income, and age.", "type": "MCQ" },
            { "q": "What are Special Ordinal (Likert-Type) Data used for?", "o": ["Measuring attitudes and perceptions using ordered survey scales", "Storing integer mathematical loops", "Performing implicit type casting in Java", "Managing database table connections"], "a": 0, "e": "Correct answer ✓\nLikert-type data uses ordered survey scales to measure attitudes and perceptions.", "type": "MCQ" },
            { "q": "What are primitive data types in programming languages?", "o": ["The most basic data types representing simple, fundamental values built into the language", "Complex structured units combining multiple elements", "User-defined structures created via structs and classes", "Dynamic arrays that allow mixed types"], "a": 0, "e": "Correct answer ✓\nPrimitive types are basic data types representing simple, fundamental values built into the language.", "type": "MCQ" },
            { "q": "Which integer (int) example is valid according to the text?", "o": ["int age = -5;", "float price = 9.99;", "char grade = 'A';", "boolean isOnline = true;"], "a": 0, "e": "Correct answer ✓\nint age = -5; is an example of an integer representing whole numbers.", "type": "MCQ" },
            { "q": "What are the main features of floating point (float/double) data types?", "o": ["Numbers with decimals, single or double precision", "Whole numbers with no decimals", "Single Unicode characters enclosed in single quotes", "Logical values of true or false"], "a": 0, "e": "Correct answer ✓\nFloating point numbers have decimals and single or double precision.", "type": "MCQ" },
            { "q": "How is a character (char) data type defined in programming?", "o": ["A single Unicode character enclosed in single quotes", "A sequence of strings enclosed in double quotes", "A collection of numbers with decimals", "A boolean flag representing true or false"], "a": 0, "e": "Correct answer ✓\nChar stores a single Unicode character enclosed in single quotes.", "type": "MCQ" },
            { "q": "What values do boolean data types represent?", "o": ["Logical values: true or false", "Numerical integers from -100 to 100", "Calendar dates in YYYY-MM-DD format", "Dynamic list items"], "a": 0, "e": "Correct answer ✓\nBoolean represents logical values true or false.", "type": "MCQ" },
            { "q": "Which date data type format is typically used to store calendar dates without a time component?", "o": ["YYYY-MM-DD", "HH:MM:SS", "YYYY-MM-DD HH:MM:SS", "Unicode single quote format"], "a": 0, "e": "Correct answer ✓\nDate data type stores year, month, day typically in YYYY-MM-DD format.", "type": "MCQ" },
            { "q": "What does a time data type store?", "o": ["Only the time of day (hours, minutes, seconds) without a date component", "Both calendar date and time of day", "Whole numbers for array indexing", "Key-value dictionary pairs"], "a": 0, "e": "Correct answer ✓\nTime stores only the time of day without a date component.", "type": "MCQ" },
            { "q": "What does a datetime/timestamp data type combine?", "o": ["Both calendar date and time of day", "Array indices and dynamic list sizes", "Boolean true/false flags", "Single characters and floats"], "a": 0, "e": "Correct answer ✓\nDatetime/timestamp combines both calendar date and time of day.", "type": "MCQ" },
            { "q": "What are composite data types (structured or complex data types)?", "o": ["Data types constructed by combining multiple individual data elements into a single, cohesive unit", "Basic fundamental values built into the language itself", "User-defined object classes in Java", "Automatic compiler type casting operations"], "a": 0, "e": "Correct answer ✓\nComposite types combine multiple individual elements into a single cohesive unit.", "type": "MCQ" },
            { "q": "What are the main features of an array?", "o": ["Collection of same data type, fixed size, accessed by index", "Ordered, dynamic size, mixed types allowed", "Key-value unique pairs with fast access", "Unordered collection of unique elements only"], "a": 0, "e": "Correct answer ✓\nAn array is a fixed-size collection of the same data type accessed by index.", "type": "MCQ" },
            { "q": "Which composite data type is ordered, has a dynamic size, and allows mixed types (e.g., in Python)?", "o": ["List (Dynamic Array)", "Array", "Tuple", "Set"], "a": 0, "e": "Correct answer ✓\nA list is an ordered, dynamic size collection allowing mixed types.", "type": "MCQ" },
            { "q": "What are the key features of a tuple?", "o": ["Ordered, immutable, can store multiple data types", "Unordered collection of unique elements", "Fixed size collection of the same data type", "Key-value unique pairs"], "a": 0, "e": "Correct answer ✓\nA tuple is ordered and immutable, capable of storing multiple data types.", "type": "MCQ" },
            { "q": "How do dictionary / map data types store information?", "o": ["In unique key-value pairs for fast access by key", "In fixed-size integer indexed arrays", "In immutable ordered tuples", "In single Unicode character strings"], "a": 0, "e": "Correct answer ✓\nDictionaries store data in unique key-value pairs with fast access by key.", "type": "MCQ" },
            { "q": "What is a main feature of a set in programming?", "o": ["Unordered collection with unique elements only (no duplicates)", "Fixed size collection of identical data types", "Ordered mutable list with index access", "Key-value structured map"], "a": 0, "e": "Correct answer ✓\nA set is an unordered collection containing unique elements only.", "type": "MCQ" },
            { "q": "What are User-Defined Data Types (UDTs) used for?", "o": ["Modeling real-world entities, grouping related variables, and enabling encapsulation", "Automatically converting integers to floats during compilation", "Summarizing historical descriptive analytics dashboards", "Storing single Unicode characters in single quotes"], "a": 0, "e": "Correct answer ✓\nUDTs model real-world entities, group related variables, and enable encapsulation.", "type": "MCQ" },
            { "q": "In C/C++, what is a structure (`struct`) used for?", "o": ["Groups student attributes (like name, age, gpa) under a single custom type", "Stores different data types in the exact same memory location", "Defines a set of named constants like days of the week", "Combines methods and object-oriented classes"], "a": 0, "e": "Correct answer ✓\nStruct groups student attributes under a single custom type.", "type": "MCQ" },
            { "q": "What does a `class` in Java/Python/C++ combine?", "o": ["Data and behavior (methods), used for object-oriented programming design", "Different data types in the same memory location to save space", "Fixed-size arrays of identical primitive types", "Unordered unique set elements"], "a": 0, "e": "Correct answer ✓\nA class combines data and behavior (methods) for OOP design.", "type": "MCQ" },
            { "q": "What is an `enum` used for in C, Java, or Python?", "o": ["Defines a set of named constants (e.g., days of the week, colors)", "Stores floating point decimal numbers", "Automatically performs explicit type casting", "Combines date and time into a timestamp"], "a": 0, "e": "Correct answer ✓\nEnum defines a set of named constants.", "type": "MCQ" },
            { "q": "What is a unique feature of a `union` in C?", "o": ["Stores different data types in the same memory location to save space", "Creates immutable ordered tuples", "Combines object methods and classes", "Enforces strict dynamic list sizing"], "a": 0, "e": "Correct answer ✓\nA union stores different data types in the same memory location to save space.", "type": "MCQ" },
            { "q": "What is Type Casting in programming?", "o": ["The process of converting a variable from one data type to another, either automatically or manually", "Defining custom user classes and structures", "Creating fixed-size primitive integer arrays", "Querying historical database timestamps"], "a": 0, "e": "Correct answer ✓\nType casting converts a variable from one data type to another automatically or manually.", "type": "MCQ" },
            { "q": "What are the main features of implicit type casting?", "o": ["Automatically done by the compiler, converts smaller data type to larger one, no data loss", "Performed manually by the programmer, converts larger data type to smaller one", "Always results in severe data truncation and precision loss", "Restricted exclusively to user-defined classes in Java"], "a": 0, "e": "Correct answer ✓\nImplicit casting is done automatically by the compiler from smaller to larger with no data loss.", "type": "MCQ" },
            { "q": "What are the main features of explicit type casting?", "o": ["Performed manually by the programmer, converts larger data type to smaller one, may lead to data loss or truncation", "Automatically handled by the compiler with zero data loss", "Converts integer variables into boolean true/false flags automatically", "Restricts arrays to fixed-size primitive data types"], "a": 0, "e": "Correct answer ✓\nExplicit casting is performed manually and may lead to data loss or truncation.", "type": "MCQ" },
            { "q": "Which code snippet demonstrates implicit type casting in the text?", "o": ["int a = 10; float b = a;", "float pi = 3.14; int num = (int) pi;", "int age = -5;", "char grade = 'A';"], "a": 0, "e": "Correct answer ✓\nint a = 10; float b = a; converts int to float automatically.", "type": "MCQ" },
            { "q": "What type of analytics would suggest the best delivery routes for cost and time efficiency?", "o": ["Prescriptive analytics", "Descriptive analytics", "Diagnostic analytics", "Predictive analytics"], "a": 0, "e": "Correct answer ✓\nPrescriptive analytics suggests best delivery routes for cost and time efficiency.", "type": "MCQ" },
            { "q": "Which type of analytics analyzes reasons for a drop in sales in a specific region?", "o": ["Diagnostic analytics", "Predictive analytics", "Prescriptive analytics", "Descriptive analytics"], "a": 0, "e": "Correct answer ✓\nDiagnostic analytics investigates reasons for a drop in sales in a specific region.", "type": "MCQ" },
            { "q": "What is an example of predictive analytics?", "o": ["Predicting customer churn based on historical purchase patterns", "Monthly sales dashboard for the past year", "Suggesting best delivery routes", "Tracking login timestamps in SQL"], "a": 0, "e": "Correct answer ✓\nPredicting customer churn based on historical purchase patterns is predictive analytics.", "type": "MCQ" },
            { "q": "Which of the following data types has categories with a meaningful order but unequal intervals?", "o": ["Ordinal Data", "Nominal Data", "Interval Data", "Ratio Data"], "a": 0, "e": "Correct answer ✓\nOrdinal data features categories with meaningful order but unequal intervals.", "type": "MCQ" },
            { "q": "Which SQL data type example represents a date value of July 30, 2025?", "o": ["DATE '2025-07-30'", "TIME '14:30:00'", "TIMESTAMP '2025-07-30 14:30:00'", "LocalDate.of(2025, 7, 30)"], "a": 0, "e": "Correct answer ✓\nSQL DATE '2025-07-30' represents the calendar date.", "type": "MCQ" },
            { "q": "What is the SQL format example for a Time data type?", "o": ["TIME '14:30:00'", "DATE '2025-07-30'", "TIMESTAMP '2025-07-30 14:30:00'", "datetime(2025, 7, 30, 14, 30, 0)"], "a": 0, "e": "Correct answer ✓\nSQL TIME '14:30:00' represents the time of day.", "type": "MCQ" },
            { "q": "In Python, how is a tuple example represented?", "o": ["user = (\"Alice\", 25, \"Engineer\")", "person = {\"name\": \"Alice\", \"age\": 30}", "unique_numbers = {1, 2, 3}", "int scores[5] = {90, 85, 88}"], "a": 0, "e": "Correct answer ✓\nuser = (\"Alice\", 25, \"Engineer\") is an example of a Python tuple.", "type": "MCQ" },
            { "q": "How is a dictionary / map represented in Python according to the text?", "o": ["person = {\"name\": \"Alice\", \"age\": 30}", "items = [23, \"apple\", True]", "user = (\"Alice\", 25, \"Engineer\")", "unique_numbers = {1, 2, 3, 3}"], "a": 0, "e": "Correct answer ✓\nperson = {\"name\": \"Alice\", \"age\": 30} is a dictionary example.", "type": "MCQ" },
            { "q": "What does explicit type casting look like in C/C++ when converting a float to an int?", "o": ["int num = (int) pi; // result: 3", "float b = a; // int to float automatically", "int age = -5;", "char grade = 'A';"], "a": 0, "e": "Correct answer ✓\nint num = (int) pi; performs explicit type casting from float to int.", "type": "MCQ" },
            { "q": "Which of the following is considered a composite data type?", "o": ["Array, List, Tuple, Dictionary, Set", "Integer, Float, Char, Boolean", "Struct, Class, Enum, Union", "Descriptive, Diagnostic, Predictive"], "a": 0, "e": "Correct answer ✓\nArrays, lists, tuples, dictionaries, and sets are composite data types.", "type": "MCQ" },
            { "q": "Which of the following is categorized as a user-defined data type (UDT)?", "o": ["Struct, Class, Enum, Union", "Array, List, Tuple, Set", "Int, Float, Char, Boolean, Date", "Nominal, Ordinal, Interval, Ratio"], "a": 0, "e": "Correct answer ✓\nStruct, class, enum, and union are user-defined data types.", "type": "MCQ" },
            { "q": "What is the primary purpose of data analytics categories (Descriptive, Diagnostic, Predictive, Prescriptive)?", "o": ["To represent different stages of data analysis offering varying levels of insight into past, present, and future trends", "To define primitive compiler memory allocations", "To enforce strict boolean conditional structures in Java", "To manage relational database table connections"], "a": 0, "e": "Correct answer ✓\nThey represent different stages of data analysis offering varying levels of insight into past, present, and future trends.", "type": "MCQ" },
            { "q": "Which of the following statements about primitive data types is correct?", "o": ["They represent simple, fundamental values and cannot be broken down into simpler components", "They are structured units combining multiple dictionaries and lists", "They require explicit compiler casting for every integer addition", "They store complex object-oriented methods and behaviors"], "a": 0, "e": "Correct answer ✓\nPrimitive types represent simple, fundamental values and cannot be broken down.", "type": "MCQ" },
            { "q": "What is a primary use case of a set data type?", "o": ["To store non-duplicate items and perform set operations", "To maintain ordered index-based scores", "To store key-value unique pairs with fast label access", "To represent immutable multiple return values"], "a": 0, "e": "Correct answer ✓\nA set stores non-duplicate items and performs set operations.", "type": "MCQ" }

        const P2_SOURCE = [

            { "q": "5. Categorical (nominal) data consists of named categories with a strict numerical order.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Nominal data features named categories with NO inherent order.", "type": "TF" },

            { "q": "7. Interval data includes a true zero point where zero represents the complete absence of the property.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Interval data has equal intervals but NO true zero.", "type": "TF" },

            { "q": "10. Height, weight, income, and age are examples of ratio data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Height, weight, income, and age are ratio data.", "type": "TF" },
            { "q": "11. Special ordinal (Likert-type) data are ordered survey scales often treated as interval data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Likert-type data are ordered survey scales often treated as interval data.", "type": "TF" },
            { "q": "12. Primitive data types can be easily broken down into simpler composite components like arrays and lists.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Primitive types cannot be broken down into simpler components.", "type": "TF" },
            { "q": "13. An integer (int) data type represents whole numbers (positive or negative) with no decimals.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Integers represent whole numbers with no decimals.", "type": "TF" },
            { "q": "14. Floating point data types represent numbers with decimals and can be single or double precision.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Floating point types represent numbers with decimals and precision.", "type": "TF" },
            { "q": "15. A character (char) data type stores a single Unicode character enclosed in double quotes.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Chars are enclosed in SINGLE quotes, not double quotes.", "type": "TF" },
            { "q": "16. Boolean data types represent logical values such as true or false.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Booleans represent logical true or false values.", "type": "TF" },

            { "q": "20. Composite data types are constructed by combining multiple individual data elements into a single, cohesive unit.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Composite data types combine multiple elements into a single cohesive unit.", "type": "TF" },
            { "q": "21. An array is a collection of the same data type with a fixed size and is accessed by index.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Arrays have the same data type, fixed size, and index access.", "type": "TF" },
            { "q": "22. A list (dynamic array) has a fixed size and does not allow mixed data types.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Lists have a dynamic size and allow mixed types.", "type": "TF" },
            { "q": "23. A tuple is an ordered, immutable composite data type that can store multiple data types.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Tuples are ordered, immutable, and can store multiple data types.", "type": "TF" },
            { "q": "24. A dictionary or map stores data in key-value pairs where keys must be unique.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Dictionaries use unique keys in key-value pairs.", "type": "TF" },
            { "q": "25. A set is an ordered collection that allows duplicate items.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Sets are UNORDERED and contain UNIQUE elements only (no duplicates).", "type": "TF" },
            { "q": "26. User-Defined Data Types (UDTs) are created by programmers to represent complex or custom data structures.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: UDTs are created by programmers for custom data structures.", "type": "TF" },
            { "q": "27. A `struct` in C/C++ groups related student attributes under a single custom type.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Struct groups student attributes under a single custom type.", "type": "TF" },
            { "q": "28. A `class` in Java, Python, or C++ combines data and behavior (methods) for OOP design.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Classes combine data and behavior for OOP design.", "type": "TF" },
            { "q": "29. An `enum` is used in C, Java, and Python to define a set of named constants like days of the week.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Enum defines a set of named constants.", "type": "TF" },
            { "q": "30. A `union` in C stores different data types in the same memory location to save space.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Unions store different data types in the same memory location to save space.", "type": "TF" },
            { "q": "31. Type casting is the process of converting a variable from one data type to another automatically or manually.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Type casting converts variables between data types automatically or manually.", "type": "TF" },
            { "q": "32. Implicit type casting is performed manually by the programmer and converts larger data types to smaller ones.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Implicit casting is done automatically by the compiler, converting smaller to larger types.", "type": "TF" },
            { "q": "33. Implicit type casting is automatically done by the compiler, converting a smaller data type to a larger one with no data loss.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Implicit casting is automatic from smaller to larger with no data loss.", "type": "TF" },
            { "q": "34. Explicit type casting is performed manually by the programmer and may lead to data loss or truncation when converting a larger data type to a smaller one.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Explicit casting is manual and may cause data loss or truncation.", "type": "TF" },
            { "q": "35. Diagnostic analytics is used to summarize monthly sales dashboards for the past year.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Summarizing past monthly sales dashboards is descriptive analytics; diagnostic investigates 'Why did it happen?'.", "type": "TF" },
            { "q": "36. Analyzing reasons for a drop in sales in a specific region is an example of diagnostic analytics.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Analyzing reasons for sales drops is diagnostic analytics.", "type": "TF" },
            { "q": "37. Predicting customer churn based on historical purchase patterns is an example of descriptive analytics.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Predicting customer churn is predictive analytics.", "type": "TF" },
            { "q": "38. Suggesting best delivery routes for cost and time efficiency is an example of prescriptive analytics.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Suggesting best delivery routes is prescriptive analytics.", "type": "TF" },
            { "q": "39. Nominal data can be subjected to arithmetic operations like division and multiplication.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Nominal data represents named categories with no order and cannot undergo arithmetic operations.", "type": "TF" },
            { "q": "40. Education level and satisfaction rating are examples of ordinal data.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Education level and satisfaction ratings are ordinal data.", "type": "TF" },
            { "q": "41. In Java, `LocalDate.of(2025, 7, 30)` is a valid example of storing a Date data type.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `LocalDate.of(2025, 7, 30)` is the Java example for Date.", "type": "TF" },
            { "q": "42. Arrays in programming can dynamically resize themselves and mix strings with integers freely.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Arrays have a fixed size and hold the same data type; lists handle dynamic sizing and mixed types.", "type": "TF" },
            { "q": "43. Python lists are ordered and dynamic in size, allowing mixed data types.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Python lists are ordered, dynamic in size, and allow mixed types.", "type": "TF" },
            { "q": "44. Sets automatically eliminate duplicate elements, ensuring unique items only.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Sets store unique elements only.", "type": "TF" },
            { "q": "45. In C, explicit casting from float to int like `int num = (int) pi;` results in truncating decimals (e.g., resulting in 3).", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: `int num = (int) pi;` results in 3 due to truncation.", "type": "TF" },
            { "q": "46. The four stages of analytic data types offer varying levels of insight into past, present, and future trends.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: They represent different stages offering insights into past, present, and future trends.", "type": "TF" },
            { "q": "47. Job descriptions and task analyses are part of Chapter 3 data types study topics.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Job descriptions and task analyses belong to HR management chapters (like Chapter 5 and 6), not Chapter 3 Data Types.", "type": "TF" },
            { "q": "48. Primitive data types are built into the language itself and represent simple, fundamental values.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: Primitive types are built-in and represent simple fundamental values.", "type": "TF" },
            { "q": "49. Dictionaries and maps provide slow access by key and require non-unique key strings.", "o": ["True", "False"], "a": 1, "e": "Correct answer ✓\nFalse: Dictionaries provide FAST access by key and require UNIQUE keys.", "type": "TF" },
            { "q": "50. User-defined data types are common in Object-Oriented Programming (OOP) and strongly typed languages.", "o": ["True", "False"], "a": 0, "e": "Correct answer ✓\nTrue: UDTs are common in OOP and strongly typed languages.", "type": "TF" }
        ];

        const getQuestionType = question => question.type.replace(/[.!?]+$/, "");

        const P1_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "MCQ"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "MCQ")
        ];
        const P2_DATA = [
            ...P1_SOURCE.filter(question => getQuestionType(question) === "TF"),
            ...P2_SOURCE.filter(question => getQuestionType(question) === "TF")
        ];

        let activePart = 1;
        let qData = P1_DATA;
        let cIdx = 0;
        let score = 0;
        let wrongList = [];

        const $ = id => document.getElementById(id);

        function switchPart(part) {
            activePart = part;
            $("tab1").className = "tab-btn " + (part === 1 ? "active" : "");
            $("tab2").className = "tab-btn " + (part === 2 ? "active" : "");
            qData = part === 1 ? P1_DATA : P2_DATA;
            resetQuiz();
        }

        function resetQuiz() {
            cIdx = 0;
            score = 0;
            wrongList = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = qData[cIdx];
            $("n").textContent = `Question ${cIdx + 1} of ${qData.length}`;
            $("s").textContent = `Score: ${score}`;
            $("bar").style.width = `${(cIdx / qData.length) * 100}%`;

            let diagHtml = q.diagram ? `<div class="diagram-container">${q.diagram}</div>` : '';
            
            $("card").innerHTML = `
                <span class="q-badge">${q.type === 'TF' ? 'True / False' : 'Multiple Choice'}</span>
                <p class="q">${q.q}</p>
                ${diagHtml}
                <div id="opts"></div>
                <div id="fb"></div>
            `;

            q.o.forEach((optText, i) => {
                const b = document.createElement("button");
                b.className = "opt";
                b.innerHTML = `<b>${q.type === 'TF' ? (i===0?'T':'F') : "ABCD"[i] + ")"}</b><span></span>`;
                b.querySelector("span").textContent = optText;
                b.onclick = () => handleAnswer(i);
                $("opts").appendChild(b);
            });
        }

        function handleAnswer(selected) {
            const q = qData[cIdx];
            const isCorrect = selected === q.a;
            const buttons = document.querySelectorAll(".opt");

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.a) btn.classList.add("ok");
                else if (idx === selected) btn.classList.add("no");
            });

            if (isCorrect) score++;
            else wrongList.push(cIdx);

            $("s").textContent = `Score: ${score}`;

            $("fb").innerHTML = `
                <div class="ex ${isCorrect ? 'ok' : 'no'}">
                    <strong>${isCorrect ? 'Correct answer ✓' : 'Incorrect answer ✗'}</strong>
                    <span>${q.e}</span>
                </div>
                <button class="btn" id="nxtBtn">${cIdx < qData.length - 1 ? 'Next question' : 'Show final results'}</button>
            `;

            $("nxtBtn").onclick = () => {
                cIdx++;
                if (cIdx < qData.length) renderQuestion();
                else finishQuiz();
            };
            $("nxtBtn").focus();
        }

        function finishQuiz() {
            $("bar").style.width = "100%";
            $("n").textContent = "Quiz complete";
            const pct = Math.round((score / qData.length) * 100);

            let html = `
                <div class="score">${score} / ${qData.length}</div>
                <p style="text-align:center;font-size:1.2rem;margin:0 0 16px;">Percentage: <b>${pct}%</b></p>
            `;

            if (wrongList.length > 0) {
                html += `<p style="margin:16px 0 8px;"><b>Questions to review:</b></p><ul class="rev">`;
                wrongList.reverse().forEach(w => {
                    html += `<li><b>Question ${w + 1}:</b> ${qData[w].q}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="text-align:center;color:var(--ok);">Excellent! All answers are correct (100%).</p>`;
            }

            html += `<button class="btn" onclick="resetQuiz()">Restart quiz</button>`;
            $("card").innerHTML = html;
        }

        renderQuestion();
    </script>
</body>
</html>
